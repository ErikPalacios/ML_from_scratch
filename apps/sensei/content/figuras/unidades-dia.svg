<line x1="52" y1="283.1" x2="340" y2="283.1" style="stroke:var(--ink);stroke-width:1.5;stroke-dasharray:5 4"/>
<text class="f-s" x="56" y="277.1" style="font-size:12px;font-weight:700;fill:var(--ink)">promedio ≈ 116</text>
<line x1="52" y1="181.2" x2="340" y2="181.2" style="stroke:var(--b);stroke-width:2"/>
<text class="f-s" x="56" y="175.2" style="font-size:12px;font-weight:700;fill:var(--accent-ink)">pico ≈ 350: la hora de las 20 h</text>
<line x1="52" y1="114" x2="340" y2="114" style="stroke:var(--o);stroke-width:2"/>
<text class="f-s" x="56" y="130" style="font-size:12px;font-weight:700;fill:var(--o)">diseño: 500, con margen</text>
<text class="f-l" x="52" y="350" text-anchor="middle">0 h</text>
<text class="f-l" x="124" y="350" text-anchor="middle">6 h</text>
<text class="f-l" x="196" y="350" text-anchor="middle">12 h</text>
<text class="f-l" x="268" y="350" text-anchor="middle">18 h</text>
<text class="f-l" x="340" y="350" text-anchor="middle">24 h</text>
<text class="f-s" x="28" y="378" style="font-size:12px">Las 24 barras suman los 10 M de fotos del día.</text>
<text class="f-s" x="28" y="398" style="font-size:12px">La hora pico lleva 1/8: 1.25 M ÷ 3,600 s ≈ 347.</text>
<text class="f-s" x="28" y="418" style="font-size:12px">El promedio paga la factura; el pico dimensiona.</text>
</svg>
