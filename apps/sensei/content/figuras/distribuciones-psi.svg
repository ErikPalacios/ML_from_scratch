<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" role="img" aria-labelledby="f-distribuciones-psi-t" class="f-svg" style="max-width:420px">
<title id="f-distribuciones-psi-t">PSI del brillo, bin por bin. Barras de octubre, el esperado: 10, 20, 40, 20 y 10 por ciento. Barras de una semana de noviembre con muchas fotos de noche, el actual: 22, 30, 30, 12 y 6 por ciento. Debajo, lo que aporta cada bin: 0.0946, 0.0405, 0.0288, 0.0409 y 0.0204. El bin 1, el de fotos muy oscuras, aporta más que ningún otro porque más que se duplicó. La suma, el PSI, es 0.2252: un cambio moderado.</title>
<rect class="f-card" x="10" y="10" width="340" height="450" rx="16"/>
