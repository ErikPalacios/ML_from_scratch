<text class="f-s" x="230.8" y="155.0" text-anchor="middle" style="font-size:12px;font-weight:700">20</text>
<rect class="f-o" x="244.8" y="184.0" width="20" height="36.0" rx="3"/>
<text class="f-s" x="254.8" y="179.0" text-anchor="middle" style="font-size:12px;font-weight:700">12</text>
<text class="f-s" x="242.8" y="236.0" text-anchor="middle" style="font-size:12px">bin 4</text>
