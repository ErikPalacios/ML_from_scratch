<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 396" role="img" aria-labelledby="f-concurrencia-linea-t" class="f-svg" style="max-width:420px">
<title id="f-concurrencia-linea-t">Una respuesta del despacho en una L40S, con la GPU libre. Arriba, completa: 2.2 segundos de prefill hasta el primer token (el TTFT) y después 499 tokens, uno cada 50 milisegundos (el TPOT), hasta terminar cerca de los 27.1 segundos. Abajo, los primeros 3 segundos con lupa: el prefill de 6,000 tokens pasa la promesa de 2 segundos antes de que salga el primer token, y luego los tokens siguientes. Total: 2.2 más 499 por 0.05, aproximadamente 27.1 segundos.</title>
<text class="f-l" x="14" y="24">UNA RESPUESTA DEL DESPACHO, EN EL TIEMPO</text>
<rect class="f-card" x="10" y="36" width="340" height="122" rx="16"/>
<text class="f-l" x="26" y="60">COMPLETA: 500 TOKENS, GPU LIBRE</text>
<rect class="f-o" x="26" y="70" width="23.9" height="24"/>
<rect class="f-b2" x="49.9" y="70" width="274.4" height="24"/>
<text class="f-s" x="187.1" y="86.5" text-anchor="middle" style="font-size:12px">499 tokens, uno cada 50 ms</text>
<line class="f-linea" x1="26" y1="102" x2="334" y2="102"/>
<line class="f-linea" x1="26" y1="102" x2="26" y2="106"/>
<text class="f-s" x="26" y="120" text-anchor="middle" style="font-size:12px">0</text>
<line class="f-linea" x1="81" y1="102" x2="81" y2="106"/>
<text class="f-s" x="81" y="120" text-anchor="middle" style="font-size:12px">5</text>
<line class="f-linea" x1="136" y1="102" x2="136" y2="106"/>
<text class="f-s" x="136" y="120" text-anchor="middle" style="font-size:12px">10</text>
<line class="f-linea" x1="191" y1="102" x2="191" y2="106"/>
<text class="f-s" x="191" y="120" text-anchor="middle" style="font-size:12px">15</text>
<line class="f-linea" x1="246" y1="102" x2="246" y2="106"/>
<text class="f-s" x="246" y="120" text-anchor="middle" style="font-size:12px">20</text>
<line class="f-linea" x1="301" y1="102" x2="301" y2="106"/>
<text class="f-s" x="301" y="120" text-anchor="middle" style="font-size:12px">25 s</text>
<line x1="49.9" y1="64" x2="49.9" y2="98" style="stroke:var(--ink);stroke-width:1.5;stroke-dasharray:3 3"/>
<line x1="324.3" y1="64" x2="324.3" y2="98" style="stroke:var(--ink);stroke-width:1.5;stroke-dasharray:3 3"/>
<text class="f-t" x="26" y="144" style="font-size:13px">TTFT ≈ 2.2 s</text>
<text class="f-t" x="334" y="144" text-anchor="end" style="font-size:13px">fin ≈ 27.1 s</text>
<rect class="f-card" x="10" y="170" width="340" height="146" rx="16"/>
<text class="f-l" x="26" y="194">LOS PRIMEROS 3 SEGUNDOS, CON LUPA</text>
<rect class="f-o" x="26" y="222" width="222.8" height="24"/>
<text class="f-s" x="137.4" y="238.5" text-anchor="middle" style="font-size:12px">prefill: lee 6,000 tokens</text>
<rect class="f-b" x="249.4" y="222" width="3.9" height="24" rx="1.5"/>
<rect class="f-b" x="254.5" y="222" width="3.9" height="24" rx="1.5"/>
<rect class="f-b" x="259.7" y="222" width="3.9" height="24" rx="1.5"/>
<rect class="f-b" x="264.8" y="222" width="3.9" height="24" rx="1.5"/>
<rect class="f-b" x="269.9" y="222" width="3.9" height="24" rx="1.5"/>
<rect class="f-b" x="275.1" y="222" width="3.9" height="24" rx="1.5"/>
<rect class="f-b" x="280.2" y="222" width="3.9" height="24" rx="1.5"/>
<rect class="f-b" x="285.3" y="222" width="3.9" height="24" rx="1.5"/>
<rect class="f-b" x="290.5" y="222" width="3.9" height="24" rx="1.5"/>
<rect class="f-b" x="295.6" y="222" width="3.9" height="24" rx="1.5"/>
<rect class="f-b" x="300.7" y="222" width="3.9" height="24" rx="1.5"/>
<rect class="f-b" x="305.9" y="222" width="3.9" height="24" rx="1.5"/>
<rect class="f-b" x="311" y="222" width="3.9" height="24" rx="1.5"/>
<rect class="f-b" x="316.1" y="222" width="3.9" height="24" rx="1.5"/>
<rect class="f-b" x="321.3" y="222" width="3.9" height="24" rx="1.5"/>
<rect class="f-b" x="326.4" y="222" width="3.9" height="24" rx="1.5"/>
<line x1="231.3" y1="212" x2="231.3" y2="252" style="stroke:var(--o);stroke-width:2.5"/>
<text class="f-s" x="227.3" y="212" text-anchor="end" style="font-size:12px">promesa de TTFT: 2 s</text>
<line class="f-linea" x1="26" y1="254" x2="334" y2="254"/>
<line class="f-linea" x1="26" y1="254" x2="26" y2="258"/>
<text class="f-s" x="26" y="272" text-anchor="start" style="font-size:12px">0</text>
<line class="f-linea" x1="128.7" y1="254" x2="128.7" y2="258"/>
<text class="f-s" x="128.7" y="272" text-anchor="middle" style="font-size:12px">1</text>
<line class="f-linea" x1="334" y1="254" x2="334" y2="258"/>
<text class="f-s" x="334" y="272" text-anchor="end" style="font-size:12px">3 s</text>
<line x1="248.8" y1="216" x2="248.8" y2="260" style="stroke:var(--ink);stroke-width:1.5;stroke-dasharray:3 3"/>
<text class="f-t" x="248.8" y="273" text-anchor="middle" style="font-size:13px">1.er token</text>
<text class="f-s" x="137.4" y="296" text-anchor="middle" style="font-size:12px">prefill ≈ 2.2 s</text>
<text class="f-s" x="334" y="296" text-anchor="end" style="font-size:12px">azul: 1 token cada 50 ms</text>
<rect class="f-chip" x="10" y="328" width="340" height="60" rx="14"/>
<text class="f-s" x="26" y="352">E2E = TTFT + TPOT × (500 − 1)</text>
<text class="f-t" x="26" y="374" style="font-size:14px">= 2.17 + 0.05 × 499 ≈ 27.1 s</text>
</svg>
