<circle class="f-g" cx="260" cy="210" r="4"/>
<circle class="f-g" cx="283.3" cy="226.7" r="4"/>
<circle class="f-g" cx="306.7" cy="243.3" r="4"/>
<circle class="f-o" cx="330" cy="260" r="5"/>
<line x1="128" y1="60" x2="128" y2="110" style="stroke:var(--o);stroke-width:2.5"/>
<line x1="123" y1="60" x2="133" y2="60" style="stroke:var(--o);stroke-width:2.5"/>
<line x1="123" y1="110" x2="133" y2="110" style="stroke:var(--o);stroke-width:2.5"/>
<text class="f-s" x="138" y="80" style="font-size:12px;fill:var(--o)">−0.6 contra el de</text>
<text class="f-s" x="138" y="95" style="font-size:12px;fill:var(--o)">hace 3 meses: rojo</text>
<text class="f-s" x="196" y="252" style="font-size:12px">−2.4 en 12 meses</text>
<text class="f-l" x="50" y="286" text-anchor="middle">0</text>
<text class="f-l" x="120" y="286" text-anchor="middle">3</text>
<text class="f-l" x="190" y="286" text-anchor="middle">6</text>
<text class="f-l" x="260" y="286" text-anchor="middle">9</text>
<text class="f-l" x="330" y="286" text-anchor="middle">12</text>
<text class="f-l" x="190" y="304" text-anchor="middle">MESES</text>
<circle class="f-g" cx="34" cy="332" r="5"/>
<text class="f-s" x="46" y="337" style="font-size:12px">Contra el champion: cada escalón de 0.2 pasa</text>
<circle class="f-o" cx="34" cy="360" r="5"/>
<text class="f-s" x="46" y="365" style="font-size:12px">Contra el de hace 3 meses: tres escalones</text>
<text class="f-s" x="46" y="381" style="font-size:12px">juntos no caben y el gate se detiene</text>
</svg>
