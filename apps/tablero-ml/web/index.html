<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ML Board</title>
<meta name="description" content="ML project board: every project as a map from data to monitoring, with entry-gate sizing per step.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1F5FAE">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=JetBrains+Mono:wght@400;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..700&display=swap">
<link rel="stylesheet" href="/app.css">
<script type="module" src="/js/app.js"></script>
</head>
<body>
<header class="bar"><div class="bar__in">
  <a class="brand" href="#/"><img src="/icon.svg" alt="" width="28" height="28">ML Board</a>
  <span class="bar__title" id="bar-title"></span>
  <span class="sync" id="sync" role="status" aria-live="polite"><i></i><b>…</b></span>
  <button class="btn btn--ghost btn--icon" id="theme" type="button" aria-label="Theme"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 0 0 17z" fill="currentColor"/></svg></button>
  <button class="btn btn--ghost btn--icon" id="logout" type="button" aria-label="Sign out" title="Sign out" hidden><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4h4a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-4M10 8l-4 4 4 4M6 12h10"/></svg></button>
</div></header>
<main class="wrap" id="app"><p class="muted" style="margin-top:24px">Loading the board…</p></main>
<noscript><p>The board needs JavaScript.</p></noscript>
</body>
</html>
