# Alertas del caso c02 (Prometheus): las 6 de la sección de monitoreo. Todas miran la NUBE; las cajas
# no tienen Prometheus propio: reportan por heartbeat y la API lo convierte en métricas.
# Severidades: page = despierta a alguien (un sitio está ciego o las alertas llegan tarde) ·
# ticket = se arregla en horario laboral (una cámara, la calidad del modelo).
# De dónde sale cada métrica:
#   edge_last_heartbeat_timestamp_seconds, camera_fps, alert_end_to_end_seconds, alerts_closed_total,
#   alerts_dismissed_total → cloud/api/main.py · verifier_jobs_total → el worker del verificador
#   (contrato en cloud/k8s/verifier.yaml) · aws_sqs_* → CloudWatch vía exportador (ver EventBacklogHigh).
# Validación: YAML y sintaxis PromQL revisadas con un parser; no se corrió `promtool check rules`.

groups:
  - name: c02-edge
    rules:
      # La caja es un punto único de falla por sitio: si se apaga, el sitio queda sin detección y NO lo
      # dice (una caja muerta no manda alertas: su silencio es la alerta). 120 s = 4 heartbeats perdidos.
      # max by (site): cada réplica de la API guarda el último heartbeat que LE llegó; el más nuevo manda.
      - alert: EdgeBoxOffline
        expr: |
          time() - max by (site) (edge_last_heartbeat_timestamp_seconds) > 120
        # 1 min extra cubre el reinicio de la API: su gauge arranca en 0 hasta el primer heartbeat (≤ 30 s).
        # Total: ≈ 3 min desde el último heartbeat hasta el page.
        for: 1m
        labels:
          severity: page
        annotations:
          summary: "Caja edge de {{ $labels.site }} sin heartbeat"
          description: "Último heartbeat hace {{ $value | humanizeDuration }}. El sitio no está detectando intrusiones: avisa al SOC para vigilancia manual (NVR) y revisa energía, red y el contenedor."
          runbook_url: "https://runbooks.example.com/c02/edge-box-offline"

      # Una cámara sin frames analizados: la caja reporta 0.0 explícito para cada cámara de site.yaml.
      # "unless" evita 40 alertas de cámara cuando lo que se cayó es la caja entera (eso ya es un page).
      # min by: con varias réplicas de la API, basta que una tenga un 0 fresco (< 90 s) para que gane el 0.
      # Si TODAS las cámaras de un sitio caen a 0 con el heartbeat vivo, no son las cámaras: es DeepStream
      # (un engine que no carga tras un OTA, la GPU). Agrupa por sitio en Alertmanager (group_by: [site]) y
      # que el runbook lo trate como sitio ciego. Una cámara de perímetro caída de noche puede ser sabotaje:
      # el ruteo a page del SOC para esas cámaras (un matcher por camera) va en Alertmanager, no aquí.
      - alert: CameraStreamDown
        expr: |
          min by (site, camera) (camera_fps) == 0
            unless on (site)
          (time() - max by (site) (edge_last_heartbeat_timestamp_seconds) > 120)
        for: 5m  # un reinicio de la cámara (≈ 1–2 min, est.) no debe despertar a nadie
        labels:
          severity: ticket
        annotations:
          summary: "Cámara {{ $labels.camera }} de {{ $labels.site }} sin video analizado"
          description: "0 fps durante 5 min. Esa vista no tiene detección: revisa la cámara, el PoE y el segundo stream (5 fps) en la configuración de la cámara."
          runbook_url: "https://runbooks.example.com/c02/camera-stream-down"

  - name: c02-cloud
    rules:
      # Edad del mensaje más viejo de la cola de candidatos (el verificador no da abasto o está caído).
      # Es la métrica de CloudWatch ApproximateAgeOfOldestMessage leída con prometheus/cloudwatch_exporter
      # (v0.18.0); EL NOMBRE DEPENDE DEL EXPORTADOR. Con este exportador es aws_<namespace>_<métrica>_<estadística>
      # en snake_case, y la dimensión QueueName se vuelve el label queue_name. Su configuración:
      #   - aws_namespace: AWS/SQS
      #     aws_metric_name: ApproximateAgeOfOldestMessage
      #     aws_dimensions: [QueueName]
      #     aws_dimension_select: {QueueName: [c02-candidate-events]}
      #     aws_statistics: [Maximum]
      #     delay_seconds: 60     # TRAMPA: el default es 600; las muestras llevan el timestamp de CloudWatch y
      #     range_seconds: 180    # con 10 min de retraso una consulta "ahora" no ve nada (habría que usar offset)
      # SQS publica cada 1 min: este aviso llega a los ≈ 3–4 min. Es el respaldo; el síntoma rápido es AlertLatencyHigh.
      # Con otro exportador (p. ej. YACE) el nombre y los labels cambian: ajusta esta línea, no el umbral.
      - alert: EventBacklogHigh
        expr: |
          max by (queue_name) (aws_sqs_approximate_age_of_oldest_message_maximum{queue_name="c02-candidate-events"}) > 30
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "La cola de eventos candidatos tiene mensajes de más de 30 s"
          description: "Mensaje más viejo: {{ $value | humanizeDuration }}. Con un SLO de 5 s, cada alerta ya llega tarde. ¿Pods del verificador listos? ¿KEDA en maxReplicaCount? ¿Errores (VerifierErrors)?"
          runbook_url: "https://runbooks.example.com/c02/event-backlog-high"

      # EL SLO: p95 ≤ 5 s desde que la persona entra a la zona hasta que la alerta está en la pantalla del SOC.
      # Histograma agregado entre réplicas ANTES del quantile (sum by le). Ventana de 30 min, no 10: el SOC
      # recibe como mucho ≈ 50 alertas/hora (su presupuesto), así que 10 min son ≤ 8 muestras, un p95 que
      # salta con una sola alerta lenta.
      # El `for` de 10 min pide que la condición se sostenga. Mínimo de 10 alertas para no decidir con 2.
      - alert: AlertLatencyHigh
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(alert_end_to_end_seconds_bucket[30m]))) > 5
            and
          sum(increase(alert_end_to_end_seconds_count[30m])) >= 10
        for: 10m
        labels:
          severity: page
        annotations:
          summary: "p95 de la latencia de alerta sobre 5 s"
          description: "p95 = {{ $value | humanizeDuration }}. Compara event_ingest_lag_seconds (caja → nube) con la edad de la cola (nube) para saber qué tramo se atrasó."
          runbook_url: "https://runbooks.example.com/c02/alert-latency-high"

      # Calidad: fracción de alertas que el SOC cerró como falsa alarma, por sitio, en 24 h. El objetivo es
      # precisión ≥ 90 % después del verificador; > 30 % descartadas significa que ese sitio cambió (luz,
      # cámara movida, reflejos) o que el modelo no lo cubre. Mínimo de 20 alertas cerradas para que 1 de 2
      # no sea "50 %". Estas alertas descartadas son justo las que van a la cola de etiquetado.
      - alert: FalseAlarmRateHigh
        expr: |
          (
            sum by (site) (increase(alerts_dismissed_total[24h]))
              /
            sum by (site) (increase(alerts_closed_total[24h]))
          ) > 0.30
            and
          sum by (site) (increase(alerts_closed_total[24h])) >= 20
        for: 1h
        labels:
          severity: ticket
        annotations:
          summary: "Más de 30 % de falsas alarmas en {{ $labels.site }} (24 h)"
          description: "Descartadas / cerradas = {{ $value | humanizePercentage }}. Revisa las alertas descartadas de ese sitio: ¿una cámara, una hora, un tipo de objeto? Etiquétalas para el próximo reentrenamiento."
          runbook_url: "https://runbooks.example.com/c02/false-alarm-rate-high"

      # Errores del verificador (excepciones, fotos que no están en S3, fallas de GPU) sobre el total de
      # trabajos. "rejected" (el verificador descartó el candidato) NO es error: es su trabajo.
      # De noche hay ≈ 40 trabajos cada 10 min: 1 error ya es 2.5 %; exigir ≥ 3 errores evita el page por uno.
      - alert: VerifierErrors
        expr: |
          (
            sum(rate(verifier_jobs_total{outcome="error"}[10m]))
              /
            sum(rate(verifier_jobs_total[10m]))
          ) > 0.02
            and
          sum(increase(verifier_jobs_total{outcome="error"}[10m])) >= 3
        for: 10m
        labels:
          severity: page
        annotations:
          summary: "Más de 2 % de errores en el verificador"
          description: "Tasa de error = {{ $value | humanizePercentage }}. Los candidatos con error se reintentan (visibility timeout) y los que fallan siempre terminan en la DLQ: revisa los logs del worker y la DLQ."
          runbook_url: "https://runbooks.example.com/c02/verifier-errors"
