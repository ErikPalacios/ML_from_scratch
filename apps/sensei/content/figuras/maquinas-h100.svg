<text class="f-s" x="28" y="56" style="font-size:12px">US$ por GPU-hora, on-demand, nov. 2026</text>

<text class="f-t" x="28" y="92" style="font-size:14px">Azure</text>
<text class="f-l" x="28" y="106" style="font-size:11px">HIPERESCALA</text>
<rect class="f-b" x="124" y="80" width="153.6" height="22" rx="4"/>
<text class="f-t" x="285.6" y="96" style="font-size:14px">12.29</text>

<text class="f-t" x="28" y="136" style="font-size:14px">Google</text>
<text class="f-l" x="28" y="150" style="font-size:11px">HIPERESCALA</text>
<rect class="f-b" x="124" y="124" width="138.2" height="22" rx="4"/>
<text class="f-t" x="270.2" y="140" style="font-size:14px">11.06</text>

<text class="f-t" x="28" y="180" style="font-size:14px">AWS</text>
<text class="f-l" x="28" y="194" style="font-size:11px">HIPERESCALA</text>
