<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 372" role="img" aria-labelledby="f-sistema-operativo-permisos-t" class="f-svg" style="max-width:420px">
<title id="f-sistema-operativo-permisos-t">Los diez caracteres de permisos que muestra ls -l para arrancar.sh: guion, r, w, x, r, guion, x, guion, guion, guion. El primero es el tipo: un guion quiere decir archivo. Los siguientes nueve son tres juegos de tres: el dueño tiene r, w y x; el grupo tiene r y x, sin w; los demás no tienen nada. Cada letra es un bit prendido y cada posición vale 4, 2 y 1. El dueño suma 4 más 2 más 1, que da 7; el grupo, 4 más 0 más 1, que da 5; los demás, 0. Por eso estos permisos se escriben 750 y se ponen con chmod 750 arrancar.sh. Abajo, una tabla: en un archivo, r es leerlo, w es cambiarlo y x es correrlo; en una carpeta, r es ver los nombres, w es crear y borrar adentro, y x es entrar.</title>
<text class="f-l" x="14" y="22">LOS PERMISOS DE ARRANCAR.SH</text>
