<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 312" role="img" aria-labelledby="f-camino-completo-sculley-t" class="f-svg" style="max-width:420px">
<title id="f-camino-completo-sculley-t">El código del modelo es la caja chica. En el centro, una caja oscura y pequeña dice «código de ML». A su alrededor hay nueve cajas más grandes: configuración, recolección de datos, extracción de features, verificación de datos, recursos de máquina, herramientas de análisis, gestión de procesos, infraestructura de serving y monitoreo. Inspirada en la figura de Sculley y otros, 2015; los tamaños no son medidas.</title>
<rect class="f-card" x="10" y="10" width="340" height="292" rx="16"/>
<text class="f-l" x="28" y="36">TODO LO QUE RODEA AL MODELO</text>
