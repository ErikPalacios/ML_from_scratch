<rect class="f-g" x="200" y="344" width="134" height="30" rx="8" style="opacity:.4"/>
<text class="f-s" x="210" y="364">10-09 · Iluminación</text>
<path class="f-flecha" d="M114 309 L192 355"/><path class="f-punta" d="M190 350 L199 358 L187 360 Z"/>
<path class="f-flecha" d="M114 359 L192 359"/><path class="f-punta" d="M192 354 L200 359 L192 364 Z"/>
<text class="f-t" x="26" y="406">= 2 filas, una por foto</text>
<text class="f-s" x="26" y="427">las dos fotos quedan con «Iluminación»</text>
