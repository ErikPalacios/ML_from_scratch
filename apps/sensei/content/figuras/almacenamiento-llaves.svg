<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 486" role="img" aria-labelledby="f-almacenamiento-llaves-t" class="f-svg" style="max-width:420px">
<title id="f-almacenamiento-llaves-t">Las carpetas de un bucket no existen. Arriba, lo que enseña la consola: una carpeta logs, cerrada, y una carpeta fotos, dentro 2026, dentro 11, y dentro dos carpetas, 06 con ana-tenis.jpg y beto-bici.jpg, y 07 con caro-lampara.jpg. Abajo, lo que de verdad hay: una lista plana de cuatro llaves en orden alfabético, fotos/2026/11/06/ana-tenis.jpg, fotos/2026/11/06/beto-bici.jpg, fotos/2026/11/07/caro-lampara.jpg y logs/dt=2026-11-06/part-0000.parquet. Las dos primeras comparten el prefijo fotos/2026/11/06/, que está resaltado. Un LIST con ese prefijo devuelve esas dos llaves. La diagonal es una letra más de la llave.</title>
<rect class="f-card" x="10" y="10" width="340" height="466" rx="16"/>
<text class="f-l" x="26" y="36">LO QUE ENSEÑA LA CONSOLA</text>
<rect class="f-y" x="28" y="52" width="16" height="12" rx="2"/>
<text class="f-s" x="52" y="63">fotos/</text>
<line class="f-linea" x1="36" y1="68" x2="36" y2="84"/>
<line class="f-linea" x1="36" y1="84" x2="46" y2="84"/>
<rect class="f-y" x="50" y="78" width="16" height="12" rx="2"/>
<text class="f-s" x="74" y="89">2026/</text>
