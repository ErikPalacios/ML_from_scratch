<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 446" role="img" aria-labelledby="f-imagenes-interpolacion-t" class="f-svg" style="max-width:420px">
<title id="f-imagenes-interpolacion-t">Agrandar una imagen de 2 por 2 a 4 por 4. La entrada, en gris: 0 y 160 arriba, 80 y 240 abajo. Con nearest, cada píxel se repite en un bloque de 2 por 2: filas 0 0 160 160, 0 0 160 160, 80 80 240 240, 80 80 240 240. Con bilinear sale un degradado: filas 0 40 120 160, 20 60 140 180, 60 100 180 220, 80 120 200 240. El píxel de la fila 1 y la columna 1 vale 0 con nearest, que copia al vecino de la esquina, y 60 con bilinear, que mezcla a los cuatro.</title>
