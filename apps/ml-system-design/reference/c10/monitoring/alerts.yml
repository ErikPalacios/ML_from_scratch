# Alertas del caso c10 (LLM propio a escala), Prometheus: 8 alertas en 3 grupos + 9 recording rules.
#   Experiencia (lo que ve el usuario, medido en el gateway): LLMTTFTHigh, LLMTPOTHigh, LLMGatewayErrorRate
#   Flota (causas, medidas en vLLM y en el gateway): LLMQueueBacklog, KVCacheSaturation, LLMPreemptionsRising,
#                                                    LLMCapacityHeadroomLow
#   Modelo: CanaryEvalRegression
# Severidades: page = alguien lo mira YA (usuarios de soporte o vendedores esperando); ticket = horario laboral,
# con dueño (equipo de plataforma de LLMs). Umbrales ILUSTRATIVOS: salen de los SLOs del caso y de la línea base.
#
# SLOs del caso (interactivo, streaming): TTFT p95 ≤ 1.0 s y TPOT p95 ≤ 50 ms; disponibilidad 99.9 %; el batch
# termina a las 06:00 (hora de Ciudad de México = 12:00 UTC; México no tiene horario de verano desde 2022).
# Por qué la latencia se mide en el GATEWAY y no en vLLM: el usuario espera también la cola de admisión del
# gateway y la red; vllm:time_to_first_token_seconds empieza a contar cuando el request llega al engine. Las de
# vLLM se usan para DIAGNOSTICAR (¿es la cola del gateway, la del engine o el prefill?), no para despertar a nadie.
#
# De dónde sale cada métrica:
#   llm_gateway_*                  → gateway/llm_gateway.py (un test verifica que cada una existe en /metrics)
#   vllm:*                         → vLLM v0.30.0, /metrics de cada pod (labels model_name, engine; Prometheus
#                                    agrega pod, namespace y track con el PodMonitor de k8s/vllm-70b.yaml).
#                                    Nombres verificados en vllm/v1/metrics/loggers.py de v0.30.0. Ojo con versiones
#                                    viejas: el gauge del KV cache se llamaba vllm:gpu_cache_usage_perc; desde v0.10
#                                    es vllm:kv_cache_usage_perc (el viejo quedó oculto en v0.11 y ya no existe en v0.12+).
#                                    Los counters llevan el sufijo _total en Prometheus (vllm:num_preemptions_total).
#   batch_runner_*                 → batch-runner (no está en esta carpeta): items pendientes de la noche (gauge) e
#                                    items terminados (counter)
#   llm_golden_score{tenant,track}, llm_golden_items{tenant,track}
#                                  → job de evaluación (eval/golden_eval.py), cada hora, vía Pushgateway: el MISMO
#                                    golden set por la revisión estable y por la canaria (track = stable | canary).
#                                    score en [0, 1]: F1 por campo en extracción; puntaje del juez normalizado en chat.
# Validación: `promtool check rules alerts.yml` y `promtool test rules alerts_test.yml` (Prometheus 3.15.0).

groups:
  # ------------------------------------------------------------------ recording rules
  - name: c10-recording
    rules:
      # p95 de TTFT e intervalo por token vistos por el gateway, solo tráfico interactivo servido por la flota
      # propia (el del vendor tiene sus propios tiempos y no dice nada de nuestras GPUs). Los histogramas del
      # gateway tienen bordes EXACTOS en 1.0 s y 0.05 s: el umbral no cae en medio de un bucket.
      - record: llm:gateway_ttft_p95:rate5m
        expr: |
          histogram_quantile(0.95, sum by (le, alias) (rate(llm_gateway_ttft_seconds_bucket{priority="interactive",backend="self"}[5m])))
      - record: llm:gateway_tpot_p95:rate5m
        expr: |
          histogram_quantile(0.95, sum by (le, alias) (rate(llm_gateway_tpot_seconds_bucket{priority="interactive",backend="self"}[5m])))
      # Diagnóstico por pod: TTFT dentro del engine (sin la cola del gateway). Si el del gateway sube y este no,
      # la cola está ANTES de vLLM (admisión, red); si suben los dos, es la réplica (prefill, KV lleno).
      - record: llm:vllm_ttft_p95:rate5m
        expr: |
          histogram_quantile(0.95, sum by (le, pod) (rate(vllm:time_to_first_token_seconds_bucket[5m])))
      # Errores que ve el usuario: 5xx (incluye 503 por plataforma llena, 502/504 del upstream) y streams cortados
      # a la mitad. NO cuentan: 429 (la cuota del tenant es un límite pactado, no una falla) ni 499 (el cliente se
      # fue). El denominador excluye 499 por lo mismo.
      - record: llm:gateway_error_ratio:rate5m
        expr: |
          (sum(rate(llm_gateway_requests_total{status=~"5..|stream_error"}[5m])) or vector(0))
            / sum(rate(llm_gateway_requests_total{status!="499"}[5m]))
      # Preemptions por request terminado, en la flota: vLLM desaloja una secuencia de la GPU cuando el KV cache no
      # alcanza y la recalcula después. Con --scheduling-policy priority, primero salen las de batch.
      - record: llm:preemption_ratio:rate15m
        expr: |
          sum(rate(vllm:num_preemptions_total[15m])) / sum(rate(vllm:request_success_total[15m]))
      # Lugares en vuelo usados ÷ tope, en todas las réplicas del gateway (≈ 0.7 en el pico planeado: 40 de ≈ 57)
      - record: llm:gateway_inflight_utilization
        expr: |
          sum(llm_gateway_inflight) / sum(llm_gateway_max_inflight)
      # Segundos que faltan para las 06:00 de CDMX (12:00 UTC) y segundos que tardaría el batch a la velocidad
      # de los últimos 30 min.
      - record: batch:seconds_to_deadline
        expr: |
          (43200 - time() % 86400 + 86400) % 86400
      - record: batch:eta_seconds
        expr: |
          sum(batch_runner_items_remaining) / clamp_min(sum(rate(batch_runner_items_completed_total[30m])), 0.001)
      # Canario − estable en el MISMO golden set, por tenant (0.01 = 1 punto)
      - record: llm:canary_eval_delta
        expr: |
          max by (tenant) (llm_golden_score{track="canary"}) - max by (tenant) (llm_golden_score{track="stable"})

  # ------------------------------------------------------------------ experiencia
  - name: c10-experience
    rules:
      - alert: LLMTTFTHigh
        expr: llm:gateway_ttft_p95:rate5m > 1
        for: 10m
        labels:
          severity: page
        annotations:
          summary: "{{ $labels.alias }}: TTFT p95 {{ $value | humanizeDuration }} en el gateway (SLO 1 s)"
          description: "Compara con llm:vllm_ttft_p95:rate5m por pod: si vLLM está bien, la espera es la cola del gateway (llm_gateway_queue_depth); si no, mira KVCacheSaturation, prompts más largos (vllm:request_prompt_tokens) o una réplica lenta."
          runbook_url: "https://runbooks.example.com/c10/ttft"

      - alert: LLMTPOTHigh
        expr: llm:gateway_tpot_p95:rate5m > 0.05
        for: 10m
        labels:
          severity: page
        annotations:
          summary: "{{ $labels.alias }}: TPOT p95 {{ $value | humanizeDuration }} (SLO 50 ms ≈ 20 tokens/s por usuario)"
          description: "El decode es memory-bound: más secuencias por réplica = cada una más lenta. ¿Subió la concurrencia por réplica (vllm:num_requests_running), hay preemptions (LLMPreemptionsRising) o prefills largos intercalados (max-num-batched-tokens)?"
          runbook_url: "https://runbooks.example.com/c10/tpot"

      - alert: LLMGatewayErrorRate
        expr: llm:gateway_error_ratio:rate5m > 0.01
        for: 10m
        labels:
          severity: page
        annotations:
          summary: "{{ $value | humanizePercentage }} de los requests fallan en el gateway (> 1 %)"
          description: "sum by (status, tenant) (rate(llm_gateway_requests_total[5m])): 503 = sin capacidad (admisión); 502/504 = réplicas caídas o lentas; stream_error = réplicas que mueren a mitad del stream (OOM, XID de GPU). Con 99.9 % de disponibilidad, 1 % de errores gasta el presupuesto del mes en ≈ 3 días."
          runbook_url: "https://runbooks.example.com/c10/errors"

  # ------------------------------------------------------------------ flota
  - name: c10-fleet
    rules:
      # Dos reglas con el mismo nombre: la cola interactiva (alguien espera ahora) y el batch que no llega a las
      # 06:00 (el catálogo amanece sin enriquecer). Distinta severidad, distinta causa.
      - alert: LLMQueueBacklog
        expr: max by (pod) (llm_gateway_queue_depth{priority="interactive"}) > 32
        for: 5m
        labels:
          severity: page
          cause: interactive_queue
        annotations:
          summary: "{{ $labels.pod }}: {{ $value }} requests interactivos esperando lugar (la mitad de la cola)"
          description: "La flota está llena para el tráfico interactivo: los que esperan más de 0.5 s reciben 503. ¿Hay batch fuera de su ventana ocupando lugares (llm_gateway_inflight{priority=\"batch\"})? ¿Réplicas caídas (LLMCapacityHeadroomLow)?"
          runbook_url: "https://runbooks.example.com/c10/queue"
      - alert: LLMQueueBacklog
        # Solo dentro de la ventana nocturna (22:00–06:00 CDMX = 04:00–12:00 UTC)
        expr: |
          (batch:eta_seconds > batch:seconds_to_deadline)
            and on() (hour() >= 4 and hour() < 12)
        for: 15m
        labels:
          severity: ticket
          cause: batch_deadline
        annotations:
          summary: "El batch de catálogo no termina antes de las 06:00: al ritmo actual le faltan {{ $value | humanizeDuration }}"
          description: "¿El batch recibe 503 (admisión) o 429 (cuota de catalog-enrichment)? ¿Hay tráfico interactivo nocturno inusual? Lo que no termine se procesa el día siguiente con prioridad batch: no se manda al vendor."
          runbook_url: "https://runbooks.example.com/c10/batch"

      - alert: KVCacheSaturation
        # KV casi lleno Y requests esperando en el engine, en horario de uso interactivo (06:00–22:00 CDMX). De
        # noche el batch llena la flota A PROPÓSITO: ahí KV al 100 % es la flota bien usada.
        expr: |
          (max by (pod) (vllm:kv_cache_usage_perc) > 0.95)
            and on(pod) (sum by (pod) (vllm:num_requests_waiting) > 0)
            and on() (hour() >= 12 or hour() < 4)
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.pod }}: KV cache al {{ $value | humanizePercentage }} con requests esperando"
          description: "La concurrencia de esta réplica la limita la memoria. Causa probable de LLMTTFTHigh. Opciones: más réplicas, --kv-cache-dtype fp8 (≈ 2× secuencias; requiere pasar el golden set), max-model-len menor, o prompts más cortos del tenant que más creció."
          runbook_url: "https://runbooks.example.com/c10/kv-cache"

      - alert: LLMPreemptionsRising
        expr: |
          llm:preemption_ratio:rate15m > 0.05
            and on() (hour() >= 12 or hour() < 4)
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $value | humanizePercentage }} de los requests terminados sufrieron una preemption (> 5 %)"
          description: "Cada preemption recalcula el prefill de esa secuencia: GPU tirada y saltos de TPOT. Se arregla con más KV por réplica o menos secuencias (max-num-seqs), no reiniciando."
          runbook_url: "https://runbooks.example.com/c10/preemptions"

      - alert: LLMCapacityHeadroomLow
        expr: llm:gateway_inflight_utilization > 0.85
        for: 15m
        labels:
          severity: page
          cause: inflight
        annotations:
          summary: "Gateway: {{ $value | humanizePercentage }} de los lugares en vuelo ocupados (> 85 %)"
          description: "La flota no crece en minutos (p5 nueva + 70 GB de pesos ≈ 5–10 min, y solo si hay capacidad reservada). Mitigación inmediata: bajar la cuota del batch o pausar el batch-runner; listing-assistant ya derrama al vendor. Después: capacidad (Capacity Blocks / reservas)."
          runbook_url: "https://runbooks.example.com/c10/capacity"
      - alert: LLMCapacityHeadroomLow
        # 16 réplicas planeadas; con 14 la capacidad planeada (14 × 4.2 ≈ 59 rps) apenas cubre el diseño
        expr: count(up{namespace="c10", pod=~"vllm-70b-.*", track="stable"} == 1) < 15
        for: 10m
        labels:
          severity: page
          cause: replicas
        annotations:
          summary: "Solo {{ $value }} réplicas de vllm-70b sirviendo (de 16)"
          description: "kubectl get pods -n c10 -l app.kubernetes.io/name=vllm-70b: ¿Pending (sin GPUs: nodo perdido, sin capacidad p5), CrashLoopBackOff (pesos, OOM, driver) o en arranque (startupProbe de hasta 15 min)?"
          runbook_url: "https://runbooks.example.com/c10/capacity"
      - alert: LLMCapacityHeadroomLow
        # Sin métricas de vLLM, todas las alertas de flota están ciegas: eso también es falta de margen
        expr: absent(vllm:num_requests_running)
        for: 10m
        labels:
          severity: page
          cause: no_metrics
        annotations:
          summary: "No hay métricas de vllm-70b: las alertas de la flota están ciegas"
          description: "¿Cambió el PodMonitor, el puerto o el nombre de las métricas en un upgrade de vLLM? Revisa los targets en Prometheus."
          runbook_url: "https://runbooks.example.com/c10/capacity"

  # ------------------------------------------------------------------ modelo
  - name: c10-model
    rules:
      - alert: CanaryEvalRegression
        # Caída de más de 2 puntos contra la revisión estable en el mismo golden set, con ≥ 300 items evaluados
        expr: |
          (llm:canary_eval_delta < -0.02)
            and on(tenant) (min by (tenant) (llm_golden_items{track="canary"}) >= 300)
        for: 30m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.tenant }}: la revisión canaria está {{ $value | humanize }} por debajo de la estable"
          description: "No promover el alias. Mira el eval report por slice en el model registry; si el canario ya recibe tráfico real, sácalo (escalado a 0 del Deployment canario)."
          runbook_url: "https://runbooks.example.com/c10/canary-eval"
