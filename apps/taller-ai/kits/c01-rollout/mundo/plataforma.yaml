# Lo que el equipo de plataforma ya tiene corriendo en el clúster, fuera del namespace classifier. Lo aplica
# mundo/crear.py (cambia {{ALB_IMAGEN}} por el digest de la imagen del ALB); no se toca.
#   dojo-alb   el «ALB» del dojo: reparte con los pesos que Argo Rollouts escribe en el Ingress (en C01: el ALB de AWS
#              + el AWS Load Balancer Controller). Afuera: localhost:8910.
#   monitoreo  Prometheus v3.15.1: junta las métricas de cada pod del gateway cada 5 s (en C01: Amazon Managed
#              Prometheus). Afuera: localhost:9910. Etiqueta cada serie con el hash del template del pod (hash) y su
#              versión de modelo (modelo): el análisis del canary separa canary y estable con ellas.
# Argo Rollouts (su controlador, en el namespace argo-rollouts) viene de su manifiesto oficial: mundo/argo-rollouts.yaml.
apiVersion: v1
kind: Namespace
metadata: {name: dojo-alb}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: alb, namespace: dojo-alb}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: alb-lee-ingress, namespace: classifier}
rules:
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: alb-lee-ingress, namespace: classifier}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: alb-lee-ingress}
subjects: [{kind: ServiceAccount, name: alb, namespace: dojo-alb}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: alb, namespace: dojo-alb}
spec:
  replicas: 1
  selector: {matchLabels: {app: alb}}
  template:
    metadata: {labels: {app: alb}}
    spec:
      serviceAccountName: alb
      nodeSelector: {workload: cpu}
      containers:
        - name: alb
          image: "{{ALB_IMAGEN}}"
          ports: [{containerPort: 8080}, {containerPort: 8081}]
          resources: {requests: {cpu: 200m, memory: 64Mi}, limits: {memory: 128Mi}}
          readinessProbe: {tcpSocket: {port: 8080}, periodSeconds: 2}
---
apiVersion: v1
kind: Service
metadata: {name: alb, namespace: dojo-alb}
spec:
  type: NodePort
  selector: {app: alb}
  ports:
    - {name: http, port: 8080, targetPort: 8080, nodePort: 30910}
    - {name: admin, port: 8081, targetPort: 8081}
---
apiVersion: v1
kind: Namespace
metadata: {name: monitoreo}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: prometheus, namespace: monitoreo}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: dojo-prometheus}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: dojo-prometheus}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: dojo-prometheus}
subjects: [{kind: ServiceAccount, name: prometheus, namespace: monitoreo}]
---
apiVersion: v1
kind: ConfigMap
metadata: {name: prometheus, namespace: monitoreo}
data:
  prometheus.yml: |
    global: {scrape_interval: 5s, evaluation_interval: 5s}
    scrape_configs:
      - job_name: gateway
        kubernetes_sd_configs: [{role: pod, namespaces: {names: [classifier]}}]
        relabel_configs:
          - {source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name], regex: gateway, action: keep}
          - {source_labels: [__meta_kubernetes_pod_container_port_number], regex: "8080", action: keep}
          - {source_labels: [__meta_kubernetes_pod_label_rollouts_pod_template_hash], target_label: hash}
          - {source_labels: [__meta_kubernetes_pod_label_classifier_modelo], target_label: modelo}
          - {source_labels: [__meta_kubernetes_pod_name], target_label: pod}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: prometheus, namespace: monitoreo}
spec:
  replicas: 1
  selector: {matchLabels: {app: prometheus}}
  template:
    metadata: {labels: {app: prometheus}}
    spec:
      serviceAccountName: prometheus
      nodeSelector: {workload: cpu}
      containers:
        - name: prometheus
          image: prom/prometheus:v3.15.1
          args: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.retention.time=1d, --web.enable-lifecycle]
          ports: [{containerPort: 9090}]
          resources: {requests: {cpu: 200m, memory: 256Mi}, limits: {memory: 512Mi}}
          readinessProbe: {httpGet: {path: /-/ready, port: 9090}, periodSeconds: 5}
          volumeMounts: [{name: config, mountPath: /etc/prometheus}]
      volumes: [{name: config, configMap: {name: prometheus}}]
---
apiVersion: v1
kind: Service
metadata: {name: prometheus, namespace: monitoreo}
spec:
  type: NodePort
  selector: {app: prometheus}
  ports: [{name: http, port: 9090, targetPort: 9090, nodePort: 30911}]
