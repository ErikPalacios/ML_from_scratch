<line x1="44" y1="352" x2="328" y2="352" class="f-linea"/>
<text class="f-s" x="28.0" y="396.0" style="font-size:12px">bin 1: 0.12 × ln 2.2 = 0.12 × 0.789 = 0.0946</text>
<text class="f-t" x="28.0" y="422.0" style="font-size:14px">PSI = suma de los aportes = 0.2252</text>
<text class="f-s" x="28.0" y="444.0" style="font-size:12px">moderado: arriba del 0.2 con el que actúa Alba</text>
</svg>
