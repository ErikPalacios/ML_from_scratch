# Configuración de pytest para TODO el caso c10: `cd reference/c10 && pytest` corre las 4 carpetas.
# Sin GPU, sin vLLM, sin vendor: los upstreams son falsos (httpx2.MockTransport) y el juez también.
[pytest]
# Cada carpeta entra al sys.path: los tests importan `vram_calc`, `fleet_calc`, `pick_concurrency`,
# `llm_gateway` (que importa `admission`, `pii` y `quota`) y `golden_eval` como módulos sueltos
pythonpath = capacity bench gateway eval
testpaths = capacity/tests bench/tests gateway/tests eval/tests
# Salida compacta; y cualquier warning es un error (una API deprecada hoy es un upgrade roto mañana)
addopts = -q -W error
