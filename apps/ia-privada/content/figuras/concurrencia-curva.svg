<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" role="img" aria-labelledby="f-concurrencia-curva-t" class="f-svg" style="max-width:420px">
<title id="f-concurrencia-curva-t">La curva medida por NVIDIA con NIM 1.8.0 en una L40S, Llama 3.1 8B Instruct, 1,000 tokens de entrada y 1,000 de salida, contra la concurrencia de 1 a 250. Arriba, los tokens por segundo totales: en FP8 suben de 71 a 3,676 y se doblan cada vez más; en BF16 suben de 45 a unos 1,617 y se aplanan desde 100 a la vez, cuando el TTFT ya pasa de 2.7 segundos y llega a 64. Abajo, los tokens por segundo de cada persona: en FP8 bajan de 72 a 16, y cruzan la línea de 20 tokens por segundo entre 150 y 200 a la vez; en BF16 bajan de 45 a 17.</title>
<text class="f-l" x="14" y="24">L40S · LLAMA 3.1 8B · 1,000 ENTRAN / 1,000 SALEN</text>
