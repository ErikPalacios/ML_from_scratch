<rect class="f-dark" x="10" y="196" width="340" height="132" rx="16"/>
<text class="f-dark-l" x="28" y="222">MODELO</text>
<circle cx="48" cy="262" r="14" class="f-knob"/><line x1="48" y1="262" x2="39.3" y2="257.0" class="f-knob-i"/>
<circle cx="92" cy="262" r="14" class="f-knob"/><line x1="92" y1="262" x2="95.4" y2="252.6" class="f-knob-i"/>
<circle cx="136" cy="262" r="14" class="f-knob"/><line x1="136" y1="262" x2="145.7" y2="259.4" class="f-knob-i"/>
<circle cx="180" cy="262" r="14" class="f-knob"/><line x1="180" y1="262" x2="176.6" y2="252.6" class="f-knob-i"/>
