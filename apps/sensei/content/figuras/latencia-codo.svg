<text class="f-t" x="304" y="242" text-anchor="end" style="font-size:13px">120</text>
<text class="f-s" x="332" y="112" text-anchor="end" style="font-size:12px">↑ a 95 %: 553</text>

<rect class="f-chip" x="24" y="370" width="312" height="50" rx="10"/>
<text class="f-t" x="38" y="391" style="font-size:13px">De 50 a 90 %, la espera se multiplica por 9.</text>
<text class="f-s" x="38" y="409" style="font-size:12px">Cerca del 86 %, el p99 del pod ya gasta los 200 ms.</text>
