<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 500" role="img" aria-labelledby="f-imagenes-preproceso-t" class="f-svg" style="max-width:420px">
<title id="f-imagenes-preproceso-t">Del archivo al tensor, en ocho pasos, para una foto de 12 megapíxeles. 1, archivo JPEG de unos 3 MB. 2, decodificar: 4032 por 3024 píxeles con 3 canales, 36.6 MB en uint8. 3, girar según EXIF: queda de pie, 3024 por 4032. 4, resize: el lado corto a 256, queda 256 por 341, 262 KB. 5, center crop: el cuadro del centro de 224 por 224, 151 KB. 6, convertir a float32 y dividir entre 255: 602 KB. 7, normalizar con la media y la desviación de cada canal: 602 KB. 8, reordenar a CHW y agregar el batch: el tensor 1, 3, 224, 224.</title>
<rect class="f-card" x="10" y="10" width="340" height="480" rx="16"/>
<rect class="f-dark" x="18" y="422" width="324" height="58" rx="12"/>
<line class="f-flecha" x1="34" y1="40" x2="34" y2="446"/>
<circle class="f-acc" cx="34" cy="40" r="13"/><text class="f-acc-t" x="34" y="45" text-anchor="middle" style="font-size:14px">1</text><text class="f-t" x="60" y="44">Archivo JPEG</text><text class="f-l" x="334" y="44" text-anchor="end">≈ 3 MB</text><text class="f-s" x="60" y="64">bytes comprimidos, aún no son píxeles</text>
<circle class="f-acc" cx="34" cy="98" r="13"/><text class="f-acc-t" x="34" y="103" text-anchor="middle" style="font-size:14px">2</text><text class="f-t" x="60" y="102">Decodificar</text><text class="f-l" x="334" y="102" text-anchor="end">UINT8 · 36.6 MB</text><text class="f-s" x="60" y="122">4032 × 3024 píxeles × 3 canales</text>
<circle class="f-acc" cx="34" cy="156" r="13"/><text class="f-acc-t" x="34" y="161" text-anchor="middle" style="font-size:14px">3</text><text class="f-t" x="60" y="160">Girar según EXIF</text><text class="f-l" x="334" y="160" text-anchor="end">UINT8 · 36.6 MB</text><text class="f-s" x="60" y="180">la foto queda de pie: 3024 × 4032</text>
<circle class="f-acc" cx="34" cy="214" r="13"/><text class="f-acc-t" x="34" y="219" text-anchor="middle" style="font-size:14px">4</text><text class="f-t" x="60" y="218">Resize</text><text class="f-l" x="334" y="218" text-anchor="end">UINT8 · 262 KB</text><text class="f-s" x="60" y="238">el lado corto a 256: queda 256 × 341</text>
<circle class="f-acc" cx="34" cy="272" r="13"/><text class="f-acc-t" x="34" y="277" text-anchor="middle" style="font-size:14px">5</text><text class="f-t" x="60" y="276">Center crop</text><text class="f-l" x="334" y="276" text-anchor="end">UINT8 · 151 KB</text><text class="f-s" x="60" y="296">el cuadro del centro: 224 × 224</text>
<circle class="f-acc" cx="34" cy="330" r="13"/><text class="f-acc-t" x="34" y="335" text-anchor="middle" style="font-size:14px">6</text><text class="f-t" x="60" y="334">A float32 y ÷ 255</text><text class="f-l" x="334" y="334" text-anchor="end">FLOAT32 · 602 KB</text><text class="f-s" x="60" y="354">cada número queda entre 0 y 1</text>
<circle class="f-acc" cx="34" cy="388" r="13"/><text class="f-acc-t" x="34" y="393" text-anchor="middle" style="font-size:14px">7</text><text class="f-t" x="60" y="392">Normalizar</text><text class="f-l" x="334" y="392" text-anchor="end">FLOAT32 · 602 KB</text><text class="f-s" x="60" y="412">(x − media) ÷ desviación, por canal</text>
<circle class="f-acc" cx="34" cy="446" r="13"/><text class="f-acc-t" x="34" y="451" text-anchor="middle" style="font-size:14px">8</text><text class="f-dark-t" x="60" y="450" style="font-size:15px;font-weight:700">CHW y batch</text><text class="f-dark-l" x="334" y="450" text-anchor="end">AL MODELO</text><text class="f-dark-t" x="60" y="470">el tensor [1, 3, 224, 224]</text>
</svg>
