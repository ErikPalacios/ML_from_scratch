<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 420" role="img" aria-labelledby="f-python-ecosistema-syspath-t" class="f-svg" style="max-width:420px">
<title id="f-python-ecosistema-syspath-t">Cómo busca import json en las carpetas de sys.path. Las carpetas se revisan de arriba abajo y gana la primera que tenga un json. Primero, la carpeta del script, /home/ana/trabajo: si ahí hay un json.py tuyo, ese gana, se ejecuta, y la búsqueda termina. Segundo, las carpetas de PYTHONPATH, si existe la variable. Tercero, la biblioteca estándar, /usr/local/lib/python3.13, donde está el json de verdad, la carpeta json con su __init__.py: con tu json.py en la carpeta del script, nunca se lee. Cuarto, site-packages, donde se instalan los paquetes de otros, como pytest. Sin tu json.py, la búsqueda sigue de largo por la carpeta del script y por PYTHONPATH y se queda en la biblioteca estándar.</title>
