<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 410" role="img" aria-labelledby="f-e08-cicd-tiempos-t" class="f-svg" style="max-width:420px">
<title id="f-e08-cicd-tiempos-t">Línea de tiempo del gateway de Alba, en minutos desde el merge. Lint de 0 a 1 y pruebas de 0 a 2, a la vez. Imagen de 2 a 3. Push de 3 a 4: la imagen está en ECR a los 4 minutos. Paridad de 4 a 9: unos 4 minutos de prender la T4 y bajar las imágenes y 1 de examen. Staging de 9 a 12.5. Después, la espera de la aprobación, de duración variable. Producción tarda 5 minutos más: 17.5 minutos en total, sin contar la espera.</title>
<rect class="f-card" x="10" y="10" width="340" height="390" rx="16"/>
<text class="f-l" x="26" y="36">DEL MERGE A PRODUCCIÓN, EN MINUTOS</text>
<!-- eje: 0 min en x=104, 13 px por minuto; 17.5 min en x=331.5 -->
<g>
<line class="f-linea" x1="104" y1="56" x2="104" y2="278" style="stroke-dasharray:2 4"/>
<line class="f-linea" x1="156" y1="56" x2="156" y2="278" style="stroke-dasharray:2 4"/>
<line class="f-linea" x1="208" y1="56" x2="208" y2="278" style="stroke-dasharray:2 4"/>
<line class="f-linea" x1="260" y1="56" x2="260" y2="278" style="stroke-dasharray:2 4"/>
<line class="f-linea" x1="312" y1="56" x2="312" y2="278" style="stroke-dasharray:2 4"/>
</g>
<text class="f-s" x="104" y="322" text-anchor="middle" style="font-size:12px">0</text>
<text class="f-s" x="156" y="322" text-anchor="middle" style="font-size:12px">4</text>
<text class="f-s" x="208" y="322" text-anchor="middle" style="font-size:12px">8</text>
<text class="f-s" x="260" y="322" text-anchor="middle" style="font-size:12px">12</text>
<text class="f-s" x="312" y="322" text-anchor="middle" style="font-size:12px">16</text>
<text class="f-s" x="26" y="74" style="font-size:12px">lint</text>
<rect class="f-b" x="104" y="62" width="13" height="16" rx="3"/>
<text class="f-s" x="26" y="102" style="font-size:12px">pruebas</text>
<rect class="f-b" x="104" y="90" width="26" height="16" rx="3"/>
<text class="f-s" x="26" y="130" style="font-size:12px">imagen</text>
<rect class="f-y" x="130" y="118" width="13" height="16" rx="3"/>
<text class="f-s" x="26" y="158" style="font-size:12px">push</text>
<rect class="f-y" x="143" y="146" width="13" height="16" rx="3"/>
<text class="f-s" x="26" y="186" style="font-size:12px">paridad</text>
<rect class="f-p" x="156" y="174" width="52" height="16" rx="3" style="opacity:.45"/>
<rect class="f-p" x="208" y="174" width="13" height="16" rx="3"/>
<text class="f-s" x="182" y="170" text-anchor="middle" style="font-size:11px">arranque</text>
<text class="f-s" x="26" y="214" style="font-size:12px">staging</text>
<rect class="f-g" x="221" y="202" width="45.5" height="16" rx="3"/>
<text class="f-s" x="26" y="242" style="font-size:12px">aprobación</text>
<circle class="f-acc" cx="266.5" cy="238" r="7"/>
<text class="f-s" x="280" y="243" style="font-size:12px">espera</text>
<text class="f-s" x="26" y="270" style="font-size:12px">producción</text>
<rect class="f-g" x="266.5" y="258" width="65" height="16" rx="3"/>
<line class="f-linea" x1="104" y1="298" x2="156" y2="298"/>
<line class="f-linea" x1="156" y1="292" x2="156" y2="304"/><line class="f-linea" x1="104" y1="292" x2="104" y2="304"/>
<text class="f-s" x="130" y="292" text-anchor="middle" style="font-size:12px">ECR: 4 min</text>
<text class="f-t" x="26" y="350" style="font-size:14px">≈ 17.5 min + la aprobación</text>
<text class="f-s" x="26" y="372" style="font-size:12px">lint y pruebas cuentan como 2; prender la T4, ≈ 4;</text>
<text class="f-s" x="26" y="388" style="font-size:12px">staging y producción, 8.5 de los 17.5 minutos.</text>
</svg>
