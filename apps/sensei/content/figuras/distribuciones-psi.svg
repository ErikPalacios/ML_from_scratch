<text class="f-s" x="141.2" y="125.0" text-anchor="middle" style="font-size:12px;font-weight:700">30</text>
<text class="f-s" x="129.2" y="236.0" text-anchor="middle" style="font-size:12px">bin 2</text>
<rect class="f-b2" x="164.0" y="100.0" width="20" height="120.0" rx="3"/>
<text class="f-s" x="174.0" y="95.0" text-anchor="middle" style="font-size:12px;font-weight:700">40</text>
