<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 318" role="img" aria-labelledby="f-e12-monitoreo-multiventana-t" class="f-svg" style="max-width:420px">
<title id="f-e12-monitoreo-multiventana-t">Un incidente de ejemplo con 3 % de errores, burn rate de 30, durante los primeros 40 minutos. La gráfica muestra el burn rate medido en dos ventanas contra el tiempo, de 0 a 100 minutos, con una línea horizontal en el umbral de 14.4. Antes y después del incidente hay el 0.1 % de errores normal, burn rate de 1. La ventana de 5 minutos sube a 30 en 5 minutos, se queda ahí y vuelve a 1 cinco minutos después del arreglo. La ventana de 1 hora sube despacio, cruza 14.4 en el minuto 27, llega a ≈ 20 y no baja de 14.4 hasta el minuto 72. El page suena solo mientras las dos están arriba del umbral: del minuto 27 al 42.</title>
<line x1="18" y1="20" x2="40" y2="20" style="stroke:var(--b);stroke-width:3"/><text class="f-s" x="46" y="24" style="font-size:12px">ventana de 1 h</text>
<line x1="150" y1="20" x2="172" y2="20" style="stroke:var(--o);stroke-width:3"/><text class="f-s" x="178" y="24" style="font-size:12px">ventana de 5 min</text>
<rect class="f-y" x="50.0" y="40" width="116.0" height="14" rx="3"/>
<text class="f-l" x="56.0" y="51" style="fill:var(--navy)">INCIDENTE 3 %</text>
<text class="f-l" x="172.0" y="51">ARREGLO</text>
<rect class="f-p" x="128.3" y="62" width="43.5" height="188.0" style="opacity:.18"/>
<text class="f-l" x="150.0" y="108" text-anchor="middle" style="fill:var(--p)">PAGE</text>
<line x1="50.0" y1="250.0" x2="340.0" y2="250.0" style="stroke:var(--muted);stroke-width:1"/>
<line x1="50.0" y1="250.0" x2="50.0" y2="62" style="stroke:var(--muted);stroke-width:1"/>
<line x1="50.0" y1="164.5" x2="340.0" y2="164.5" style="stroke:var(--muted);stroke-width:1.2;stroke-dasharray:5 4"/>
<text class="f-s" x="44.0" y="168.5" text-anchor="end" style="font-size:12px">14.4×</text>
<text class="f-s" x="44.0" y="75.9" text-anchor="end" style="font-size:12px">30×</text>
<text class="f-s" x="44.0" y="254.0" text-anchor="end" style="font-size:12px">0</text>
<text class="f-s" x="50.0" y="268.0" text-anchor="middle" style="font-size:12px">0</text>
<text class="f-s" x="108.0" y="268.0" text-anchor="middle" style="font-size:12px">20</text>
<text class="f-s" x="166.0" y="268.0" text-anchor="middle" style="font-size:12px">40</text>
<text class="f-s" x="224.0" y="268.0" text-anchor="middle" style="font-size:12px">60</text>
<text class="f-s" x="282.0" y="268.0" text-anchor="middle" style="font-size:12px">80</text>
<text class="f-s" x="340.0" y="268.0" text-anchor="middle" style="font-size:12px">100</text>
<text class="f-s" x="195.0" y="286.0" text-anchor="middle" style="font-size:12px">minutos desde que empieza el incidente</text>
<polyline points="50.0,244.1 64.5,71.9 163.1,71.9 177.6,244.1 340.0,244.1" style="fill:none;stroke:var(--o);stroke-width:3;stroke-linejoin:round"/>
<polyline points="50.0,244.1 163.1,129.3 221.1,129.3 337.1,244.1 340.0,244.1" style="fill:none;stroke:var(--b);stroke-width:3;stroke-linejoin:round"/>
<line x1="258.8" y1="124" x2="258.8" y2="250.0" style="stroke:var(--b);stroke-width:1.2;stroke-dasharray:3 3"/>
<text class="f-s" x="346" y="102" text-anchor="end" style="font-size:12px">sola, la de 1 h</text>
<text class="f-s" x="346" y="117" text-anchor="end" style="font-size:12px">sonaría hasta el 72</text>
<text class="f-s" x="18" y="306" style="font-size:12px">Suena con las dos arriba; se apaga con la corta.</text>
</svg>