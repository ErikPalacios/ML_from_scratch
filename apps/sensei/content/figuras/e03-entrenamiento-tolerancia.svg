<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" role="img" aria-labelledby="f-e03-entrenamiento-tolerancia-t" class="f-svg" style="max-width:420px">
<title id="f-e03-entrenamiento-tolerancia-t">Una recta de 84.8 a 85.8 por ciento de exactitud en el golden set. Una banda verde va de 84.97 a 85.49: el promedio de las semillas, 85.23, más o menos la tolerancia de 0.26 puntos. Las corridas de 85.1 y 85.3 caen dentro de la banda: son ruido. Una repetición de 85.71 queda fuera, 0.48 puntos arriba: algo cambió. Abajo, el margen del golden set, más o menos 0.3 puntos, casi del mismo ancho que la banda.</title>
<rect class="f-card" x="10" y="10" width="340" height="280" rx="16"/>
<text class="f-l" x="26" y="36">EXACTITUD EN EL GOLDEN SET, %</text>
<rect class="f-g" x="79.8" y="88" width="158.4" height="48" rx="6" style="opacity:.55"/>
<text class="f-s" x="159.0" y="78" text-anchor="middle" style="font-size:12px">85.23 ± τ (0.26)</text>
<line class="f-linea" x1="30" y1="112" x2="330" y2="112" style="stroke-width:2"/>
<line class="f-linea" x1="30.0" y1="106" x2="30.0" y2="118"/>
<text class="f-s" x="30.0" y="160" text-anchor="middle" style="font-size:12px">84.8</text>
<line class="f-linea" x1="90.0" y1="106" x2="90.0" y2="118"/>
<text class="f-s" x="90.0" y="160" text-anchor="middle" style="font-size:12px">85.0</text>
<line class="f-linea" x1="150.0" y1="106" x2="150.0" y2="118"/>
<text class="f-s" x="150.0" y="160" text-anchor="middle" style="font-size:12px">85.2</text>
<line class="f-linea" x1="210.0" y1="106" x2="210.0" y2="118"/>
<text class="f-s" x="210.0" y="160" text-anchor="middle" style="font-size:12px">85.4</text>
<line class="f-linea" x1="270.0" y1="106" x2="270.0" y2="118"/>
<text class="f-s" x="270.0" y="160" text-anchor="middle" style="font-size:12px">85.6</text>
<line class="f-linea" x1="330.0" y1="106" x2="330.0" y2="118"/>
<text class="f-s" x="330.0" y="160" text-anchor="middle" style="font-size:12px">85.8</text>
<line class="f-linea" x1="159.0" y1="92" x2="159.0" y2="132" style="stroke-dasharray:3 3"/>
<circle class="f-b" cx="120.0" cy="112" r="7"/>
<circle class="f-b" cx="180.0" cy="112" r="7"/>
<circle class="f-o" cx="303.0" cy="112" r="7"/>
<text class="f-s" x="120.0" y="186" text-anchor="middle" style="font-size:12px">85.1</text>
<text class="f-s" x="180.0" y="186" text-anchor="middle" style="font-size:12px">85.3</text>
<text class="f-s" x="303.0" y="186" text-anchor="middle" style="font-size:12px">85.71</text>
<text class="f-s" x="150.0" y="206" text-anchor="middle" style="font-size:12px">dentro: ruido</text>
<text class="f-s" x="338" y="206" text-anchor="end" style="font-size:12px">fuera: algo cambió</text>
<line class="f-linea" x1="66.0" y1="236" x2="252.0" y2="236" style="stroke-width:2"/>
<line class="f-linea" x1="66.0" y1="230" x2="66.0" y2="242"/>
<line class="f-linea" x1="252.0" y1="230" x2="252.0" y2="242"/>
<text class="f-s" x="159.0" y="262" text-anchor="middle" style="font-size:12px">margen del golden, ε ≈ ± 0.3</text>
<text class="f-s" x="180" y="280" text-anchor="middle" style="font-size:12px">dos ruidos distintos, casi del mismo ancho</text>
</svg>
