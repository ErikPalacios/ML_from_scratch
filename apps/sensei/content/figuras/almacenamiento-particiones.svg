<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 484" role="img" aria-labelledby="f-almacenamiento-particiones-t" class="f-svg" style="max-width:420px">
<title id="f-almacenamiento-particiones-t">Un mes de log de predicciones del clasificador de Alba, noviembre de 2026, como 30 casillas, una partición por día, cada una con 4 archivos Parquet de unos 125 MB, de dt=2026-11-01 a dt=2026-11-30. La casilla del día 6 está resaltada: es la que pide una consulta de un día. Las casillas del 1 al 7 están marcadas como la semana. Abajo, lo que se lee en cada caso: un día, 4 archivos y medio GB; una semana, 28 archivos y 3.3 GB; el mes entero, 120 archivos y 15 GB. Sin particiones, cualquier consulta tendría que abrir el mes entero.</title>
