<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 372" role="img" aria-labelledby="f-pytorch-fila-t" class="f-svg" style="max-width:420px">
<title id="f-pytorch-fila-t">Una línea de tiempo de un batch de 32 fotos en la GPU, de 0 a 60 milisegundos, con los supuestos de la cuenta del texto. Arriba, la CPU deja los 174 kernels de la ResNet-50 en la fila de la GPU en unos 1.7 milisegundos, un tramo angosto al principio, y ahí regresa modelo(x) y un reloj sin sincronizar se detiene. Abajo, la GPU corre esos kernels uno tras otro y termina hasta los 60 milisegundos. torch.cuda.synchronize() regresa hasta ese momento. Sin sincronizar, el reloj marca 1.7 milisegundos, que serían unas 18,800 fotos por segundo, un número falso; sincronizando marca unos 60 milisegundos, unas 530 fotos por segundo de verdad.</title>
<rect class="f-card" x="10" y="10" width="340" height="352" rx="16"/>
<text class="f-l" x="26" y="36">UN BATCH DE 32, EN EL TIEMPO</text>
<text class="f-t" x="30" y="66" style="font-size:13px;font-weight:700">CPU: deja 174 kernels en la fila</text>
<rect class="f-b" x="30" y="76" width="9" height="20" rx="2"/>
<line class="f-flecha" x1="39" y1="70" x2="39" y2="102" style="stroke-dasharray:3 3"/>
<text class="f-s" x="48" y="91" style="font-size:12px">aquí regresa modelo(x): 1.7 ms</text>
<line class="f-flecha" x1="34" y1="98" x2="34" y2="128"/>
<polygon class="f-punta" points="29,126 39,126 34,135"/>
<text class="f-s" x="48" y="120" style="font-size:12px">los kernels esperan su turno</text>
<text class="f-t" x="30" y="156" style="font-size:13px;font-weight:700">GPU: los corre uno tras otro</text>
<rect class="f-b" x="30" y="166" width="24" height="20" rx="2"/>
<rect class="f-b2" x="55" y="166" width="20" height="20" rx="2"/>
<rect class="f-b" x="76" y="166" width="28" height="20" rx="2"/>
<rect class="f-b2" x="105" y="166" width="18" height="20" rx="2"/>
<rect class="f-b" x="124" y="166" width="26" height="20" rx="2"/>
<rect class="f-b2" x="151" y="166" width="22" height="20" rx="2"/>
<rect class="f-b" x="174" y="166" width="30" height="20" rx="2"/>
<rect class="f-b2" x="205" y="166" width="20" height="20" rx="2"/>
<rect class="f-b" x="226" y="166" width="26" height="20" rx="2"/>
<rect class="f-b2" x="253" y="166" width="22" height="20" rx="2"/>
<rect class="f-b" x="276" y="166" width="28" height="20" rx="2"/>
<rect class="f-b2" x="305" y="166" width="18" height="20" rx="2"/>
<rect class="f-b" x="324" y="166" width="16" height="20" rx="2"/>
<line class="f-flecha" x1="340" y1="160" x2="340" y2="192" style="stroke-dasharray:3 3"/>
<line class="f-linea" x1="30" y1="210" x2="340" y2="210"/>
<line class="f-linea" x1="30" y1="205" x2="30" y2="215"/>
<line class="f-linea" x1="133" y1="205" x2="133" y2="215"/>
<line class="f-linea" x1="237" y1="205" x2="237" y2="215"/>
<line class="f-linea" x1="340" y1="205" x2="340" y2="215"/>
<text class="f-s" x="30" y="231" text-anchor="middle" style="font-size:12px">0</text>
<text class="f-s" x="133" y="231" text-anchor="middle" style="font-size:12px">20</text>
<text class="f-s" x="237" y="231" text-anchor="middle" style="font-size:12px">40</text>
<text class="f-s" x="332" y="231" text-anchor="middle" style="font-size:12px">60 ms</text>
<rect class="f-chip" x="26" y="246" width="308" height="48" rx="10"/>
<text class="f-t" x="38" y="266" style="font-size:13px;font-weight:700">Sin synchronize(): 1.7 ms</text>
<text class="f-s" x="38" y="284" style="font-size:12px">≈ 18,800 fotos por segundo: falso</text>
<rect class="f-dark" x="26" y="302" width="308" height="48" rx="10"/>
<text class="f-dark-t" x="38" y="322" style="font-size:13px;font-weight:700">Con synchronize(): ≈ 60 ms</text>
<text class="f-dark-t" x="38" y="340" style="font-size:12px">≈ 530 fotos por segundo: el de verdad</text>
</svg>
