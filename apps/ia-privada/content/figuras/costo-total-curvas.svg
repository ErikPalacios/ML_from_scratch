<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 430" role="img" aria-labelledby="f-costo-total-curvas-t" class="f-svg" style="max-width:420px">
<title id="f-costo-total-curvas-t">Costo al mes de cada opción, en dólares de 0 a 5,000, contra las preguntas al mes, de 0 a 250 mil, con las preguntas del despacho (6,000 tokens de entrada y 500 de salida). El servidor propio con 3 L40S es una línea plana de ≈ US$2,746 hasta su capacidad en horario, ≈ 190 mil preguntas al mes; la renta de las mismas 3 L40S prendidas todo el mes es otra línea plana casi encima, ≈ US$2,830. Las APIs son rectas que salen de cero: Kimi K3 en la región de México de Bedrock cruza al propio en ≈ 98 mil preguntas al mes; Claude Sonnet 5.5 lo cruza en ≈ 161.5 mil; Qwen3 32B por API, el mismo modelo del despacho, apenas se separa del piso: US$41 al mes con las 66 mil preguntas del despacho, y no cruza dentro de la gráfica. El despacho está en 66 mil, a la izquierda de los dos cruces.</title>
