<text class="f-l" x="30" y="372">FRENTE</text>
<text class="f-l" x="330" y="372" text-anchor="end">ATRÁS</text>
<text class="f-l" x="179" y="372" text-anchor="middle">SOLO ALETAS</text>
<text class="f-s" x="26" y="394">Los ventiladores del chasis empujan</text>
<text class="f-s" x="26" y="410">el aire por todas las aletas, de frente</text>
<text class="f-s" x="26" y="426">hacia atrás.</text>
</svg>
