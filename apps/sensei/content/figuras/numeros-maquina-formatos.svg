<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 484" role="img" aria-labelledby="f-numeros-maquina-formatos-t" class="f-svg" style="max-width:420px">
<title id="f-numeros-maquina-formatos-t">Cómo reparte sus bits cada formato de punto flotante: un bit de signo, luego el exponente, que da el rango, y luego la mantisa, que da las cifras. FP32, de 4 bytes: 1 de signo, 8 de exponente y 23 de mantisa; llega hasta unos 3.4 por 10 a la 38 con unas 7 cifras. BF16, de 2 bytes: 1, 8 y 7, que son los primeros 16 bits de FP32; el mismo rango con unas 2 cifras. FP16, de 2 bytes: 1, 5 y 10; unas 3 cifras, pero solo llega hasta 65,504. FP8 E4M3, de 1 byte: 1, 4 y 3, hasta 448. FP8 E5M2, de 1 byte: 1, 5 y 2, hasta 57,344.</title>
<rect class="f-card" x="10" y="10" width="340" height="464" rx="16"/>
<text class="f-l" x="28.0" y="36.0">CÓMO REPARTE SUS BITS CADA FORMATO</text>
<rect class="f-p" x="28.0" y="50.0" width="12.0" height="12.0" rx="3"/>
<text class="f-s" x="46.0" y="60.0" style="font-size:12px">signo</text>
<rect class="f-o" x="96.0" y="50.0" width="12.0" height="12.0" rx="3"/>
<text class="f-s" x="114.0" y="60.0" style="font-size:12px">exponente: rango</text>
<rect class="f-b" x="222.0" y="50.0" width="12.0" height="12.0" rx="3"/>
<text class="f-s" x="240.0" y="60.0" style="font-size:12px">mantisa: cifras</text>
<text class="f-t" x="28.0" y="92.0" style="font-size:14px">FP32 · 4 bytes</text>
<rect class="f-p" x="28.0" y="100.0" width="9.5" height="24.0" rx="3"/>
<rect class="f-o" x="38.5" y="100.0" width="75.0" height="24.0" rx="3"/>
<text x="76.0" y="116.5" text-anchor="middle" style="fill:#fff;font:800 12px var(--sans)">8</text>
<rect class="f-b" x="114.5" y="100.0" width="217.5" height="24.0" rx="3"/>
<text x="223.2" y="116.5" text-anchor="middle" style="fill:#fff;font:800 12px var(--sans)">23</text>
<text class="f-s" x="28.0" y="144.0" style="font-size:12px">hasta ≈ 3.4 × 10³⁸ · ≈ 7 cifras</text>
<text class="f-t" x="28.0" y="170.0" style="font-size:14px">BF16 · 2 bytes</text>
<rect class="f-p" x="28.0" y="178.0" width="9.5" height="24.0" rx="3"/>
<rect class="f-o" x="38.5" y="178.0" width="75.0" height="24.0" rx="3"/>
<text x="76.0" y="194.5" text-anchor="middle" style="fill:#fff;font:800 12px var(--sans)">8</text>
<rect class="f-b" x="114.5" y="178.0" width="65.5" height="24.0" rx="3"/>
<text x="147.2" y="194.5" text-anchor="middle" style="fill:#fff;font:800 12px var(--sans)">7</text>
<text class="f-s" x="28.0" y="222.0" style="font-size:12px">hasta ≈ 3.4 × 10³⁸ · ≈ 2 cifras</text>
<text class="f-s" x="192.0" y="195.0" style="font-size:12px">los primeros 16 bits</text>
<text class="f-s" x="192.0" y="210.0" style="font-size:12px">de FP32</text>
<text class="f-t" x="28.0" y="248.0" style="font-size:14px">FP16 · 2 bytes</text>
<rect class="f-p" x="28.0" y="256.0" width="9.5" height="24.0" rx="3"/>
<rect class="f-o" x="38.5" y="256.0" width="46.5" height="24.0" rx="3"/>
<text x="61.8" y="272.5" text-anchor="middle" style="fill:#fff;font:800 12px var(--sans)">5</text>
<rect class="f-b" x="86.0" y="256.0" width="94.0" height="24.0" rx="3"/>
<text x="133.0" y="272.5" text-anchor="middle" style="fill:#fff;font:800 12px var(--sans)">10</text>
<text class="f-s" x="28.0" y="300.0" style="font-size:12px">hasta 65,504 · ≈ 3 cifras</text>
<text class="f-s" x="192.0" y="273.0" style="font-size:12px">menos rango,</text>
<text class="f-s" x="192.0" y="288.0" style="font-size:12px">más cifras</text>
<text class="f-t" x="28.0" y="326.0" style="font-size:14px">FP8 E4M3 · 1 byte</text>
<rect class="f-p" x="28.0" y="334.0" width="9.5" height="24.0" rx="3"/>
<rect class="f-o" x="38.5" y="334.0" width="37.0" height="24.0" rx="3"/>
<text x="57.0" y="350.5" text-anchor="middle" style="fill:#fff;font:800 12px var(--sans)">4</text>
<rect class="f-b" x="76.5" y="334.0" width="27.5" height="24.0" rx="3"/>
<text x="90.2" y="350.5" text-anchor="middle" style="fill:#fff;font:800 12px var(--sans)">3</text>
<text class="f-s" x="28.0" y="378.0" style="font-size:12px">hasta 448</text>
<text class="f-t" x="190.0" y="326.0" style="font-size:14px">FP8 E5M2 · 1 byte</text>
<rect class="f-p" x="190.0" y="334.0" width="9.5" height="24.0" rx="3"/>
<rect class="f-o" x="200.5" y="334.0" width="46.5" height="24.0" rx="3"/>
<text x="223.8" y="350.5" text-anchor="middle" style="fill:#fff;font:800 12px var(--sans)">5</text>
<rect class="f-b" x="248.0" y="334.0" width="18.0" height="24.0" rx="3"/>
<text x="257.0" y="350.5" text-anchor="middle" style="fill:#fff;font:800 12px var(--sans)">2</text>
<text class="f-s" x="190.0" y="378.0" style="font-size:12px">hasta 57,344</text>
<rect class="f-chip" x="24.0" y="398.0" width="312.0" height="66.0" rx="10"/>
<text class="f-t" x="38.0" y="419.0" style="font-size:13px">Más exponente, más rango.</text>
<text class="f-t" x="38.0" y="437.0" style="font-size:13px">Más mantisa, más cifras.</text>
<text class="f-s" x="38.0" y="455.0" style="font-size:12px">Con pocos bits, ganar uno es perder el otro.</text>
</svg>
