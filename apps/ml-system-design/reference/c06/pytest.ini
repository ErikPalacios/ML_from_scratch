# Configuración de pytest para TODO el caso c06: `cd reference/c06 && pytest` corre las 5 carpetas.
# Sin GPU, sin Triton, sin Kafka: los servicios externos están detrás de interfaces con fakes.
[pytest]
# Cada carpeta entra al sys.path: los tests importan `engine`, `match`, `priority`, `prevalence` y
# `main` igual que en la imagen del gateway (donde engine.py y match.py se copian junto a main.py)
pythonpath = decision hashing review eval gateway
testpaths = decision/tests hashing/tests review/tests eval/tests gateway/tests
# Salida compacta: en CI importa la lista de fallos
addopts = -q
