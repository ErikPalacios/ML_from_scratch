<circle cx="145.3" cy="246.2" r="6" class="f-y" style="stroke:var(--blk);stroke-width:2"/>
<text class="f-t" x="133.3" y="238.2" text-anchor="end" style="font-size:12px">z = −2 → 11.9 %</text>
<circle cx="192.0" cy="170.0" r="6" class="f-y" style="stroke:var(--blk);stroke-width:2"/>
<text class="f-t" x="204.0" y="194.0" text-anchor="start" style="font-size:12px">z = 0 → 50 %</text>
<circle cx="238.7" cy="93.8" r="6" class="f-y" style="stroke:var(--blk);stroke-width:2"/>
<text class="f-t" x="252.7" y="115.8" text-anchor="start" style="font-size:12px">z = 2 → 88.1 %</text>
<rect class="f-off" x="52" y="302" width="138.0" height="22" rx="6"/>
<rect class="f-b2" x="194.0" y="302" width="138.0" height="22" rx="6"/>
<text class="f-t" x="122.0" y="318" text-anchor="middle" style="font-size:13px">«no»</text>
<text class="f-t" x="262.0" y="318" text-anchor="middle" style="font-size:13px">«sí»</text>
<text class="f-l" x="192.0" y="346" text-anchor="middle">LOGIT z · DECISIÓN CON UMBRAL 0.5</text>
<text class="f-s" x="28" y="372" style="font-size:12px">El umbral no cambia la curva: solo dónde se corta.</text>
</svg>
