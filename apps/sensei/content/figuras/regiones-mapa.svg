<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 410" role="img" aria-labelledby="f-regiones-mapa-t" class="f-svg" style="max-width:420px">
<title id="f-regiones-mapa-t">Una región de la nube, us-east-1, en el norte de Virginia. Adentro hay tres zonas de disponibilidad: us-east-1a, us-east-1b y us-east-1c. Cada zona tiene uno o varios centros de datos, con su propia electricidad y su propia red. Las zonas están unidas entre sí por fibra del proveedor, con un tiempo de ida y vuelta de más o menos 1 milisegundo. Fuera de la región, todo queda lejos: otra región, us-west-2 en Oregón, está a unos 3,500 kilómetros, con 60 a 80 milisegundos de ida y vuelta; y Ana, en la Ciudad de México, está a unos 3,000 kilómetros, con unos 60 milisegundos.</title>
<rect class="f-card" x="10" y="10" width="340" height="390" rx="16"/>
<text class="f-l" x="26" y="36">REGIÓN us-east-1 · NORTE DE VIRGINIA</text>
<rect class="f-chip" x="22" y="48" width="316" height="172" rx="14"/>
<rect class="f-card" x="34" y="62" width="88" height="104" rx="10"/>
<text class="f-t" x="78" y="83" text-anchor="middle" style="font-size:13px">us-east-1a</text>
