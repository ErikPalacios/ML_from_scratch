<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 388" role="img" aria-labelledby="f-evals-estratos-t" class="f-svg" style="max-width:420px">
<title id="f-evals-estratos-t">Las 200 preguntas del examen del despacho como 200 cuadritos, repartidas en cinco estratos (propuesta del ejemplo): 110 preguntas con respuesta en el expediente, que se califican por respuesta correcta y cita; 30 sin respuesta, donde el sistema debe decir que no lo encontró; 20 de permisos, donde la regla es cero fugas; 20 de resumir, con rúbrica; y 20 de cláusulas parecidas, con páginas de oro. Ningún estrato chico sostiene un porcentaje propio.</title>
