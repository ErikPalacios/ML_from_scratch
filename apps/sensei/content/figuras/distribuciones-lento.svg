<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 420" role="img" aria-labelledby="f-distribuciones-lento-t" class="f-svg" style="max-width:420px">
<title id="f-distribuciones-lento-t">Un drift lento: cada semana el bin de fotos muy oscuras gana 1 punto y el de medias pierde 1, de 10 a 30 por ciento en 20 semanas. La línea contra la semana anterior se queda pegada a cero, nunca pasa de 0.0012. La línea contra la referencia de entrenamiento sube: cruza 0.1 en la semana 11, 0.2 en la semana 15 y llega a 0.36 en la semana 20.</title>
