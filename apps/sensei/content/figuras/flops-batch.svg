<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 466" role="img" aria-labelledby="f-flops-batch-t" class="f-svg" style="max-width:420px">
<title id="f-flops-batch-t">El batching, en una capa de 4,096 por 4,096 en FP16. Arriba, con una entrada, la matriz de pesos se lee una vez (33.6 MB) para hacer 33.6 millones de FLOPs: 1 FLOP por byte. Con 8 entradas se lee lo mismo, 33.7 MB, para 268 millones de FLOPs: casi 8 FLOPs por byte. Abajo, barras de la intensidad según el batch: 1 con batch 1, 8 con batch 8, 31.5 con batch 32, 228 con batch 256 y 410 con batch 512. Una línea marca el punto de quiebre de la T4, cerca de 203, y otra el de la L4, cerca de 403.</title>
<rect class="f-card" x="10" y="10" width="340" height="446" rx="16"/>
<text class="f-l" x="28" y="36">UNA LECTURA DE LOS PESOS, MUCHOS USOS</text>
<rect class="f-dark" x="28" y="52" width="60" height="60" rx="6"/>
<text class="f-dark-t" x="58" y="82" text-anchor="middle" style="font-weight:700">W</text>
<text class="f-dark-l" x="58" y="98" text-anchor="middle">PESOS</text>
<text class="f-s" x="100" y="87" text-anchor="middle">×</text>
<rect class="f-y" x="112" y="52" width="6" height="60" rx="2"/>
<text class="f-t" x="196" y="66" style="font-size:14px">batch 1</text>
<text class="f-s" x="196" y="84" style="font-size:12px">lee 33.6 MB · 33.6 MFLOPs</text>
<text class="f-s" x="196" y="102" style="font-size:12px;font-weight:700">≈ 1 FLOP por byte</text>
<rect class="f-dark" x="28" y="130" width="60" height="60" rx="6"/>
<text class="f-dark-t" x="58" y="160" text-anchor="middle" style="font-weight:700">W</text>
<text class="f-dark-l" x="58" y="176" text-anchor="middle">PESOS</text>
<text class="f-s" x="100" y="165" text-anchor="middle">×</text>
<rect class="f-y" x="112" y="130" width="6" height="60" rx="2"/>
<rect class="f-y" x="120" y="130" width="6" height="60" rx="2"/>
<rect class="f-y" x="128" y="130" width="6" height="60" rx="2"/>
<rect class="f-y" x="136" y="130" width="6" height="60" rx="2"/>
<rect class="f-y" x="144" y="130" width="6" height="60" rx="2"/>
<rect class="f-y" x="152" y="130" width="6" height="60" rx="2"/>
<rect class="f-y" x="160" y="130" width="6" height="60" rx="2"/>
<rect class="f-y" x="168" y="130" width="6" height="60" rx="2"/>
<text class="f-t" x="196" y="144" style="font-size:14px">batch 8</text>
<text class="f-s" x="196" y="162" style="font-size:12px">lee 33.7 MB · 268 MFLOPs</text>
<text class="f-s" x="196" y="180" style="font-size:12px;font-weight:700">≈ 8 FLOPs por byte</text>
<text class="f-s" x="28" y="214" style="font-size:12px">Los FLOPs crecen 8 veces; los bytes, casi nada.</text>
<text class="f-l" x="28" y="246">INTENSIDAD SEGÚN EL BATCH</text>
<text class="f-s" x="92" y="288" text-anchor="end" style="font-size:12px">batch 1</text>
<rect x="100" y="276" width="2.0" height="16" rx="3" style="fill:var(--b)"/>
<text class="f-s" x="108.0" y="288" style="font-size:12px;font-weight:700;paint-order:stroke;stroke:var(--blk);stroke-width:4px;stroke-linejoin:round">1</text>
<text class="f-s" x="92" y="312" text-anchor="end" style="font-size:12px">batch 8</text>
<rect x="100" y="300" width="3.9" height="16" rx="3" style="fill:var(--b)"/>
<text class="f-s" x="109.9" y="312" style="font-size:12px;font-weight:700;paint-order:stroke;stroke:var(--blk);stroke-width:4px;stroke-linejoin:round">8</text>
<text class="f-s" x="92" y="336" text-anchor="end" style="font-size:12px">batch 32</text>
<rect x="100" y="324" width="15.4" height="16" rx="3" style="fill:var(--b)"/>
<text class="f-s" x="121.4" y="336" style="font-size:12px;font-weight:700;paint-order:stroke;stroke:var(--blk);stroke-width:4px;stroke-linejoin:round">31.5</text>
<text class="f-s" x="92" y="360" text-anchor="end" style="font-size:12px">batch 256</text>
<rect x="100" y="348" width="111.3" height="16" rx="3" style="fill:var(--b)"/>
<text class="f-s" x="217.3" y="360" style="font-size:12px;font-weight:700;paint-order:stroke;stroke:var(--blk);stroke-width:4px;stroke-linejoin:round">228</text>
<text class="f-s" x="92" y="384" text-anchor="end" style="font-size:12px">batch 512</text>
<rect x="100" y="372" width="200.2" height="16" rx="3" style="fill:var(--b)"/>
<text class="f-s" x="306.2" y="384" style="font-size:12px;font-weight:700;paint-order:stroke;stroke:var(--blk);stroke-width:4px;stroke-linejoin:round">410</text>
<line x1="199.3" y1="270" x2="199.3" y2="396" style="stroke:var(--tm-ink3);stroke-width:1.5;stroke-dasharray:4 4"/>
<text class="f-s" x="199.3" y="264" text-anchor="middle" style="font-size:12px;font-weight:700">T4 ≈ 203</text>
<line x1="297.2" y1="270" x2="297.2" y2="396" style="stroke:var(--tm-ink3);stroke-width:1.5;stroke-dasharray:4 4"/>
<text class="f-s" x="297.2" y="264" text-anchor="middle" style="font-size:12px;font-weight:700">L4 ≈ 403</text>
<text class="f-s" x="28" y="420" style="font-size:12px">Con batch b, cada peso se usa b veces: la intensidad</text>
<text class="f-s" x="28" y="436" style="font-size:12px">es ≈ b mientras los pesos sean casi todos los bytes.</text>
</svg>
