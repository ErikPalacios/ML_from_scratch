<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 420" role="img" aria-labelledby="f-gestionados-radio-t" class="f-svg" style="max-width:420px">
<title id="f-gestionados-radio-t">Dos diagramas del mismo ataque: alguien entra al pod del gateway de Alba. Arriba, un rol para todo: el gateway, Triton y Fluent Bit usan el mismo rol, con permiso s3 asterisco sobre todo, así que el atacante alcanza los tres buckets: artefactos, logs y etiquetado. Abajo, un rol por componente: el gateway no tiene permisos de S3, Triton solo lee el prefijo triton de artefactos y Fluent Bit solo escribe en logs. El mismo ataque no alcanza ningún bucket.</title>
<rect class="f-card" x="10" y="10" width="340" height="400" rx="16"/>
<text class="f-l" x="24" y="36">UN ROL PARA TODO</text>
<rect class="f-o" x="22" y="50" width="84" height="26" rx="7"/>
<text class="f-pill-t" x="64" y="67" text-anchor="middle" style="font-size:12px">gateway</text>
<line class="f-linea" x1="106" y1="63.0" x2="128" y2="99.0"/>
<rect class="f-chip" x="22" y="86" width="84" height="26" rx="7"/>
<text class="f-s" x="64" y="103" text-anchor="middle" style="font-size:12px">Triton</text>
<line class="f-linea" x1="106" y1="99.0" x2="128" y2="99.0"/>
<rect class="f-chip" x="22" y="122" width="84" height="26" rx="7"/>
<text class="f-s" x="64" y="139" text-anchor="middle" style="font-size:12px">Fluent Bit</text>
<line class="f-linea" x1="106" y1="135.0" x2="128" y2="99.0"/>
<rect class="f-chip" x="128" y="86" width="96" height="26" rx="7"/>
<text class="f-t" x="176" y="103" text-anchor="middle" style="font-size:12px">s3:* sobre *</text>
<line class="f-linea" x1="224" y1="99.0" x2="246" y2="63.0"/>
<rect class="f-o" x="246" y="50" width="92" height="26" rx="7"/>
<text class="f-pill-t" x="292" y="67" text-anchor="middle" style="font-size:12px">artefactos</text>
<line class="f-linea" x1="224" y1="99.0" x2="246" y2="99.0"/>
<rect class="f-o" x="246" y="86" width="92" height="26" rx="7"/>
<text class="f-pill-t" x="292" y="103" text-anchor="middle" style="font-size:12px">logs</text>
<line class="f-linea" x1="224" y1="99.0" x2="246" y2="135.0"/>
<rect class="f-o" x="246" y="122" width="92" height="26" rx="7"/>
<text class="f-pill-t" x="292" y="139" text-anchor="middle" style="font-size:12px">etiquetado</text>
<text class="f-s" x="24" y="176" style="font-size:12px">El atacante alcanza los 3 buckets.</text>
<line class="f-linea" x1="24" y1="194" x2="336" y2="194"/>
<text class="f-l" x="24" y="220">UN ROL POR COMPONENTE</text>
<rect class="f-o" x="22" y="234" width="84" height="26" rx="7"/>
<text class="f-pill-t" x="64" y="251" text-anchor="middle" style="font-size:12px">gateway</text>
<line class="f-linea" x1="106" y1="247.0" x2="128" y2="247.0"/>
<rect class="f-off" x="128" y="234" width="96" height="26" rx="7"/>
<text class="f-s" x="176" y="251" text-anchor="middle" style="font-size:12px">sin permisos</text>
<rect class="f-chip" x="22" y="270" width="84" height="26" rx="7"/>
<text class="f-s" x="64" y="287" text-anchor="middle" style="font-size:12px">Triton</text>
<line class="f-linea" x1="106" y1="283.0" x2="128" y2="283.0"/>
<rect class="f-chip" x="128" y="270" width="96" height="26" rx="7"/>
<text class="f-s" x="176" y="287" text-anchor="middle" style="font-size:12px">lee triton/*</text>
<rect class="f-chip" x="22" y="306" width="84" height="26" rx="7"/>
<text class="f-s" x="64" y="323" text-anchor="middle" style="font-size:12px">Fluent Bit</text>
<line class="f-linea" x1="106" y1="319.0" x2="128" y2="319.0"/>
<rect class="f-chip" x="128" y="306" width="96" height="26" rx="7"/>
<text class="f-s" x="176" y="323" text-anchor="middle" style="font-size:12px">escribe logs</text>
<rect class="f-off" x="246" y="234" width="92" height="26" rx="7"/>
<text class="f-s" x="292" y="251" text-anchor="middle" style="font-size:12px">artefactos</text>
<rect class="f-off" x="246" y="270" width="92" height="26" rx="7"/>
<text class="f-s" x="292" y="287" text-anchor="middle" style="font-size:12px">logs</text>
<rect class="f-off" x="246" y="306" width="92" height="26" rx="7"/>
<text class="f-s" x="292" y="323" text-anchor="middle" style="font-size:12px">etiquetado</text>
<line class="f-linea" x1="224" y1="283.0" x2="246" y2="247.0" stroke-dasharray="4 3"/>
<line class="f-linea" x1="224" y1="319.0" x2="246" y2="283.0" stroke-dasharray="4 3"/>
<text class="f-s" x="24" y="360" style="font-size:12px">El mismo ataque no alcanza ningún bucket:</text>
<text class="f-s" x="24" y="378" style="font-size:12px">el gateway no tiene permisos de S3.</text>
<rect class="f-o" x="24" y="388" width="12" height="12" rx="3"/><text class="f-s" x="42" y="398" style="font-size:12px">comprometido o alcanzado</text>
</svg>
