<rect class="f-b2" x="173.5" y="277.8" width="9" height="56.2" rx="2"/>
<rect class="f-b2" x="185.5" y="275.3" width="9" height="58.7" rx="2"/>
<rect class="f-b2" x="197.5" y="274.1" width="9" height="59.9" rx="2"/>
<rect class="f-b2" x="209.5" y="274.1" width="9" height="59.9" rx="2"/>
