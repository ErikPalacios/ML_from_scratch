<rect class="f-o" x="111" y="250" width="52" height="20" rx="10"/>
<text class="f-pill-t" x="137" y="264" text-anchor="middle" style="font:700 12px var(--sans)">main</text>
<rect class="f-dark" x="267" y="250" width="52" height="20" rx="10"/>
<text class="f-dark-t" x="293" y="264" text-anchor="middle" style="font:700 12px var(--sans)">logs</text>
<text class="f-s" x="26" y="296" style="font-size:12px">Los originales, sin rama que los nombre:</text>
<rect class="f-linea" x="104" y="306" width="66" height="26" rx="6" style="stroke-dasharray:4 3"/>
<text class="f-s" x="137" y="324" text-anchor="middle" style="font:600 12px var(--mono)">0750449</text>
<rect class="f-linea" x="182" y="306" width="66" height="26" rx="6" style="stroke-dasharray:4 3"/>
<text class="f-s" x="215" y="324" text-anchor="middle" style="font:600 12px var(--mono)">707221d</text>
<text class="f-s" x="26" y="356" style="font-size:12px">Mismos cambios y mensajes, ids nuevos:</text>
<text class="f-s" x="26" y="372" style="font-size:12px">cambió el padre de cada uno.</text>
