<circle class="f-p" cx="35" cy="318" r="11"/>
<text class="f-pill-t" x="35" y="323" text-anchor="middle" style="font:800 13px var(--sans)">2</text>
<text class="f-t" x="30" y="352" style="font-size:13px">Los dos van</text>
<text class="f-t" x="30" y="368" style="font-size:13px">al archivo.</text>
<rect class="f-chip" x="184" y="132" width="156" height="246" rx="12"/>
<text class="f-t" x="194" y="154" style="font:700 12px var(--mono)">2&gt;&amp;1 &gt; alreves.txt</text>
<text class="f-s" x="194" y="178" style="font-size:12px">Paso 1: <tspan style="font-family:var(--mono)">2&gt;&amp;1</tspan></text>
<rect class="f-card" x="267" y="188" width="70" height="24" rx="6"/>
<text class="f-s" x="302" y="204" text-anchor="middle" style="font-size:12px">pantalla</text>
<rect class="f-card" x="267" y="218" width="70" height="24" rx="6"/>
<text class="f-s" x="302" y="234" text-anchor="middle" style="font-size:12px">alreves.txt</text>
<path class="f-flecha" style="stroke:var(--b)" d="M210 200 H231 V195 H261"/>
<polygon style="fill:var(--b)" points="260,191 260,199 267,195"/>
<path class="f-flecha" style="stroke:var(--p)" d="M210 230 H245 V205 H261"/>
<polygon style="fill:var(--p)" points="260,201 260,209 267,205"/>
<circle class="f-b" cx="199" cy="200" r="11"/>
<text class="f-pill-t" x="199" y="205" text-anchor="middle" style="font:800 13px var(--sans)">1</text>
<circle class="f-p" cx="199" cy="230" r="11"/>
<text class="f-pill-t" x="199" y="235" text-anchor="middle" style="font:800 13px var(--sans)">2</text>
<text class="f-s" x="194" y="266" style="font-size:12px">Paso 2: <tspan style="font-family:var(--mono)">&gt; alreves.txt</tspan></text>
