<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" role="img" aria-labelledby="f-caso-financiera-almacenes-t" class="f-svg" style="max-width:420px">
<title id="f-caso-financiera-almacenes-t">Los tres lugares donde vive una llamada y qué pasa en cada uno con los datos de tarjeta. Uno, el audio, en el grabador de la central: la grabación se pausa mientras el cliente dicta la tarjeta, se guarda al menos 180 días y el cliente puede escucharla. Dos, la transcripción, que escribe faster-whisper: el número de tarjeta se cambia por PAN con sus últimos cuatro y el código por CVV antes de escribir nada a disco; se guarda 180 días y se le da al cliente si la pide. Tres, el resumen y las etiquetas en JSON, que escribe el LLM: no lleva números de tarjeta; se guarda 6 años si va con una reclamación y 180 días si no. El código de seguridad no se guarda en ninguno.</title>
<text class="f-l" x="14" y="24">TRES ALMACENES, TRES REGLAS</text>
<rect class="f-card" x="14" y="38" width="332" height="108" rx="14"/>
<circle class="f-acc" cx="38" cy="62" r="13"/><text class="f-acc-t" x="38" y="67" text-anchor="middle">1</text>
<text class="f-t" x="60" y="67">Audio · el grabador</text>
<text class="f-s" x="28" y="92" style="font-size:12.5px">Tarjeta: se pausa la grabación al dictarla</text>
<text class="f-s" x="28" y="112" style="font-size:12.5px">Se guarda: ≥ 180 días (CNBV)</text>
<text class="f-s" x="28" y="132" style="font-size:12.5px">El cliente puede escucharlo, no copiarlo</text>
<line class="f-flecha" x1="180" y1="148" x2="180" y2="170"/>
<polygon class="f-punta" points="174,166 180,176 186,166"/>
<text class="f-s" x="192" y="166" style="font-size:12px">faster-whisper</text>
<rect class="f-card" x="14" y="178" width="332" height="108" rx="14"/>
<circle class="f-acc" cx="38" cy="202" r="13"/><text class="f-acc-t" x="38" y="207" text-anchor="middle">2</text>
<text class="f-t" x="60" y="207">Transcripción</text>
<text class="f-s" x="28" y="232" style="font-size:12.5px">Tarjeta: [PAN ****1111] y [CVV] antes del disco</text>
<text class="f-s" x="28" y="252" style="font-size:12.5px">Se guarda: 180 días</text>
<text class="f-s" x="28" y="272" style="font-size:12.5px">Se le da al cliente si la pide</text>
<line class="f-flecha" x1="180" y1="288" x2="180" y2="310"/>
<polygon class="f-punta" points="174,306 180,316 186,306"/>
<text class="f-s" x="192" y="306" style="font-size:12px">Qwen3.8 27B</text>
<rect class="f-card" x="14" y="318" width="332" height="108" rx="14"/>
<circle class="f-acc" cx="38" cy="342" r="13"/><text class="f-acc-t" x="38" y="347" text-anchor="middle">3</text>
<text class="f-t" x="60" y="347">Resumen y etiquetas (JSON)</text>
<text class="f-s" x="28" y="372" style="font-size:12.5px">Tarjeta: no lleva números</text>
<text class="f-s" x="28" y="392" style="font-size:12.5px">Se guarda: 6 años con reclamación, o 180 días</text>
<text class="f-s" x="28" y="412" style="font-size:12.5px">Lo ven los supervisores en el tablero</text>
<rect class="f-chip" x="14" y="436" width="332" height="28" rx="8"/>
<text class="f-s" x="26" y="455" style="font-size:12.5px;font-weight:700">El CVV no se guarda en ninguno de los tres.</text>
</svg>
