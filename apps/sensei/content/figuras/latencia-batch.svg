<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 422" role="img" aria-labelledby="f-latencia-batch-t" class="f-svg" style="max-width:420px">
<title id="f-latencia-batch-t">Batch contra throughput y latencia en una T4, con números ilustrativos. Cada fila es un tamaño de batch, con una barra azul de fotos por segundo y una naranja de lo que tarda el batch en la GPU. Batch de 1: 250 fotos por segundo y 4 milisegundos. Batch de 4: unas 670 y 6 milisegundos. Batch de 8: unas 890 y 9 milisegundos. Batch de 16: unas 1,070 y 15 milisegundos. Batch de 32: unas 1,190 y 27 milisegundos. De 1 a 8, el throughput se multiplica por 3.6 con 5 milisegundos más; de 8 a 32 solo por 1.3, mientras el batch tarda el triple.</title>
<rect class="f-card" x="10" y="10" width="340" height="402" rx="16"/>
<text class="f-l" x="28" y="36">UNA T4 · NÚMEROS ILUSTRATIVOS</text>
<rect class="f-b" x="28" y="50" width="14" height="14" rx="3"/>
<text class="f-s" x="48" y="62" style="font-size:12px">fotos por segundo, como máximo</text>
<rect class="f-o" x="28" y="70" width="14" height="14" rx="3"/>
<text class="f-s" x="48" y="82" style="font-size:12px">lo que tarda cada batch en la GPU</text>
<text class="f-l" x="48" y="106" text-anchor="middle">BATCH</text>

<text class="f-t" x="48" y="139" text-anchor="middle" style="font-size:16px">1</text>
<rect class="f-b" x="80" y="118" width="37.5" height="14" rx="3"/>
<text class="f-s" x="123.5" y="130" style="font-size:12px">250/s</text>
<rect class="f-o" x="80" y="136" width="24" height="14" rx="3"/>
<text class="f-s" x="110" y="148" style="font-size:12px">4 ms</text>

<text class="f-t" x="48" y="185" text-anchor="middle" style="font-size:16px">4</text>
<rect class="f-b" x="80" y="164" width="100" height="14" rx="3"/>
<text class="f-s" x="186" y="176" style="font-size:12px">≈ 670/s</text>
<rect class="f-o" x="80" y="182" width="36" height="14" rx="3"/>
<text class="f-s" x="122" y="194" style="font-size:12px">6 ms</text>

<text class="f-t" x="48" y="231" text-anchor="middle" style="font-size:16px">8</text>
<rect class="f-b" x="80" y="210" width="133.3" height="14" rx="3"/>
<text class="f-s" x="219.3" y="222" style="font-size:12px">≈ 890/s</text>
<rect class="f-o" x="80" y="228" width="54" height="14" rx="3"/>
<text class="f-s" x="140" y="240" style="font-size:12px">9 ms</text>

<text class="f-t" x="48" y="277" text-anchor="middle" style="font-size:16px">16</text>
<rect class="f-b" x="80" y="256" width="160" height="14" rx="3"/>
<text class="f-s" x="246" y="268" style="font-size:12px">≈ 1,070/s</text>
<rect class="f-o" x="80" y="274" width="90" height="14" rx="3"/>
<text class="f-s" x="176" y="286" style="font-size:12px">15 ms</text>

<text class="f-t" x="48" y="323" text-anchor="middle" style="font-size:16px">32</text>
<rect class="f-b" x="80" y="302" width="177.8" height="14" rx="3"/>
<text class="f-s" x="263.8" y="314" style="font-size:12px">≈ 1,190/s</text>
<rect class="f-o" x="80" y="320" width="162" height="14" rx="3"/>
<text class="f-s" x="248" y="332" style="font-size:12px">27 ms</text>

<rect class="f-chip" x="24" y="348" width="312" height="54" rx="10"/>
<text class="f-t" x="38" y="369" style="font-size:13px">De 1 a 8: × 3.6 fotos/s, por 5 ms más.</text>
<text class="f-s" x="38" y="388" style="font-size:12px">De 8 a 32: solo × 1.3, y el batch tarda el triple.</text>
</svg>
