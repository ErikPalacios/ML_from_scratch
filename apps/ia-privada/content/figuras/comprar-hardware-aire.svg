<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 446" role="img" aria-labelledby="f-comprar-hardware-aire-t" class="f-svg" style="max-width:420px">
<title id="f-comprar-hardware-aire-t">Dos formas de enfriar una GPU. Arriba, una torre de oficina con dos tarjetas activas: cada tarjeta trae sus propios ventiladores, que jalan aire del gabinete y lo sacan; funciona en cualquier torre con algo de ventilación. Abajo, un servidor de rack visto desde arriba con tres tarjetas pasivas, que solo tienen aletas: una fila de ventiladores del chasis, en el frente, empuja el aire de adelante hacia atrás a través de todas las aletas y lo saca por la parte de atrás. Una tarjeta pasiva en una torre, sin esa corriente, se sobrecalienta.</title>
<rect class="f-card" x="10" y="10" width="340" height="190" rx="16"/>
<text class="f-l" x="26" y="34">TORRE · TARJETAS ACTIVAS</text>
<rect class="f-chip" x="26" y="48" width="120" height="140" rx="8"/>
<rect class="f-g" x="38" y="84" width="96" height="26" rx="4"/>
