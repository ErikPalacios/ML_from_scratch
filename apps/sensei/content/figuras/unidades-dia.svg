<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 450" role="img" aria-labelledby="f-unidades-dia-t" class="f-svg" style="max-width:420px">
<title id="f-unidades-dia-t">Una gráfica de barras con las 24 horas de un día de C01, con un perfil ilustrativo: cuántas fotos por segundo llegan en cada hora. De madrugada llegan menos de 20 por segundo; a mediodía, unas 130; a las 20 horas, la hora pico, unas 347. Tres líneas horizontales: el promedio del día, unas 116 por segundo; el pico, unas 350, tres veces el promedio; y el pico de diseño, 500, con margen. Las 24 barras suman los 10 millones de fotos del día, y la hora pico lleva 1 de cada 8: 1.25 millones de fotos entre 3,600 segundos, unas 347 por segundo.</title>
<rect class="f-card" x="10" y="10" width="340" height="430" rx="16"/>
<text class="f-l" x="28" y="36">UN DÍA DE C01, HORA POR HORA</text>
<text class="f-s" x="28" y="56" style="font-size:12px">fotos por segundo en cada hora · perfil ilustrativo</text>
<line class="f-linea" x1="52" y1="334" x2="340" y2="334" style="opacity:.25"/>
<text class="f-l" x="46" y="338" text-anchor="end">0</text>
<line class="f-linea" x1="52" y1="290" x2="340" y2="290" style="opacity:.25"/>
<text class="f-l" x="46" y="294" text-anchor="end">100</text>
<line class="f-linea" x1="52" y1="246" x2="340" y2="246" style="opacity:.25"/>
<text class="f-l" x="46" y="250" text-anchor="end">200</text>
<line class="f-linea" x1="52" y1="202" x2="340" y2="202" style="opacity:.25"/>
<text class="f-l" x="46" y="206" text-anchor="end">300</text>
<line class="f-linea" x1="52" y1="158" x2="340" y2="158" style="opacity:.25"/>
<text class="f-l" x="46" y="162" text-anchor="end">400</text>
<line class="f-linea" x1="52" y1="114" x2="340" y2="114" style="opacity:.25"/>
<text class="f-l" x="46" y="118" text-anchor="end">500</text>
<rect class="f-b2" x="53.5" y="309.6" width="9" height="24.4" rx="2"/>
<rect class="f-b2" x="65.5" y="319.3" width="9" height="14.7" rx="2"/>
