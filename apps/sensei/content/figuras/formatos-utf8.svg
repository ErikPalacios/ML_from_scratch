<rect class="f-chip" x="153" y="98" width="28" height="30" rx="5"/>
<text class="f-t" x="167" y="118" text-anchor="middle" style="font:700 12px var(--mono)">6F</text>
<rect class="f-chip" x="187" y="98" width="28" height="30" rx="5"/>
<text class="f-t" x="201" y="118" text-anchor="middle" style="font:700 12px var(--mono)">20</text>
<rect class="f-p" x="221" y="98" width="28" height="30" rx="5"/>
<text class="f-pill-t" x="235" y="118" text-anchor="middle" style="font:800 12px var(--mono)">F0</text>
