<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 356" role="img" aria-labelledby="f-evals-citas-t" class="f-svg" style="max-width:420px">
<title id="f-evals-citas-t">Probabilidad de que un sistema pase el criterio de a lo más 4 citas inventadas en 200 preguntas, según su tasa verdadera de citas inventadas. Con 1 por ciento pasa 94.8 por ciento de las veces; con 1.5 por ciento, 81.7; con 2 por ciento, 62.9; con 3 por ciento, 28.1; con 4 por ciento, 9.5; con 5 por ciento, 2.6. Un sistema que inventa 3 por ciento de las citas, por encima del tope, pasa más de una vez de cada cuatro.</title>
<rect class="f-card" x="10" y="10" width="340" height="336" rx="16"/>
<text class="f-l" x="28" y="38">¿PASA «≤ 4 DE 200»? · POR AZAR</text>
<text class="f-s" x="28" y="58" style="font-size:12px">probabilidad de pasar, según la tasa verdadera</text>
<line x1="50" y1="264" x2="347" y2="264" class="f-linea" style="stroke-width:1.5"/>
<rect class="f-g" x="58" y="83.9" width="36" height="180.1" rx="3"/>
<text class="f-s" x="76.0" y="77.9" text-anchor="middle" style="font-size:12px">94.8 %</text>
<text class="f-s" x="76.0" y="282" text-anchor="middle" style="font-size:12px">1 %</text>
<rect class="f-g" x="107" y="108.8" width="36" height="155.2" rx="3"/>
<text class="f-s" x="125.0" y="102.8" text-anchor="middle" style="font-size:12px">81.7 %</text>
<text class="f-s" x="125.0" y="282" text-anchor="middle" style="font-size:12px">1.5 %</text>
<rect class="f-g" x="156" y="144.5" width="36" height="119.5" rx="3"/>
<text class="f-s" x="174.0" y="138.5" text-anchor="middle" style="font-size:12px">62.9 %</text>
<text class="f-s" x="174.0" y="282" text-anchor="middle" style="font-size:12px">2 %</text>
<rect class="f-o" x="205" y="210.6" width="36" height="53.4" rx="3"/>
<text class="f-s" x="223.0" y="204.6" text-anchor="middle" style="font-size:12px">28.1 %</text>
<text class="f-s" x="223.0" y="282" text-anchor="middle" style="font-size:12px">3 %</text>
<rect class="f-o" x="254" y="245.9" width="36" height="18.1" rx="3"/>
<text class="f-s" x="272.0" y="239.9" text-anchor="middle" style="font-size:12px">9.5 %</text>
<text class="f-s" x="272.0" y="282" text-anchor="middle" style="font-size:12px">4 %</text>
<rect class="f-o" x="303" y="259.1" width="36" height="4.9" rx="3"/>
<text class="f-s" x="321.0" y="253.1" text-anchor="middle" style="font-size:12px">2.6 %</text>
<text class="f-s" x="321.0" y="282" text-anchor="middle" style="font-size:12px">5 %</text>
<text class="f-s" x="180" y="304" text-anchor="middle" style="font-size:12px">tasa verdadera de citas inventadas</text>
<rect class="f-g" x="40" y="320" width="12" height="12" rx="2"/><text class="f-s" x="58" y="331" style="font-size:12px">hasta el tope (2 %)</text>
<rect class="f-o" x="196" y="320" width="12" height="12" rx="2"/><text class="f-s" x="214" y="331" style="font-size:12px">sobre el tope</text>
</svg>
