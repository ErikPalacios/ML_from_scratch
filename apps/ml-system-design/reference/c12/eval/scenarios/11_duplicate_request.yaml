# La app reenvía el mismo POST (mismo message_id) porque no vio la respuesta: se reenvían los eventos ya
# mandados y NO se corre nada otra vez. Un reembolso, tres llamadas al modelo.
id: duplicate_request
customer_id: cust-1
orders:
  - order_id: A-1029
    customer_id: cust-1
    status: delivered
    currency: MXN
    items: [{item_id: I-1, title: Audífonos inalámbricos, price: "450.00"}]
    delivered_days_ago: 3
    shipment: {status: delivered, expected_in_days: -4}
model:
  - tool_calls: [{name: get_order, arguments: {order_id: A-1029}}]
  - tool_calls: [{name: issue_refund, arguments: {order_id: A-1029, amount: 450.0, currency: MXN, reason: damaged}}]
  - content: "Listo: emitimos tu reembolso de 450 MXN."
turns:
  - customer: "A-1029 llegó roto"
  - customer: "Confirmo"
    confirm: true
    message_id: m-confirm
  - customer: "Confirmo"
    confirm: true
    duplicate_of: m-confirm
expect:
  outcome: answered
  state:
    refunds: [{order_id: A-1029, amount: "450.00"}]
  max_llm_calls: 3
