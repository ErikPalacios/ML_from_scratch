<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 536" role="img" aria-labelledby="f-python-ecosistema-rueda-t" class="f-svg" style="max-width:420px">
<title id="f-python-ecosistema-rueda-t">Las cinco partes del nombre de la wheel numpy-2.5.3-cp313-cp313-manylinux_2_28_x86_64.whl, separadas por guiones. Primera, numpy: el nombre del paquete. Segunda, 2.5.3: la versión. Las tres últimas son la etiqueta, que dice dónde sirve: cp313, el Python con que se compiló, CPython 3.13; cp313 otra vez, la interfaz binaria, la de CPython 3.13; y manylinux_2_28_x86_64, el sistema y el chip: Linux con glibc 2.28 o más nueva, en un chip x86_64. Abajo, una wheel de puro Python, fastapi-0.141.1-py3-none-any.whl: py3 quiere decir cualquier Python 3, none que no depende de ninguna interfaz binaria de Python (aquí, porque no trae código compilado), y any que sirve en cualquier sistema y cualquier chip.</title>
<rect class="f-card" x="10" y="10" width="340" height="516" rx="16"/>
<text class="f-l" x="26" y="36" style="font-size:12px">EL NOMBRE DE UNA WHEEL</text>
<text class="f-s" x="26" y="60" style="font:700 13px var(--mono)">numpy-2.5.3-cp313-cp313-</text>
<text class="f-s" x="26" y="78" style="font:700 13px var(--mono)">manylinux_2_28_x86_64.whl</text>
<text class="f-s" x="26" y="100" style="font-size:12px">Cinco partes, separadas por guiones:</text>
<rect class="f-off" x="26" y="112" width="92" height="26" rx="6"/>
<text class="f-t" x="72" y="130" text-anchor="middle" style="font:700 13px var(--mono)">numpy</text>
<text class="f-s" x="130" y="130" style="font-size:12px">el nombre del paquete</text>
<rect class="f-off" x="26" y="146" width="92" height="26" rx="6"/>
<text class="f-t" x="72" y="164" text-anchor="middle" style="font:700 13px var(--mono)">2.5.3</text>
<text class="f-s" x="130" y="164" style="font-size:12px">la versión</text>
<rect class="f-chip" x="20" y="184" width="320" height="156" rx="12"/>
<text class="f-l" x="32" y="204" style="font-size:12px">LA ETIQUETA: DÓNDE SIRVE</text>
<rect class="f-b" x="32" y="214" width="86" height="26" rx="6"/>
<text class="f-pill-t" x="75" y="232" text-anchor="middle" style="font:700 13px var(--mono)">cp313</text>
<text class="f-s" x="130" y="232" style="font-size:12px">Python: CPython 3.13</text>
<rect class="f-b" x="32" y="248" width="86" height="26" rx="6"/>
<text class="f-pill-t" x="75" y="266" text-anchor="middle" style="font:700 13px var(--mono)">cp313</text>
<text class="f-s" x="130" y="266" style="font-size:12px">interfaz binaria: la de 3.13</text>
<rect class="f-b" x="32" y="282" width="190" height="26" rx="6"/>
<text class="f-pill-t" x="127" y="300" text-anchor="middle" style="font:700 13px var(--mono)">manylinux_2_28_x86_64</text>
<text class="f-s" x="232" y="300" style="font-size:12px">sistema y chip</text>
<text class="f-s" x="32" y="327" style="font-size:12px">Linux con glibc 2.28 o más nueva, chip x86_64</text>
<text class="f-l" x="26" y="370" style="font-size:12px">PURO PYTHON</text>
<text class="f-s" x="26" y="390" style="font:700 12px var(--mono)">fastapi-0.141.1-py3-none-any.whl</text>
<rect class="f-g" x="26" y="402" width="52" height="24" rx="6"/>
<text class="f-pill-t" x="52" y="419" text-anchor="middle" style="font:700 13px var(--mono)">py3</text>
<text class="f-s" x="90" y="419" style="font-size:12px">cualquier Python 3</text>
<rect class="f-g" x="26" y="432" width="52" height="24" rx="6"/>
<text class="f-pill-t" x="52" y="449" text-anchor="middle" style="font:700 13px var(--mono)">none</text>
<text class="f-s" x="90" y="449" style="font-size:12px">no depende de ninguna interfaz binaria</text>
<rect class="f-g" x="26" y="462" width="52" height="24" rx="6"/>
<text class="f-pill-t" x="52" y="479" text-anchor="middle" style="font:700 13px var(--mono)">any</text>
<text class="f-s" x="90" y="479" style="font-size:12px">cualquier sistema y chip</text>
<text class="f-t" x="26" y="510" style="font-size:13px">Sirve en todos lados.</text>
</svg>
