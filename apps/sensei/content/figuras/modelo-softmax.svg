<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 544" role="img" aria-labelledby="f-modelo-softmax-t" class="f-svg" style="max-width:420px">
<title id="f-modelo-softmax-t">Softmax paso a paso con tres logits: Tenis 3.0, Botas 1.0 y Sandalias 0.0. Paso 2, la exponencial: e³ = 20.09, e¹ = 2.72 y e⁰ = 1.00, que suman 23.81. Paso 3, dividir cada uno entre la suma: 84.4 %, 11.4 % y 4.2 %, que suman 100 % y conservan el orden.</title>
<rect class="f-card" x="10" y="10" width="340" height="128" rx="16"/>
<text class="f-l" x="28" y="36">1 · EL MODELO DA LOGITS</text>
<text class="f-s" x="28" y="66">Tenis</text><text class="f-t" x="104" y="66">3.0</text><rect class="f-o" x="196" y="55" width="120" height="12" rx="6"/>
<text class="f-s" x="28" y="92">Botas</text><text class="f-t" x="104" y="92">1.0</text><rect class="f-o" x="196" y="81" width="40" height="12" rx="6"/>
<text class="f-s" x="28" y="118">Sandalias</text><text class="f-t" x="104" y="118">0.0</text><line class="f-flecha" x1="197" y1="106" x2="197" y2="120"/>
<line class="f-flecha" x1="180" y1="144" x2="180" y2="168"/><path class="f-punta" d="M172,166 L188,166 L180,176 Z"/><text class="f-s" x="198" y="165">e elevado a cada uno</text>
<rect class="f-card" x="10" y="186" width="340" height="150" rx="16"/>
<text class="f-l" x="28" y="212">2 · EXPONENCIAL: TODO QUEDA POSITIVO</text>
<text class="f-s" x="28" y="240">Tenis</text><text class="f-t" x="104" y="240">e³ = 20.09</text><rect class="f-y" x="196" y="229" width="140" height="12" rx="6"/>
<text class="f-s" x="28" y="266">Botas</text><text class="f-t" x="104" y="266">e¹ = 2.72</text><rect class="f-y" x="196" y="255" width="18.9" height="12" rx="6"/>
<text class="f-s" x="28" y="292">Sandalias</text><text class="f-t" x="104" y="292">e⁰ = 1.00</text><rect class="f-y" x="196" y="281" width="7" height="12" rx="6"/>
<line class="f-flecha" x1="28" y1="305" x2="334" y2="305" style="stroke-width:1"/>
<text class="f-s" x="28" y="326">Suma</text><text class="f-t" x="104" y="326">23.81</text>
<line class="f-flecha" x1="180" y1="342" x2="180" y2="366"/><path class="f-punta" d="M172,364 L188,364 L180,374 Z"/><text class="f-s" x="198" y="363">÷ 23.81 a cada uno</text>
<rect class="f-card" x="10" y="384" width="340" height="150" rx="16"/>
<text class="f-l" x="28" y="410">3 · PROBABILIDADES</text>
<text class="f-s" x="28" y="440">Tenis</text><text class="f-t" x="104" y="440">84.4 %</text><rect class="f-off" x="196" y="429" width="140" height="12" rx="6"/><rect class="f-b" x="196" y="429" width="118.1" height="12" rx="6"/>
<text class="f-s" x="28" y="466">Botas</text><text class="f-t" x="104" y="466">11.4 %</text><rect class="f-off" x="196" y="455" width="140" height="12" rx="6"/><rect class="f-b" x="196" y="455" width="16" height="12" rx="6"/>
<text class="f-s" x="28" y="492">Sandalias</text><text class="f-t" x="104" y="492">4.2 %</text><rect class="f-off" x="196" y="481" width="140" height="12" rx="6"/><rect class="f-b" x="196" y="481" width="5.9" height="12" rx="6"/>
<text class="f-s" x="28" y="520">Suman 100 % y el orden no cambia.</text>
</svg>
