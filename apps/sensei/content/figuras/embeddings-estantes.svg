<text class="f-s" x="42" y="197" style="font-size:12px">vecino verdadero,</text>
<text class="f-s" x="42" y="213" style="font-size:12px">en otro estante: se pierde</text>
<rect class="f-card" x="10" y="324" width="340" height="128" rx="16"/>
<path class="f-acc" d="M34.0,341.0 L36.2,346.9 L42.6,347.2 L37.6,351.2 L39.3,357.3 L34.0,353.8 L28.7,357.3 L30.4,351.2 L25.4,347.2 L31.8,346.9 Z"/><text class="f-s" x="52" y="355">la búsqueda: cae en el estante B</text>
<circle class="f-b" cx="34" cy="376" r="6"/><text class="f-s" x="52" y="381">se revisa solo el B: ¼ del trabajo</text>
<circle cx="34" cy="402" r="8" style="fill:none;stroke:var(--b);stroke-width:2.5"/><text class="f-s" x="52" y="407">encontró 2 de los 3 más cercanos</text>
<text class="f-t" x="28" y="438">recall@3 = 2 ÷ 3 ≈ 0.67</text>
