<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" role="img" aria-labelledby="f-e12-monitoreo-capas-t" class="f-svg" style="max-width:420px">
<title id="f-e12-monitoreo-capas-t">Las cinco capas del monitoreo de Alba, de arriba abajo. Infraestructura: nodos, GPU y pods listos; avisa en segundos. Servicio: p99, errores 5xx y fila de Triton; segundos a minutos. Datos: bytes de las fotos por source y tasas de 400, 413 y 415; minutos. Modelo: score top-1, tasa de baja confianza y PSI de las categorías; minutos a un día. Negocio: aceptación, recategorización de moderación y holdout; horas a semanas. Las dos de arriba son de cualquier servicio y las tres de abajo son de ML. Una flecha a la izquierda dice que hacia abajo la señal es más lenta y más cercana a lo que importa: si la sugerencia fue correcta.</title>
<text class="f-l" x="18" y="24">MÁS RÁPIDA</text>
<text class="f-l" x="18" y="432">MÁS CERCA DE LO QUE IMPORTA</text>
