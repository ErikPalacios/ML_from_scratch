<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" role="img" aria-labelledby="f-colas-log-t" class="f-svg" style="max-width:420px">
<title id="f-colas-log-t">Un tópico es un registro que solo crece. Once casillas en fila, con sus offsets del 0 al 10, del más viejo a la izquierda al más nuevo a la derecha. El productor agrega cada evento nuevo al final: el último es el offset 10. Los offsets 0 y 1 ya pasaron la retención y se borraron. Arriba, una marca en el offset 7: el indexador va ahí. Abajo, una marca en el offset 4: el sink al lake, más lento, va ahí. Leer no borra nada; cada lector lleva su propio marcador y, si se cae, sigue desde el último offset que confirmó.</title>
<rect class="f-card" x="10" y="10" width="340" height="280" rx="16"/>
<text class="f-l" x="28" y="36">UN TÓPICO: UN REGISTRO QUE SOLO CRECE</text>
<text class="f-s" x="28" y="60" style="font-size:12px">← más viejo</text>
<text class="f-s" x="325" y="60" text-anchor="end" style="font-size:12px">el productor agrega al final</text>
<line class="f-flecha" x1="311.5" y1="66" x2="311.5" y2="90"/>
<polygon class="f-punta" points="306,88 317,88 311.5,97"/>

<text class="f-t" x="230.5" y="80" text-anchor="middle" style="font-size:12px">indexador: offset 7</text>
<polygon class="f-ink" points="224,86 237,86 230.5,96"/>

<rect class="f-off" x="28" y="100" width="25" height="34" rx="4" style="opacity:.55"/>
<text class="f-s" x="40.5" y="122" text-anchor="middle" style="font-size:13px">0</text>
<rect class="f-off" x="55" y="100" width="25" height="34" rx="4" style="opacity:.55"/>
<text class="f-s" x="67.5" y="122" text-anchor="middle" style="font-size:13px">1</text>
<rect class="f-chip" x="82" y="100" width="25" height="34" rx="4"/>
<text class="f-t" x="94.5" y="122" text-anchor="middle" style="font-size:13px">2</text>
<rect class="f-chip" x="109" y="100" width="25" height="34" rx="4"/>
<text class="f-t" x="121.5" y="122" text-anchor="middle" style="font-size:13px">3</text>
<rect class="f-chip" x="136" y="100" width="25" height="34" rx="4"/>
<text class="f-t" x="148.5" y="122" text-anchor="middle" style="font-size:13px">4</text>
<rect class="f-chip" x="163" y="100" width="25" height="34" rx="4"/>
<text class="f-t" x="175.5" y="122" text-anchor="middle" style="font-size:13px">5</text>
<rect class="f-chip" x="190" y="100" width="25" height="34" rx="4"/>
<text class="f-t" x="202.5" y="122" text-anchor="middle" style="font-size:13px">6</text>
<rect class="f-chip" x="217" y="100" width="25" height="34" rx="4"/>
<text class="f-t" x="229.5" y="122" text-anchor="middle" style="font-size:13px">7</text>
<rect class="f-chip" x="244" y="100" width="25" height="34" rx="4"/>
<text class="f-t" x="256.5" y="122" text-anchor="middle" style="font-size:13px">8</text>
<rect class="f-chip" x="271" y="100" width="25" height="34" rx="4"/>
<text class="f-t" x="283.5" y="122" text-anchor="middle" style="font-size:13px">9</text>
<rect class="f-b" x="298" y="100" width="27" height="34" rx="4"/>
<text x="311.5" y="122" text-anchor="middle" class="f-pill-t" style="font-size:13px">10</text>

<polygon class="f-ink" points="148.5,138 142,148 155,148"/>
<text class="f-t" x="148.5" y="166" text-anchor="middle" style="font-size:12px">sink al lake: offset 4</text>
<text class="f-s" x="28" y="190" style="font-size:12px">0 y 1: pasaron la retención y se borraron,</text>
<text class="f-s" x="28" y="205" style="font-size:12px">aunque alguien no los hubiera leído.</text>

<rect class="f-chip" x="24" y="222" width="312" height="54" rx="10"/>
<text class="f-t" x="36" y="243" style="font-size:13px">Leer no borra nada.</text>
<text class="f-s" x="36" y="262" style="font-size:12px">Cada lector guarda su offset con un commit.</text>
</svg>
