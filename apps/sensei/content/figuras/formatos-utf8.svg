<text class="f-pill-t" x="325" y="118" text-anchor="middle" style="font:800 12px var(--mono)">9F</text>

<text class="f-s" x="35" y="146" text-anchor="middle" style="font-size:12px">1</text>
<text class="f-s" x="69" y="146" text-anchor="middle" style="font-size:12px">1</text>
<text class="f-s" x="118" y="146" text-anchor="middle" style="font-size:12px;font-weight:700">2 bytes</text>
