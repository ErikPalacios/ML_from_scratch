<title id="f-percentiles-buckets-t">Una ventana de 5 minutos con 10,000 requests en 7 buckets. Conteo y acumulado: hasta 50 ms, 6,200 y 6,200; de 50 a 100, 3,100 y 9,300; de 100 a 150, 520 y 9,820; de 150 a 200, 110 y 9,930; de 200 a 300, 50 y 9,980; de 300 a 500, 15 y 9,995; más de 500, 5 y 10,000. El p99 es la request 9,900, que cae en el bucket de 150 a 200 ms, el primero cuyo acumulado llega a 9,900. Abajo, ese bucket ampliado: sus 110 requests dibujadas parejo entre 150 y 200 ms; la 9,900 es la número 80 de esas 110, así que el p99 estimado es 150 más 50 por 80 entre 110, unos 186 milisegundos.</title>
