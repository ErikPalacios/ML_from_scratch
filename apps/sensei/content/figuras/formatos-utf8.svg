<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 384" role="img" aria-labelledby="f-formatos-utf8-t" class="f-svg" style="max-width:420px">
<title id="f-formatos-utf8-t">El texto «Niño» seguido de un espacio y el emoji de un tenis, en UTF-8. Son seis caracteres y diez bytes. N es 4E, i es 69, o es 6F y el espacio es 20: un byte cada uno, como en ASCII. La ñ ocupa dos bytes, C3 y B1. El tenis ocupa cuatro: F0, 9F, 91 y 9F. Abajo, los primeros cinco bytes leídos como Latin-1, que toma cada byte como una letra: 4E es N, 69 es i, C3 es Ã, B1 es ± y 6F es o. Niño se vuelve NiÃ±o.</title>
<rect class="f-card" x="10" y="10" width="340" height="364" rx="16"/>
<text class="f-l" x="21" y="36">«NIÑO 👟»: 6 CARACTERES, 10 BYTES</text>

<rect class="f-chip" x="21" y="50" width="28" height="30" rx="6"/>
<text class="f-t" x="35" y="71" text-anchor="middle" style="font-size:15px">N</text>
<rect class="f-chip" x="55" y="50" width="28" height="30" rx="6"/>
<text class="f-t" x="69" y="71" text-anchor="middle" style="font-size:15px">i</text>
<rect class="f-o" x="89" y="50" width="58" height="30" rx="6"/>
<text class="f-pill-t" x="118" y="71" text-anchor="middle">ñ</text>
<rect class="f-chip" x="153" y="50" width="28" height="30" rx="6"/>
<text class="f-t" x="167" y="71" text-anchor="middle" style="font-size:15px">o</text>
<rect class="f-chip" x="187" y="50" width="28" height="30" rx="6"/>
<text class="f-s" x="201" y="70" text-anchor="middle" style="font-size:12px">esp.</text>
<rect class="f-p" x="221" y="50" width="118" height="30" rx="6"/>
<text x="280" y="71" text-anchor="middle" style="font-size:16px">👟</text>

<path class="f-flecha" d="M35 84v10M69 84v10M118 84v10M167 84v10M201 84v10M280 84v10"/>

<rect class="f-chip" x="21" y="98" width="28" height="30" rx="5"/>
<text class="f-t" x="35" y="118" text-anchor="middle" style="font:700 12px var(--mono)">4E</text>
