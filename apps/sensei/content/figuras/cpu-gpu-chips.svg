<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 660" role="img" aria-labelledby="f-cpu-gpu-chips-t" class="f-svg" style="max-width:420px">
<title id="f-cpu-gpu-chips-t">Qué hay dentro de cada chip. Arriba, una CPU de ejemplo con 8 núcleos grandes, cada uno con su propia caché y 32 carriles FP32, 256 en total, y una caché compartida, la L3; la RAM va afuera del chip. Abajo, la GPU T4: 40 SMs en una cuadrícula de 8 por 5, una caché L2 de 4 MB para todos y la VRAM afuera del chip, 16 GB a 320 GB/s. Al final, un SM de cerca: 64 carriles FP32, que son los llamados CUDA cores, 8 tensor cores, y hasta 1,024 hilos vivos en 32 warps de 32. 40 SMs por 64 carriles dan los 2,560 CUDA cores de la T4: diez veces los 256 carriles de la CPU.</title>
<rect class="f-card" x="10" y="10" width="340" height="640" rx="16"/>

