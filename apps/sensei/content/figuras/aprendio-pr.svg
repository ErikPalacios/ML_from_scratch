<title id="f-aprendio-pr-t">El mismo detector de fraude, con 0.08 % de fraude, en dos gráficas. Arriba, la curva ROC: sube pegada al borde izquierdo y su área (AUC) es de 0.98. El punto marcado atrapa 70 % del fraude marcando solo 1 % de las compras buenas, y parece casi perfecto. Abajo, la curva PR del mismo modelo: la precision cae rápido, y en el mismo punto, con 70 % del fraude atrapado, la precision es de 5 %. Su área (AP) es de 0.29. Un modelo al azar tendría precision de 0.08 %.</title>
