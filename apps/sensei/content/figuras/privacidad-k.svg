<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 520" role="img" aria-labelledby="f-privacidad-k-t" class="f-svg" style="max-width:420px">
<title id="f-privacidad-k-t">La misma tabla de 8 personas, dos veces. Arriba, con los datos exactos: código postal, edad y sexo. Cada fila tiene una combinación distinta, así que cada persona está sola en su grupo: k es igual a 1. Abajo, generalizada: el código postal a sus primeros 3 dígitos, la edad por década y sin sexo. Quedan tres grupos: 067** con edad de 20 a 29, con 3 personas que tienen asma, diabetes y asma; 067** con edad de 30 a 39, con 3 personas que tienen gripa, asma y gripa; y 031** con edad de 50 a 59, con 2 personas que tienen diabetes y gripa. El grupo más chico tiene 2 filas: k es igual a 2.</title>
<rect class="f-card" x="10" y="10" width="340" height="236" rx="16"/>
<text class="f-l" x="24" y="34">EXACTO · CADA FILA ESTÁ SOLA</text>
<text class="f-l" x="30" y="56">C.P.</text><text class="f-l" x="100" y="56">EDAD</text><text class="f-l" x="152" y="56">SEXO</text><text class="f-l" x="210" y="56">PADECIMIENTO</text>
<g class="f-s">
<text x="30" y="78">06700</text><text x="100" y="78">23</text><text x="152" y="78">M</text><text x="210" y="78">asma</text>
<text x="30" y="98">06700</text><text x="100" y="98">27</text><text x="152" y="98">M</text><text x="210" y="98">diabetes</text>
<text x="30" y="118">06700</text><text x="100" y="118">24</text><text x="152" y="118">H</text><text x="210" y="118">asma</text>
<text x="30" y="138">06720</text><text x="100" y="138">31</text><text x="152" y="138">H</text><text x="210" y="138">gripa</text>
<text x="30" y="158">06720</text><text x="100" y="158">38</text><text x="152" y="158">H</text><text x="210" y="158">asma</text>
<text x="30" y="178">06720</text><text x="100" y="178">35</text><text x="152" y="178">M</text><text x="210" y="178">gripa</text>
<text x="30" y="198">03100</text><text x="100" y="198">52</text><text x="152" y="198">M</text><text x="210" y="198">diabetes</text>
<text x="30" y="218">03100</text><text x="100" y="218">57</text><text x="152" y="218">M</text><text x="210" y="218">gripa</text>
</g>
<g class="f-o"><circle cx="20" cy="74" r="3"/><circle cx="20" cy="94" r="3"/><circle cx="20" cy="114" r="3"/><circle cx="20" cy="134" r="3"/><circle cx="20" cy="154" r="3"/><circle cx="20" cy="174" r="3"/><circle cx="20" cy="194" r="3"/><circle cx="20" cy="214" r="3"/></g>
<rect class="f-chip" x="292" y="128" width="50" height="30" rx="8"/>
<text class="f-t" x="317" y="148" text-anchor="middle">k = 1</text>
<path class="f-flecha" d="M180 252 L180 266"/><path class="f-punta" d="M175 266 L180 274 L185 266 Z"/>
<text class="f-s" x="192" y="266" style="font-size:12px">generalizar</text>
<rect class="f-card" x="10" y="280" width="340" height="230" rx="16"/>
<text class="f-l" x="24" y="304">GENERALIZADO · 3 DÍGITOS, DÉCADA, SIN SEXO</text>
<rect class="f-chip" x="20" y="316" width="230" height="56" rx="10"/>
<rect class="f-b" x="20" y="316" width="6" height="56" rx="3"/>
