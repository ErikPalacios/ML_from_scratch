# Tests unitarios de alerts.yml con promtool: series sintéticas → ¿dispara o no, y cuándo?
#   promtool test rules alerts_test.yml
# Los "sí dispara" consultan ALERTS{alertstate="firing"} con promql_expr_test (así no hay que copiar las
# anotaciones); los "no dispara" usan alert_rule_test con exp_alerts: []. CaptionPartialLatencyHigh y la
# rama sin métricas de ASRCapacityHeadroomLow prueban además el texto renderizado. Notación de promtool: '0+100x20' = empieza en 0 y suma 100 por intervalo, 20 veces
# (21 valores). Segmentos separados por espacio continúan la serie: '0+100x20 2090+90x39'.
# Los momentos de cada test dejan ≥ 2 min de margen: rate() extrapola en los bordes de la ventana.
rule_files:
  - alerts.yml
evaluation_interval: 1m

tests:
  # ---------------------------------------------------------------- CaptionPartialLatencyHigh
  # 1,000 partials/min en es-419. Hasta el minuto 20, todos ≤ 150 ms; después el 10 % tarda entre 200 y
  # 250 ms → p95 = 0.2 + 0.05 × (950 − 900) / 100 = 0.225 → la condición se cumple desde el ≈ 23 y la
  # alerta pasa a firing en el ≈ 33.
  - interval: 1m
    input_series:
      - series: 'asr_partial_latency_seconds_bucket{language="es-419",le="0.15"}'
        values: '0+1000x20 20900+900x39'
      - series: 'asr_partial_latency_seconds_bucket{language="es-419",le="0.2"}'
        values: '0+1000x20 20900+900x39'
      - series: 'asr_partial_latency_seconds_bucket{language="es-419",le="0.25"}'
        values: '0+1000x60'
      - series: 'asr_partial_latency_seconds_bucket{language="es-419",le="+Inf"}'
        values: '0+1000x60'
    promql_expr_test:
      # Antes del cambio: rango 950 de 1,000 dentro de (0, 0.15] → 0.15 × 950 / 1000 = 0.1425
      - expr: asr:partial_latency_p95:rate5m
        eval_time: 15m
        exp_samples:
          - labels: 'asr:partial_latency_p95:rate5m{language="es-419"}'
            value: 0.1425
    alert_rule_test:
      - eval_time: 30m
        alertname: CaptionPartialLatencyHigh
        exp_alerts: []
      - eval_time: 36m
        alertname: CaptionPartialLatencyHigh
        exp_alerts:
          - exp_labels: {language: es-419, severity: page}
            exp_annotations:
              summary: "Captions es-419: p95 de partials 225ms server-side (> 200 ms)"
              description: '¿El modelo o la cola? Mira asr:model_step_p95:rate5m por pod (GPUStreamSaturation) y asr_dropped_messages_total{reason="behind"}. Si el paso está bien: CPU del pod (serializar JSON, VAD) o consumidores lentos (reason="slow_consumer").'
              runbook_url: "https://runbooks.example.com/c13/partial-latency"

  # Un 3 % lento no alcanza: el rango 950 cae en el bucket de 200 ms (p95 = 0.2 × 950 / 970 ≈ 0.196).
  - interval: 1m
    input_series:
      - series: 'asr_partial_latency_seconds_bucket{language="en-US",le="0.2"}'
        values: '0+970x60'
      - series: 'asr_partial_latency_seconds_bucket{language="en-US",le="0.25"}'
        values: '0+1000x60'
      - series: 'asr_partial_latency_seconds_bucket{language="en-US",le="+Inf"}'
        values: '0+1000x60'
    alert_rule_test:
      - eval_time: 60m
        alertname: CaptionPartialLatencyHigh
        exp_alerts: []

  # ---------------------------------------------------------------- CaptionFinalLatencyHigh
  # 100 finales/min en pt-BR. Desde el minuto 20, el 10 % tarda 1.2–1.5 s → p95 = 1.2 + 0.3 × 5 / 10 = 1.35.
  - interval: 1m
    input_series:
      - series: 'asr_final_latency_seconds_bucket{language="pt-BR",le="1"}'
        values: '0+100x20 2090+90x39'
      - series: 'asr_final_latency_seconds_bucket{language="pt-BR",le="1.2"}'
        values: '0+100x20 2090+90x39'
      - series: 'asr_final_latency_seconds_bucket{language="pt-BR",le="1.5"}'
        values: '0+100x60'
      - series: 'asr_final_latency_seconds_bucket{language="pt-BR",le="+Inf"}'
        values: '0+100x60'
    promql_expr_test:
      - expr: ALERTS{alertname="CaptionFinalLatencyHigh", alertstate="firing"}
        eval_time: 36m
        exp_samples:
          - labels: 'ALERTS{alertname="CaptionFinalLatencyHigh", alertstate="firing", language="pt-BR", severity="page"}'
            value: 1
    alert_rule_test:
      - eval_time: 30m
        alertname: CaptionFinalLatencyHigh
        exp_alerts: []

  # ---------------------------------------------------------------- GPUStreamSaturation
  # Dos pods con 6,000 pasos/min. El pod b, desde el minuto 10, tiene el 20 % de pasos entre 128 y 160 ms
  # → p95 = 0.128 + 0.032 × (5,700 − 4,800) / 1,200 = 0.152. El pod a sigue bien y NO debe aparecer.
  - interval: 1m
    input_series:
      - series: 'asr_model_step_seconds_bucket{pod="asr-worker-a",le="0.1"}'
        values: '0+6000x30'
      - series: 'asr_model_step_seconds_bucket{pod="asr-worker-a",le="0.128"}'
        values: '0+6000x30'
      - series: 'asr_model_step_seconds_bucket{pod="asr-worker-a",le="0.16"}'
        values: '0+6000x30'
      - series: 'asr_model_step_seconds_bucket{pod="asr-worker-a",le="+Inf"}'
        values: '0+6000x30'
      - series: 'asr_model_step_seconds_bucket{pod="asr-worker-b",le="0.1"}'
        values: '0+6000x10 64800+4800x19'
      - series: 'asr_model_step_seconds_bucket{pod="asr-worker-b",le="0.128"}'
        values: '0+6000x10 64800+4800x19'
      - series: 'asr_model_step_seconds_bucket{pod="asr-worker-b",le="0.16"}'
        values: '0+6000x30'
      - series: 'asr_model_step_seconds_bucket{pod="asr-worker-b",le="+Inf"}'
        values: '0+6000x30'
    promql_expr_test:
      - expr: ALERTS{alertname="GPUStreamSaturation", alertstate="firing"}
        eval_time: 20m
        exp_samples:
          - labels: 'ALERTS{alertname="GPUStreamSaturation", alertstate="firing", pod="asr-worker-b", severity="page"}'
            value: 1
    alert_rule_test:
      - eval_time: 15m
        alertname: GPUStreamSaturation
        exp_alerts: []

  # ---------------------------------------------------------------- SessionReconnectRateHigh
  # 1,000 handshakes/min. Minuto 10: UN worker se cae (450 reconexiones de golpe = 4.5 % durante ≈ 10 min):
  # NO debe disparar. Desde el 40: 40 reconexiones/min sostenidas (4 %): SÍ. Las migraciones del drain
  # (20 % de los handshakes) son planeadas y no cuentan.
  - interval: 1m
    input_series:
      - series: 'asr_sessions_started_total{language="es-419"}'
        values: '0+1000x80'
      - series: 'asr_reconnects_total{reason="worker_lost"}'
        values: '0x10 450x29 490+40x39'
      - series: 'asr_reconnects_total{reason="migrate"}'
        values: '0+200x80'
    promql_expr_test:
      - expr: ALERTS{alertname="SessionReconnectRateHigh", alertstate="firing"}
        eval_time: 66m
        exp_samples:
          - labels: 'ALERTS{alertname="SessionReconnectRateHigh", alertstate="firing", severity="page"}'
            value: 1
    alert_rule_test:
      # A los 20 min la caída del worker lleva ≈ 9 min sobre el 2 %: con for 15m todavía no dispara
      - eval_time: 20m
        alertname: SessionReconnectRateHigh
        exp_alerts: []
      - eval_time: 25m
        alertname: SessionReconnectRateHigh
        exp_alerts: []
      - eval_time: 55m
        alertname: SessionReconnectRateHigh
        exp_alerts: []

  # ---------------------------------------------------------------- CaptionDeliveryLag
  # 1,000 entregas/min; desde el 20, el 10 % tarda 250–500 ms → p95 = 0.25 + 0.25 × 50 / 100 = 0.375.
  - interval: 1m
    input_series:
      - series: 'caption_delivery_lag_seconds_bucket{le="0.1"}'
        values: '0+1000x20 20900+900x39'
      - series: 'caption_delivery_lag_seconds_bucket{le="0.25"}'
        values: '0+1000x20 20900+900x39'
      - series: 'caption_delivery_lag_seconds_bucket{le="0.5"}'
        values: '0+1000x60'
      - series: 'caption_delivery_lag_seconds_bucket{le="+Inf"}'
        values: '0+1000x60'
    promql_expr_test:
      - expr: ALERTS{alertname="CaptionDeliveryLag", alertstate="firing"}
        eval_time: 36m
        exp_samples:
          - labels: 'ALERTS{alertname="CaptionDeliveryLag", alertstate="firing", severity="page"}'
            value: 1
    alert_rule_test:
      - eval_time: 30m
        alertname: CaptionDeliveryLag
        exp_alerts: []

  # ---------------------------------------------------------------- ASRCapacityHeadroomLow
  # Dos workers de 450. 350 + 350 = 78 % (el régimen que busca KEDA). Desde el minuto 11, 420 + 420 = 93 %
  # (los nodos GPU no llegan) → firing en el 21.
  - interval: 1m
    input_series:
      - series: 'asr_active_streams{pod="asr-worker-a"}'
        values: '350x10 420x20'
      - series: 'asr_active_streams{pod="asr-worker-b"}'
        values: '350x10 420x20'
      - series: 'asr_stream_capacity{pod="asr-worker-a"}'
        values: '450x30'
      - series: 'asr_stream_capacity{pod="asr-worker-b"}'
        values: '450x30'
    promql_expr_test:
      - expr: asr:capacity_utilization
        eval_time: 5m
        exp_samples:
          - labels: 'asr:capacity_utilization'
            value: 0.7777777777777778
      - expr: ALERTS{alertname="ASRCapacityHeadroomLow", alertstate="firing"}
        eval_time: 23m
        exp_samples:
          - labels: 'ALERTS{alertname="ASRCapacityHeadroomLow", alertstate="firing", severity="page"}'
            value: 1
    alert_rule_test:
      - eval_time: 19m
        alertname: ASRCapacityHeadroomLow
        exp_alerts: []

  # Un worker DRENA (capacidad 0) con 300 streams que todavía no migraron: tienen que caber en el otro.
  # 300 + 350 = 650 sobre 450 de capacidad que acepta → 144 % → dispara (si dura 10 min, el drain no avanza).
  - interval: 1m
    input_series:
      - series: 'asr_active_streams{pod="asr-worker-a"}'
        values: '350x30'
      - series: 'asr_active_streams{pod="asr-worker-b"}'
        values: '300x30'
      - series: 'asr_stream_capacity{pod="asr-worker-a"}'
        values: '450x30'
      - series: 'asr_stream_capacity{pod="asr-worker-b"}'
        values: '0x30'
    promql_expr_test:
      - expr: ALERTS{alertname="ASRCapacityHeadroomLow", alertstate="firing"}
        eval_time: 12m
        exp_samples:
          - labels: 'ALERTS{alertname="ASRCapacityHeadroomLow", alertstate="firing", severity="page"}'
            value: 1

  # La fracción de pistas con voz baja: los streams están bien (300 de 450 por pod = 67 %), pero cada pod
  # tiene 1,350 de 1,500 sesiones (90 %): el router está por rechazar pistas con GPUs de sobra. Dispara la
  # rama de sesiones (cause="sessions") y no la de streams.
  - interval: 1m
    input_series:
      - series: 'asr_active_streams{pod="asr-worker-a"}'
        values: '300x30'
      - series: 'asr_stream_capacity{pod="asr-worker-a"}'
        values: '450x30'
      - series: 'asr_sessions{pod="asr-worker-a"}'
        values: '1350x30'
      - series: 'asr_session_capacity{pod="asr-worker-a"}'
        values: '1500x30'
    promql_expr_test:
      - expr: asr:session_utilization
        eval_time: 5m
        exp_samples:
          - labels: 'asr:session_utilization'
            value: 0.9
    alert_rule_test:
      - eval_time: 12m
        alertname: ASRCapacityHeadroomLow
        exp_alerts:
          - exp_labels: {cause: sessions, severity: page}
            exp_annotations:
              summary: "Sesiones de ASR al 90% de MAX_SESSIONS (> 85 %)"
              description: 'kubectl get scaledobject,hpa -n c13 (¿en maxReplicaCount?); kubectl get pods -n c13 | grep Pending (¿nodos GPU?); rate(asr_sessions_rejected_total{reason="capacity"}[5m]). Con cause=no_metrics: el PodMonitor o Prometheus.'
              runbook_url: "https://runbooks.example.com/c13/capacity"

  # Los workers dejan de exportar métricas (falta el PodMonitor): dispara con cause="no_metrics".
  - interval: 1m
    input_series:
      - series: 'up{job="something-else"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 12m
        alertname: ASRCapacityHeadroomLow
        exp_alerts:
          # También prueba la otra rama del template: sin métricas, el resumen no dice "capacidad al 100 %"
          - exp_labels: {cause: no_metrics, severity: page}
            exp_annotations:
              summary: "Workers de ASR sin métricas: autoscaling y alertas a ciegas"
              description: 'kubectl get scaledobject,hpa -n c13 (¿en maxReplicaCount?); kubectl get pods -n c13 | grep Pending (¿nodos GPU?); rate(asr_sessions_rejected_total{reason="capacity"}[5m]). Con cause=no_metrics: el PodMonitor o Prometheus.'
              runbook_url: "https://runbooks.example.com/c13/capacity"

  # ---------------------------------------------------------------- CanaryWERRegression
  # es-419: el canario empeora 1.8 puntos desde el minuto 31, con 20,000 palabras → firing en el ≈ 61.
  # en-US: el canario está 10 puntos peor, pero con 800 palabras de referencia: no alcanza para decidir.
  - interval: 1m
    input_series:
      - series: 'asr_golden_wer{language="es-419",track="stable"}'
        values: '0.12x90'
      - series: 'asr_golden_wer{language="es-419",track="canary"}'
        values: '0.122x30 0.138x59'
      - series: 'asr_golden_ref_words{language="es-419",track="canary"}'
        values: '20000x90'
      - series: 'asr_golden_wer{language="en-US",track="stable"}'
        values: '0.10x90'
      - series: 'asr_golden_wer{language="en-US",track="canary"}'
        values: '0.20x90'
      - series: 'asr_golden_ref_words{language="en-US",track="canary"}'
        values: '800x90'
    promql_expr_test:
      - expr: ALERTS{alertname="CanaryWERRegression", alertstate="firing"}
        eval_time: 65m
        exp_samples:
          - labels: 'ALERTS{alertname="CanaryWERRegression", alertstate="firing", language="es-419", severity="ticket"}'
            value: 1
    alert_rule_test:
      - eval_time: 55m
        alertname: CanaryWERRegression
        exp_alerts: []

  # ---------------------------------------------------------------- VADActiveRatioShift
  # Intervalo de 10 min para simular más de una semana. 1,000 frames por intervalo; 30 % voz toda la
  # semana. Desde el intervalo 1,021 (minuto 10,210, ya pasada la semana) la voz cae a 15 %: un cambio del
  # cliente que se come el habla. Ahora ÷ hace una semana = 0.5 < 0.7 → firing ≈ 1 h después.
  - interval: 10m
    input_series:
      - series: 'asr_vad_frames_total{decision="speech"}'
        values: '0+300x1020 306150+150x40'
      - series: 'asr_vad_frames_total{decision="silence"}'
        values: '0+700x1020 714850+850x40'
    promql_expr_test:
      - expr: ALERTS{alertname="VADActiveRatioShift", alertstate="firing"}
        eval_time: 10400m
        exp_samples:
          - labels: 'ALERTS{alertname="VADActiveRatioShift", alertstate="firing", severity="ticket"}'
            value: 1
    alert_rule_test:
      - eval_time: 10220m
        alertname: VADActiveRatioShift
        exp_alerts: []

  # La misma semana sin cambios: el cociente queda en 1.0 y no dispara.
  - interval: 10m
    input_series:
      - series: 'asr_vad_frames_total{decision="speech"}'
        values: '0+300x1060'
      - series: 'asr_vad_frames_total{decision="silence"}'
        values: '0+700x1060'
    promql_expr_test:
      - expr: asr:vad_speech_ratio_wow:rate1h
        eval_time: 10400m
        exp_samples:
          - labels: 'asr:vad_speech_ratio_wow:rate1h'
            value: 1
    alert_rule_test:
      - eval_time: 10400m
        alertname: VADActiveRatioShift
        exp_alerts: []
