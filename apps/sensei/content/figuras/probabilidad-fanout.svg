<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 440" role="img" aria-labelledby="f-probabilidad-fanout-t" class="f-svg" style="max-width:420px">
<title id="f-probabilidad-fanout-t">Fan-out. A lo ancho, cuántos servicios espera la request, de 1 a 100; a lo alto, qué fracción de las requests resulta lenta. Si cada servicio es lento el 1 % de las veces (su p99), la curva sube rápido: 1 % con uno, 9.6 % con 10, la mitad con 69 y 63.4 % con 100. Si cada servicio cumple su p99.9, con 100 servicios solo 9.5 % de las requests es lenta. La línea punteada es la cuenta equivocada de sumar 1 % por servicio, que llega a 100 % con 100 servicios.</title>
