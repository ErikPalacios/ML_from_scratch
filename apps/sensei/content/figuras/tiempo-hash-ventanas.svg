<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 400" role="img" aria-labelledby="f-tiempo-hash-ventanas-t" class="f-svg" style="max-width:420px">
<title id="f-tiempo-hash-ventanas-t">Seis pagos de una tarjeta sobre un eje de event time de 10:00 a 10:15: a las 10:00:05 (el del metro, que llega tarde), 10:02, 10:03:30, 10:06:50, 10:08 y 10:12. Ventanas fijas de 5 minutos: la de 10:00 a 10:05 tiene 3 pagos, aunque emitió 2; la de 10:05 a 10:10 tiene 2; la de 10:10 a 10:15, 1. Ventanas deslizantes de 10 minutos que avanzan cada 5: la de 10:00 a 10:10 tiene 5 pagos y la de 10:05 a 10:15, 3; se enciman, y cada pago cae en dos. Una línea punteada marca el watermark en 10:05:50: a las 10:06:52 llegó el pago de las 10:06:50, el watermark es esa hora menos 1 minuto y cierra la primera ventana fija con 2 pagos. El pago del metro llega a las 10:07, después del cierre: tarde.</title>
<rect class="f-card" x="10" y="10" width="340" height="380" rx="16"/>
<text class="f-l" x="26" y="34">PAGOS DE UNA TARJETA, POR EVENT TIME</text>
<text class="f-s" x="40" y="56" style="font-size:12px;fill:var(--o);font-weight:700">metro: 10:00:05, llega a las 10:07</text>
<circle class="f-o" cx="33" cy="72" r="6"/>
<circle class="f-b" cx="70" cy="72" r="6"/>
<circle class="f-b" cx="100" cy="72" r="6"/>
<circle class="f-b" cx="167" cy="72" r="6"/>
<circle class="f-b" cx="190" cy="72" r="6"/>
<circle class="f-b" cx="270" cy="72" r="6"/>
<line class="f-linea" x1="30" y1="86" x2="330" y2="86"/>
<line class="f-linea" x1="30" y1="82" x2="30" y2="90"/>
<line class="f-linea" x1="130" y1="82" x2="130" y2="90"/>
<line class="f-linea" x1="230" y1="82" x2="230" y2="90"/>
<line class="f-linea" x1="330" y1="82" x2="330" y2="90"/>
<text class="f-s" x="30" y="106" text-anchor="middle" style="font:12px var(--mono)">10:00</text>
<text class="f-s" x="130" y="106" text-anchor="middle" style="font:12px var(--mono)">10:05</text>
<text class="f-s" x="230" y="106" text-anchor="middle" style="font:12px var(--mono)">10:10</text>
<text class="f-s" x="326" y="106" text-anchor="middle" style="font:12px var(--mono)">10:15</text>
<text class="f-l" x="26" y="130">FIJAS DE 5 MIN</text>
<rect class="f-chip" x="32" y="138" width="96" height="30" rx="7"/>
<text class="f-t" x="80" y="158" text-anchor="middle" style="font-size:13px">3 · <tspan style="fill:var(--o)">emitió 2</tspan></text>
<rect class="f-chip" x="132" y="138" width="96" height="30" rx="7"/>
<text class="f-t" x="180" y="158" text-anchor="middle" style="font-size:13px">2</text>
<rect class="f-chip" x="232" y="138" width="96" height="30" rx="7"/>
<text class="f-t" x="280" y="158" text-anchor="middle" style="font-size:13px">1</text>
<text class="f-l" x="26" y="192">DESLIZANTES DE 10 MIN, CADA 5</text>
<rect class="f-chip" x="32" y="200" width="196" height="26" rx="7"/>
<text class="f-s" x="88" y="218" text-anchor="middle" style="font-size:12px;font-weight:700">10:00–10:10 · 5</text>
<rect class="f-chip" x="132" y="230" width="196" height="26" rx="7"/>
<text class="f-s" x="230" y="248" text-anchor="middle" style="font-size:12px;font-weight:700">10:05–10:15 · 3</text>
<line x1="147" y1="64" x2="147" y2="262" style="stroke:var(--p);stroke-width:2;stroke-dasharray:5 4"/>
<text class="f-s" x="147" y="278" text-anchor="middle" style="font-size:12px;fill:var(--p);font-weight:700">watermark 10:05:50</text>
<rect class="f-chip" x="24" y="292" width="312" height="84" rx="10"/>
<text class="f-s" x="38" y="312" style="font-size:12px">10:06:52: llega un pago de las 10:06:50.</text>
<text class="f-s" x="38" y="329" style="font-size:12px">Watermark = 10:06:50 − 1 min = 10:05:50:</text>
<text class="f-s" x="38" y="346" style="font-size:12px">la ventana de 10:00 a 10:05 cierra con 2.</text>
<text class="f-t" x="38" y="365" style="font-size:12px">El pago del metro llega a las 10:07: tarde.</text>
</svg>
