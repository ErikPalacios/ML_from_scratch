<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 490" role="img" aria-labelledby="f-numeros-maquina-escala-t" class="f-svg" style="max-width:420px">
<title id="f-numeros-maquina-escala-t">Cuantizar a INT8 una capa con pesos de menos 2.5 a 2.5. Arriba, la recta de menos 2.5 a 2.5 con 255 escalones de 0.0197 cada uno y los cinco pesos marcados: menos 2.5, menos 0.73, 0.1, 1.26 y 2.04. En medio, un acercamiento entre 0 y 0.2 con los escalones 0 a 10: el peso 0.1 cae en el escalón 5, que vale 0.0984, a 0.0016 del valor real. Abajo, la misma capa con un peso atípico de 25: los escalones miden 0.197, diez veces más, y entre 0 y 0.4 solo hay tres, el 0, el 1 y el 2. El 0.1 salta al escalón 1 y vuelve como 0.197, con un error de 97 por ciento.</title>
<rect class="f-card" x="10" y="10" width="340" height="470" rx="16"/>
<text class="f-l" x="28.0" y="36.0">INT8: CADA PESO CAE EN UN ESCALÓN</text>
<text class="f-s" x="28.0" y="62.0" style="font-size:13px;font-weight:600">La capa: pesos de −2.5 a 2.5</text>
<text class="f-s" x="28.0" y="80.0" style="font-size:12px">255 escalones de 2.5 ÷ 127 ≈ 0.0197</text>
<rect class="f-b2" x="28.0" y="117.0" width="304.0" height="10.0" rx="3"/>
<circle cx="28.0" cy="122" r="5.5" style="fill:var(--o);stroke:var(--surface);stroke-width:1.5"/>
<text x="28.0" y="110.0" text-anchor="start" style="fill:var(--o);font:800 12px var(--sans)">−2.5</text>
<circle cx="135.6" cy="122" r="5.5" style="fill:var(--o);stroke:var(--surface);stroke-width:1.5"/>
<text x="135.6" y="110.0" text-anchor="middle" style="fill:var(--o);font:800 12px var(--sans)">−0.73</text>
<circle cx="186.1" cy="122" r="5.5" style="fill:var(--o);stroke:var(--surface);stroke-width:1.5"/>
<text x="186.1" y="110.0" text-anchor="middle" style="fill:var(--o);font:800 12px var(--sans)">0.1</text>
<circle cx="256.6" cy="122" r="5.5" style="fill:var(--o);stroke:var(--surface);stroke-width:1.5"/>
<text x="256.6" y="110.0" text-anchor="middle" style="fill:var(--o);font:800 12px var(--sans)">1.26</text>
<circle cx="304.0" cy="122" r="5.5" style="fill:var(--o);stroke:var(--surface);stroke-width:1.5"/>
<text x="304.0" y="110.0" text-anchor="middle" style="fill:var(--o);font:800 12px var(--sans)">2.04</text>
<text class="f-s" x="28.0" y="146.0" text-anchor="start" style="font-size:12px">−2.5</text>
<text class="f-s" x="180.0" y="146.0" text-anchor="middle" style="font-size:12px">0</text>
<text class="f-s" x="332.0" y="146.0" text-anchor="end" style="font-size:12px">2.5</text>
<text class="f-s" x="28.0" y="182.0" style="font-size:13px;font-weight:600">Acercamiento entre 0 y 0.2</text>
<line class="f-linea" x1="28" y1="222" x2="332" y2="222"/>
<line x1="28.0" y1="210" x2="28.0" y2="234" style="stroke:var(--muted);stroke-width:1.5;stroke-linecap:round"/>
<text class="f-s" x="28.0" y="250.0" text-anchor="middle" style="font-size:11px">0</text>
<line x1="57.9" y1="210" x2="57.9" y2="234" style="stroke:var(--muted);stroke-width:1.5;stroke-linecap:round"/>
<text class="f-s" x="57.9" y="250.0" text-anchor="middle" style="font-size:11px">1</text>
<line x1="87.8" y1="210" x2="87.8" y2="234" style="stroke:var(--muted);stroke-width:1.5;stroke-linecap:round"/>
<text class="f-s" x="87.8" y="250.0" text-anchor="middle" style="font-size:11px">2</text>
<line x1="117.8" y1="210" x2="117.8" y2="234" style="stroke:var(--muted);stroke-width:1.5;stroke-linecap:round"/>
<text class="f-s" x="117.8" y="250.0" text-anchor="middle" style="font-size:11px">3</text>
<line x1="147.7" y1="210" x2="147.7" y2="234" style="stroke:var(--muted);stroke-width:1.5;stroke-linecap:round"/>
<text class="f-s" x="147.7" y="250.0" text-anchor="middle" style="font-size:11px">4</text>
<line x1="177.6" y1="210" x2="177.6" y2="234" style="stroke:var(--b);stroke-width:3;stroke-linecap:round"/>
<text x="177.6" y="250.0" text-anchor="middle" style="fill:var(--b);font:800 12px var(--sans)">5</text>
<line x1="207.5" y1="210" x2="207.5" y2="234" style="stroke:var(--muted);stroke-width:1.5;stroke-linecap:round"/>
<text class="f-s" x="207.5" y="250.0" text-anchor="middle" style="font-size:11px">6</text>
<line x1="237.4" y1="210" x2="237.4" y2="234" style="stroke:var(--muted);stroke-width:1.5;stroke-linecap:round"/>
<text class="f-s" x="237.4" y="250.0" text-anchor="middle" style="font-size:11px">7</text>
<line x1="267.4" y1="210" x2="267.4" y2="234" style="stroke:var(--muted);stroke-width:1.5;stroke-linecap:round"/>
<text class="f-s" x="267.4" y="250.0" text-anchor="middle" style="font-size:11px">8</text>
<line x1="297.3" y1="210" x2="297.3" y2="234" style="stroke:var(--muted);stroke-width:1.5;stroke-linecap:round"/>
<text class="f-s" x="297.3" y="250.0" text-anchor="middle" style="font-size:11px">9</text>
<line x1="327.2" y1="210" x2="327.2" y2="234" style="stroke:var(--muted);stroke-width:1.5;stroke-linecap:round"/>
<text class="f-s" x="327.2" y="250.0" text-anchor="middle" style="font-size:11px">10</text>
<circle cx="180.0" cy="202" r="5.5" style="fill:var(--o)"/>
<text x="190.0" y="206.0" text-anchor="start" style="fill:var(--o);font:800 12px var(--sans)">0.1</text>
<text class="f-s" x="28.0" y="274.0" style="font-size:12px">El 0.1 cae en el escalón 5: 5 × 0.0197 = 0.0984.</text>
<text class="f-s" x="28.0" y="292.0" style="font-size:12px">Error: 0.0016, menos de medio escalón.</text>
<text class="f-s" x="28.0" y="324.0" style="font-size:13px;font-weight:600">Con un peso atípico de 25</text>
<text class="f-s" x="28.0" y="342.0" style="font-size:12px">escalones de 25 ÷ 127 ≈ 0.197: diez veces más anchos</text>
<line class="f-linea" x1="28" y1="400" x2="332" y2="400"/>
<line x1="28.0" y1="388" x2="28.0" y2="412" style="stroke:var(--muted);stroke-width:1.5;stroke-linecap:round"/>
