<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 420" role="img" aria-labelledby="f-agentes-trifecta-t" class="f-svg" style="max-width:420px">
<title id="f-agentes-trifecta-t">Tres círculos que se cruzan: [A] contenido no confiable, [B] datos privados y [C] un canal hacia afuera. Donde se cruzan los tres está la trifecta letal: el agente puede ser engañado para sacar los datos. El agente de solo lectura del despacho está donde se cruzan A y B, fuera de C: cumple la regla de dos. Abajo, tres ejemplos: el agente del despacho es [AB] y cumple; un agente de soporte que lee correos y abre tickets sin datos sensibles es [AC] y cumple; si al del despacho se le agrega mandar la tabla por correo, queda en [ABC] y necesita aprobación humana en cada envío.</title>
<text class="f-l" x="14" y="22">LA TRIFECTA LETAL Y LA REGLA DE DOS</text>
<circle class="f-o" cx="125" cy="140" r="72" style="opacity:.45"/>
<circle class="f-b" cx="235" cy="140" r="72" style="opacity:.45"/>
<circle class="f-p" cx="180" cy="235" r="72" style="opacity:.45"/>
<text class="f-t" x="92" y="118" text-anchor="middle" style="font-size:14px">[A]</text>
<text class="f-s" x="92" y="135" text-anchor="middle" style="font-size:12px">contenido</text>
<text class="f-s" x="92" y="150" text-anchor="middle" style="font-size:12px">no confiable</text>
<text class="f-t" x="268" y="118" text-anchor="middle" style="font-size:14px">[B]</text>
<text class="f-s" x="268" y="135" text-anchor="middle" style="font-size:12px">datos</text>
<text class="f-s" x="268" y="150" text-anchor="middle" style="font-size:12px">privados</text>
<text class="f-t" x="180" y="262" text-anchor="middle" style="font-size:14px">[C]</text>
<text class="f-s" x="180" y="279" text-anchor="middle" style="font-size:12px">canal hacia afuera</text>
<circle class="f-ink" cx="180" cy="112" r="5"/>
<line class="f-linea" x1="180" y1="106" x2="180" y2="50"/>
<text class="f-s" x="180" y="44" text-anchor="middle" style="font-size:12px;font-weight:700">agente de solo lectura del despacho</text>
<circle class="f-acc" cx="180" cy="172" r="11"/>
<text class="f-acc-t" x="180" y="177" text-anchor="middle" style="font-size:12px">!</text>
<line class="f-linea" x1="191" y1="176" x2="258" y2="206"/>
<text class="f-s" x="262" y="206" style="font-size:12px;font-weight:700">las tres:</text>
<text class="f-s" x="262" y="221" style="font-size:12px">trifecta</text>
<rect class="f-card" x="10" y="320" width="340" height="92" rx="14"/>
<text class="f-s" x="24" y="343" style="font-size:12px"><tspan style="font-weight:700">[AB]</tspan> el agente del despacho: cumple</text>
<text class="f-s" x="24" y="363" style="font-size:12px"><tspan style="font-weight:700">[AC]</tspan> soporte que abre tickets: cumple</text>
<text class="f-s" x="24" y="383" style="font-size:12px"><tspan style="font-weight:700">[ABC]</tspan> + «manda la tabla por correo»:</text>
<text class="f-s" x="24" y="401" style="font-size:12px">aprobación humana en cada envío</text>
</svg>
