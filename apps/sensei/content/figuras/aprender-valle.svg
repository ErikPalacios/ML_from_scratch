<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" role="img" aria-labelledby="f-av-t" class="f-svg" style="max-width:420px">
<title id="f-av-t">Descenso de gradiente con una sola perilla w. La pérdida es una curva en forma de valle con el mínimo en w igual a 3. Una bolita empieza en w igual a 0 con pérdida 36 y baja en tres pasos con learning rate 0.05: a w 1.2 con pérdida 12.96, a w 1.92 con pérdida 4.67 y a w 2.35 con pérdida 1.68. Cada salto es más corto porque el valle se va aplanando</title>
<defs><marker id="fav-g" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-giro-p"/></marker></defs>
<rect class="f-card" x="10" y="10" width="340" height="450" rx="16"/>
<text class="f-l" x="26" y="38">PÉRDIDA</text>
<line class="f-flecha" x1="30" y1="50" x2="30" y2="262"/>
<line class="f-flecha" x1="30" y1="262" x2="334" y2="262"/>
<path class="f-giro" style="stroke:var(--b);stroke-width:3" d="M40,70 Q184,430 328,70"/>
<line class="f-flecha" x1="184" y1="250" x2="184" y2="262" style="stroke-dasharray:3 3"/>
<text class="f-l" x="40" y="280" text-anchor="middle">w = 0</text>
<text class="f-l" x="184" y="280" text-anchor="middle">w = 3 · mínimo</text>
<text class="f-l" x="328" y="280" text-anchor="end">w = 6</text>
<path class="f-giro" d="M50,62 Q92,90 96,170" marker-end="url(#fav-g)"/>
<path class="f-giro" d="M108,180 Q128,184 131,212" marker-end="url(#fav-g)"/>
<path class="f-giro" d="M142,222 Q152,226 152,230" marker-end="url(#fav-g)"/>
<circle class="f-acc" cx="40" cy="70" r="10"/><text class="f-acc-t" x="40" y="75" text-anchor="middle" style="font-size:12px">0</text>
<circle class="f-acc" cx="97.6" cy="185.2" r="10"/><text class="f-acc-t" x="97.6" y="190" text-anchor="middle" style="font-size:12px">1</text>
<circle class="f-acc" cx="132.2" cy="226.7" r="10"/><text class="f-acc-t" x="132.2" y="231.5" text-anchor="middle" style="font-size:12px">2</text>
<circle class="f-acc" cx="152.9" cy="241.6" r="10"/><text class="f-acc-t" x="152.9" y="246.4" text-anchor="middle" style="font-size:12px">3</text>
<text class="f-s" x="180" y="118" style="font-size:12px">el valle se aplana:</text>
<text class="f-s" x="180" y="134" style="font-size:12px">pasos más cortos</text>
<text class="f-l" x="26" y="312">PASO</text>
<text class="f-l" x="90" y="312">PERILLA w</text>
<text class="f-l" x="190" y="312">PÉRDIDA</text>
<text class="f-l" x="268" y="312">GRADIENTE</text>
<text class="f-t" x="26" y="338" style="font-size:13px">0</text><text class="f-s" x="90" y="338">0</text><text class="f-s" x="190" y="338">36</text><text class="f-s" x="268" y="338">−24</text>
<text class="f-t" x="26" y="362" style="font-size:13px">1</text><text class="f-s" x="90" y="362">1.2</text><text class="f-s" x="190" y="362">12.96</text><text class="f-s" x="268" y="362">−14.4</text>
<text class="f-t" x="26" y="386" style="font-size:13px">2</text><text class="f-s" x="90" y="386">1.92</text><text class="f-s" x="190" y="386">4.67</text><text class="f-s" x="268" y="386">−8.64</text>
<text class="f-t" x="26" y="410" style="font-size:13px">3</text><text class="f-s" x="90" y="410">2.352</text><text class="f-s" x="190" y="410">1.68</text><text class="f-s" x="268" y="410">−5.18</text>
<text class="f-s" x="26" y="440" style="font-size:12px">Cada paso: w nueva = w − 0.05 × gradiente</text>
</svg>
