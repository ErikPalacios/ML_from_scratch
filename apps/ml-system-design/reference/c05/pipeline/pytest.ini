# Configuración de pytest del pipeline: todo es lógica pura, sin AWS, sin modelos y sin red
[pytest]
# La carpeta pipeline/ entra al sys.path: los tests importan `validators`, `cfdi`… igual que el worker
pythonpath = .
# Solo buscamos tests en tests/
testpaths = tests
# Salida compacta: en CI importa la lista de fallos
addopts = -q
