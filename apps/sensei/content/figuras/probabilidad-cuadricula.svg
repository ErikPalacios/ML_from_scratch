<title id="f-probabilidad-cuadricula-t">Cien requests en una cuadrícula de 10 por 10. Las filas dicen si el servicio A fue rápido (9 filas) o lento (1 fila); las columnas, lo mismo para el servicio B. 81 cuadritos son los dos rápidos (0.9 por 0.9), 18 tienen solo uno lento (9 más 9) y 1 tiene los dos lentos (0.1 por 0.1). Al menos uno lento: 19 de 100, que es 100 menos 81. Sumar 10 más 10 da 20 porque cuenta dos veces el cuadrito de los dos lentos.</title>
