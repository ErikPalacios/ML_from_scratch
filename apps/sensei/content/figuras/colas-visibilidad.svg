<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 384" role="img" aria-labelledby="f-colas-visibilidad-t" class="f-svg" style="max-width:420px">
<title id="f-colas-visibilidad-t">Un mensaje en el tiempo, de 0 a 60 segundos, con un visibility timeout de 30 segundos. A los 0 segundos el worker 1 lo recibe y el mensaje queda en vuelo, invisible para los demás. A los 10 segundos el worker 1 se cae sin mandar el ack. El mensaje sigue escondido hasta los 30 segundos, cuando vence el plazo y reaparece. Lo recibe el worker 2, que lo procesa de los 30 a los 45 segundos y manda el ack. Solo entonces el mensaje se borra. Entre los 10 y los 30 segundos nadie trabajó en él: es el precio de un plazo de 30 segundos.</title>
<rect class="f-card" x="10" y="10" width="340" height="364" rx="16"/>
<text class="f-l" x="28" y="36">UN MENSAJE, DOS WORKERS, PLAZO DE 30 S</text>

<line x1="195" y1="70" x2="195" y2="290" class="f-linea" style="stroke-dasharray:4 4"/>
<line x1="262.5" y1="70" x2="262.5" y2="290" class="f-linea" style="stroke-dasharray:4 4"/>

<text class="f-t" x="28" y="62" style="font-size:13px">El mensaje, en la cola</text>
<rect class="f-off" x="60" y="72" width="135" height="26" rx="4"/>
<text class="f-s" x="127.5" y="89.5" text-anchor="middle" style="font-size:12px">invisible, con el 1</text>
<rect class="f-off" x="195" y="72" width="67.5" height="26" rx="4"/>
<text class="f-s" x="228.75" y="89.5" text-anchor="middle" style="font-size:12px">con el 2</text>
<rect class="f-g" x="262.5" y="72" width="67.5" height="26" rx="4" style="opacity:.35"/>
<text class="f-t" x="296.25" y="89.5" text-anchor="middle" style="font-size:12px">borrado</text>
<polygon class="f-y" points="195,100 202,108 195,116 188,108"/>
<text class="f-s" x="188" y="132" text-anchor="end" style="font-size:12px">30 s: vence el plazo</text>
<text class="f-s" x="188" y="147" text-anchor="end" style="font-size:12px">sin ack y reaparece</text>

<text class="f-t" x="28" y="176" style="font-size:13px">Worker 1</text>
<rect class="f-b" x="60" y="186" width="45" height="26" rx="4"/>
<line x1="99" y1="193" x2="111" y2="205" style="stroke:var(--o);stroke-width:3"/>
<line x1="111" y1="193" x2="99" y2="205" style="stroke:var(--o);stroke-width:3"/>
<text class="f-s" x="118" y="204" style="font-size:12px">se cae a los 10 s, sin ack</text>

<text class="f-t" x="28" y="236" style="font-size:13px">Worker 2</text>
<rect class="f-b" x="195" y="246" width="67.5" height="26" rx="4"/>
<text x="228.75" y="263.5" text-anchor="middle" class="f-pill-t" style="font-size:12px">procesa</text>
<text class="f-s" x="188" y="263.5" text-anchor="end" style="font-size:12px">lo recibe otra vez</text>
<text class="f-t" x="270" y="263.5" style="font-size:12px">ack ✓</text>

<line class="f-linea" x1="60" y1="290" x2="330" y2="290"/>
<line class="f-linea" x1="60" y1="286" x2="60" y2="294"/>
<line class="f-linea" x1="105" y1="286" x2="105" y2="294"/>
<line class="f-linea" x1="150" y1="286" x2="150" y2="294"/>
<line class="f-linea" x1="195" y1="286" x2="195" y2="294"/>
<line class="f-linea" x1="240" y1="286" x2="240" y2="294"/>
<line class="f-linea" x1="285" y1="286" x2="285" y2="294"/>
<line class="f-linea" x1="330" y1="286" x2="330" y2="294"/>
<text class="f-s" x="60" y="308" text-anchor="middle" style="font-size:12px">0</text>
<text class="f-s" x="105" y="308" text-anchor="middle" style="font-size:12px">10</text>
<text class="f-s" x="150" y="308" text-anchor="middle" style="font-size:12px">20</text>
<text class="f-s" x="195" y="308" text-anchor="middle" style="font-size:12px">30</text>
<text class="f-s" x="240" y="308" text-anchor="middle" style="font-size:12px">40</text>
<text class="f-s" x="285" y="308" text-anchor="middle" style="font-size:12px">50</text>
<text class="f-s" x="330" y="308" text-anchor="middle" style="font-size:12px">60 s</text>

<rect class="f-chip" x="24" y="322" width="312" height="40" rx="10"/>
<text class="f-s" x="36" y="339" style="font-size:12px">Del 10 al 30 nadie trabaja en él: es el precio</text>
<text class="f-s" x="36" y="354" style="font-size:12px">del plazo. Solo el ack borra el mensaje.</text>
</svg>
