<text class="f-s" x="302" y="322" text-anchor="middle" style="font-size:12px">alreves.txt</text>
<path class="f-flecha" style="stroke:var(--b)" d="M210 288 H231 V313 H261"/>
<polygon style="fill:var(--b)" points="260,309 260,317 267,313"/>
<path class="f-flecha" style="stroke:var(--p)" d="M210 318 H245 V293 H261"/>
<polygon style="fill:var(--p)" points="260,289 260,297 267,293"/>
<circle class="f-b" cx="199" cy="288" r="11"/>
<text class="f-pill-t" x="199" y="293" text-anchor="middle" style="font:800 13px var(--sans)">1</text>
<circle class="f-p" cx="199" cy="318" r="11"/>
<text class="f-pill-t" x="199" y="323" text-anchor="middle" style="font:800 13px var(--sans)">2</text>
<text class="f-t" x="194" y="352" style="font-size:13px">Los errores siguen</text>
<text class="f-t" x="194" y="368" style="font-size:13px">en la pantalla.</text>
</svg>
