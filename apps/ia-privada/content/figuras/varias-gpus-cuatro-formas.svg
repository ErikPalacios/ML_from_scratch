<text class="f-s" x="28" y="166" style="font-size:12px">Modelo entero en cada una. No se pasan nada.</text>
<line x1="28" y1="178" x2="332" y2="178" style="stroke:var(--tm-line);stroke-width:1"/>
<text class="f-l" x="28" y="208">2 · TENSOR PARALLEL</text>
<rect class="f-chip" x="28" y="218" width="136" height="70" rx="6"/>
