<text class="f-s" x="197.8" y="208" style="font-size:12px">4.3</text>
<text class="f-t" x="14" y="242" style="font-size:14px">3 × L40S, INT4 de AWQ</text>
<text class="f-s" x="14" y="262" style="font-size:12px">12,000 sin fila</text>
