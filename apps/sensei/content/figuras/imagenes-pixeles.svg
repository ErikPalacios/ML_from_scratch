<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 488" role="img" aria-labelledby="f-imagenes-pixeles-t" class="f-svg" style="max-width:420px">
<title id="f-imagenes-pixeles-t">Una foto de unos tenis naranjas sobre fondo amarillo. Al acercarte a la orilla de la suela, la foto es una cuadrícula de 3 por 3 píxeles: naranjas, amarillos y azul marino. Cada píxel son tres números de 0 a 255: el naranja es R 236, G 106, B 63. Abajo, las tres cuadrículas de números, una por canal. Rojo: 236 236 232, 236 236 232, 14 14 232. Verde: 106 106 174, 106 106 174, 21 21 174. Azul: 63 63 54, 63 63 54, 48 48 54.</title>
