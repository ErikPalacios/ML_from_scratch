<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 610" role="img" aria-labelledby="f-varias-gpus-cuatro-formas-t" class="f-svg" style="max-width:420px">
<title id="f-varias-gpus-cuatro-formas-t">Cuatro formas de usar varias GPUs para servir un LLM. Réplicas: tres GPUs, cada una con el modelo entero de 64 capas; un balanceador reparte las preguntas y las GPUs no se pasan nada. Tensor parallel: dos GPUs, cada una con la mitad de cada una de las 64 capas; en cada capa se juntan dos veces con un all-reduce, 128 veces por token. Pipeline parallel: tres GPUs en fila con las capas 1 a 22, 23 a 43 y 44 a 64; entre una y otra pasa un solo vector por token. Expert parallel: cuatro GPUs con 32 de los 128 expertos de un MoE cada una; cada token viaja con un all-to-all a las GPUs de sus expertos.</title>
<rect class="f-card" x="10" y="10" width="340" height="590" rx="16"/>
<text class="f-l" x="28" y="38">1 · RÉPLICAS (DATA PARALLEL)</text>
<rect class="f-dark" x="120" y="48" width="120" height="24" rx="6"/><text class="f-dark-t" x="180" y="65" text-anchor="middle" style="font-size:13px">balanceador</text>
