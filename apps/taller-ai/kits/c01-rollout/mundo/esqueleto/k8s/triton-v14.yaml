# Triton de la versión 14 (resnet50-2026-10-01, @champion): lo que dejó la estación 9, con el nombre de su versión.
# Una release de classifier es un PAR: el gateway de esa versión más el Triton de esa versión. Cada versión del modelo
# corre en su propio Deployment (triton-v14) con su propio Service (triton-v14) y su PDB: nunca dos modelos detrás del
# mismo nombre. Es tuyo desde ahora; cámbialo solo cuando un paso lo pida (al final del bake, con un PR).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: triton-v14
  labels: {app.kubernetes.io/name: triton, classifier/modelo: "14"}
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: triton, classifier/modelo: "14"}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}   # nunca menos de 2 listos; el de más necesita una T4 libre
  progressDeadlineSeconds: 300      # sin avance en 5 min: el despliegue se marca fallido (no se revierte solo)
  revisionHistoryLimit: 5
  template:
    metadata:
      labels: {app.kubernetes.io/name: triton, classifier/modelo: "14"}
    spec:
      nodeSelector: {workload: gpu-t4}           # atraer: solo nodos con T4
      tolerations:                               # y aguantar su taint, que aleja a todos los demás
        - {key: nvidia.com/gpu, operator: Equal, value: present, effect: NoSchedule}
      topologySpreadConstraints:
        - maxSkew: 1                             # entre zonas, como mucho 1 Triton de diferencia
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule       # mejor Pending que dos en la misma zona
          labelSelector: {matchLabels: {app.kubernetes.io/name: triton, classifier/modelo: "14"}}
          matchLabelKeys: [pod-template-hash]    # cuenta solo los pods de la misma versión (si no, tras un cambio de versión pueden quedar dos en una zona)
      terminationGracePeriodSeconds: 60          # 10 de preStop + 30 de drenado + 20 de margen
      containers:
        - name: triton-v14
          image: classifier-triton-v14           # kustomize pone el registro y el digest (kustomization.yaml)
          ports: [{name: http, containerPort: 8000}]
          resources:
            requests: {cpu: "2", memory: 6Gi, nvidia.com/gpu: "1"}
            limits: {memory: 6Gi, nvidia.com/gpu: "1"}   # sin límite de CPU; la memoria, igual al request
          startupProbe:                          # 5 s × 12 = 60 s para cargar el engine (tarda ≈ 20 s)
            httpGet: {path: /v2/health/ready, port: http}
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:                        # ≈ 10 s sin estar listo y sale del reparto
            httpGet: {path: /v2/health/ready, port: http}
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:                         # ≈ 30 s sin contestar y se reinicia; solo pregunta por el proceso
            httpGet: {path: /v2/health/live, port: http}
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          lifecycle:
            preStop: {exec: {command: ["sleep", "10"]}}   # que los gateways dejen de mandarle antes de SIGTERM
          volumeMounts: [{name: shm, mountPath: /dev/shm}]
      volumes:
        - {name: shm, emptyDir: {medium: Memory, sizeLimit: 1Gi}}   # cuenta dentro de los 6 GiB
---
apiVersion: v1
kind: Service
metadata:
  name: triton-v14
  labels: {app.kubernetes.io/name: triton, classifier/modelo: "14"}
spec:
  selector: {app.kubernetes.io/name: triton, classifier/modelo: "14"}
  ports: [{name: http, port: 8000, targetPort: http}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: triton-v14
  labels: {app.kubernetes.io/name: triton, classifier/modelo: "14"}
spec:
  minAvailable: 1                                # con 2 pods, un drain a la vez; con 1 pod (en el bake), 0
  selector:
    matchLabels: {app.kubernetes.io/name: triton, classifier/modelo: "14"}
