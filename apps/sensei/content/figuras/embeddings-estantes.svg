<circle cx="170" cy="118" r="11" style="fill:none;stroke:var(--o);stroke-width:2.5;stroke-dasharray:4 3"/>
<path class="f-acc" d="M192.0,109.0 L194.7,116.3 L202.5,116.6 L196.4,121.4 L198.5,128.9 L192.0,124.6 L185.5,128.9 L187.6,121.4 L181.5,116.6 L189.3,116.3 Z"/>
