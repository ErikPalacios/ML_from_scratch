<rect class="f-p" x="260" y="343" width="44" height="5" rx="1.5"/>
<rect class="f-dark" x="128" y="276" width="104" height="94" rx="8"/>
<text class="f-dark-t" x="180" y="327" text-anchor="middle" style="font-size:14px;font-weight:700">GPU</text>
<text class="f-s" x="28" y="406" style="font-size:12px">5 pilas × 1,024 = 5,120 cables a ≈ 5.23 Gb/s</text>
<text class="f-t" x="28" y="426" style="font-size:13px">5,120 × 5.23 ÷ 8 ≈ 3,350 GB/s</text>
<text class="f-s" x="28" y="450" style="font-size:12px">20 veces más cables, a la mitad de velocidad:</text>
<text class="f-s" x="28" y="466" style="font-size:12px;font-weight:700">≈ 10 veces el ancho de banda.</text>
