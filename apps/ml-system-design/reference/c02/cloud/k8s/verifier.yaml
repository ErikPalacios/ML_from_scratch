# Verificador del caso c02 en EKS: el segundo filtro de la cascada. Lee los eventos candidatos de SQS
# (≈ 250/hora en toda la flota en el pico nocturno, est.), corre un detector más pesado a mayor resolución
# sobre las 3 fotos del evento y, si confirma, lo pasa al servicio de alertas del SOC.
# Recursos: ServiceAccount (IRSA) + Deployment en nodos L4 + PodDisruptionBudget + TriggerAuthentication
# y ScaledObject de KEDA (escala por mensajes en la cola). Namespace "c02": kubectl create namespace c02.
#
# Contrato del worker (su código no está en esta carpeta; su imagen sí se referencia aquí):
#   - long polling a SQS (WaitTimeSeconds=20), hasta 10 mensajes por ReceiveMessage → un lote en la GPU
#   - borra el mensaje SOLO después de escribir el veredicto; el veredicto es idempotente por event_id
#     (SQS estándar puede entregar dos veces: sin eso, el SOC vería la misma alerta dos veces)
#   - HTTP :8080 → /healthz (vivo), /readyz (modelo cargado), /metrics con
#     verifier_jobs_total{outcome="confirmed|rejected|error"} → alerta VerifierErrors
#   - si el verificador no está (0 pods listos), el servicio de alertas manda el candidato al SOC marcado
#     "sin verificar" pasado un tope de espera: degradar a más falsas alarmas, nunca a perder intrusiones.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: verifier
  namespace: c02
  annotations:
    # IRSA: el pod asume este rol IAM (sqs:ReceiveMessage/DeleteMessage/ChangeMessageVisibility en la cola,
    # s3:GetObject en el bucket de evidencia). Sin llaves de AWS en el pod ni en el YAML.
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/c02-verifier
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: verifier
  namespace: c02
  labels:
    app.kubernetes.io/name: verifier
    app.kubernetes.io/part-of: c02
spec:
  # Sin "replicas": las decide el HPA que crea KEDA (de 1 a 2). Si lo fijas aquí, cada apply pelea con él.
  revisionHistoryLimit: 5  # ReplicaSets viejos para `kubectl rollout undo` (rollback del modelo)
  progressDeadlineSeconds: 900  # un pod nuevo puede necesitar un nodo GPU nuevo: minutos, no segundos
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1  # primero sube el pod nuevo (otra L4) …
      maxUnavailable: 0  # … y solo entonces baja el viejo: nunca 0 verificadores durante un deploy
  selector:
    matchLabels:
      app.kubernetes.io/name: verifier
  template:
    metadata:
      labels:
        app.kubernetes.io/name: verifier
        app.kubernetes.io/part-of: c02
    spec:
      serviceAccountName: verifier
      # SIGTERM → deja de pedir mensajes y termina el lote en curso (< 5 s). Lo que no alcance a borrar
      # vuelve a la cola al vencer el visibility timeout (30 s) y lo toma otro pod: tarde, pero no se pierde.
      terminationGracePeriodSeconds: 60
      nodeSelector:
        workload: gpu-l4  # node group de g6.xlarge (1× L4, 24 GB): el engine se compiló para sm_89
      tolerations:
        # Los nodos GPU tienen taint para que nada que no use GPU ocupe una máquina de ≈ US$0.80/h
        - key: nvidia.com/gpu
          operator: Equal
          value: present
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: verifier
          # Tag = versión del modelo del verificador. Rollback = volver al tag anterior.
          image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/c02-verifier:2026-09-01-det-l-fp16
          env:
            - name: SQS_QUEUE_URL
              value: https://sqs.us-east-1.amazonaws.com/123456789012/c02-candidate-events
            - name: EVIDENCE_BUCKET
              value: c02-evidence  # fotos y clips; lifecycle de 30 días
            - name: ALERT_SERVICE_URL
              value: http://alert-service.c02.svc.cluster.local:8080
            - name: AWS_REGION
              value: us-east-1
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: "2"  # decodificar 3 JPEG por evento y hablar con SQS/S3
              memory: 8Gi  # g6.xlarge tiene 16 GiB: el resto para el sistema y el device plugin
              nvidia.com/gpu: 1  # una L4 entera por pod
            limits:
              memory: 8Gi  # = request: pasarse es un OOMKilled claro, no un vecino lento
              nvidia.com/gpu: 1  # las GPUs no se sobreasignan: request = limit
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Cargar el engine TensorRT tarda: mientras no pase el startup, el kubelet no evalúa liveness
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 60  # hasta 5 min
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz  # solo "el proceso responde": SQS caído no se arregla reiniciando
              port: http
            periodSeconds: 15
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp  # el root filesystem es de solo lectura; las fotos descargadas van aquí
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
---
# TRAMPA con 1 réplica: minAvailable 1 BLOQUEA las evicciones voluntarias (drain de nodos, upgrades del
# node group, consolidación de Karpenter) mientras solo haya 1 pod. Es a propósito: ningún mantenimiento
# deja a la flota sin verificador sin que alguien lo decida. Procedimiento: sube minReplicaCount a 2 en el
# ScaledObject, espera la segunda réplica Ready, drena, y vuelve a 1. No protege de fallas involuntarias
# (un nodo que muere): eso lo cubren la cola, que espera, y la degradación a "sin verificar".
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: verifier
  namespace: c02
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: verifier
---
# Credenciales del scaler: el rol IAM (IRSA) del operador de KEDA, que necesita sqs:GetQueueAttributes.
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: aws-pod-identity
  namespace: c02
spec:
  podIdentity:
    provider: aws
---
# KEDA crea y administra el HPA (keda-hpa-verifier): no definas otro HPA para este Deployment.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: verifier
  namespace: c02
spec:
  scaleTargetRef:
    name: verifier  # Deployment de arriba
  # Siempre 1 encendido: un cold start (nodo GPU + imagen + engine) son minutos y el SLO es de 5 s.
  # Escríbelo aunque parezca obvio: el default de KEDA es 0.
  minReplicaCount: 1
  maxReplicaCount: 2  # techo de costo: 2 × g6.xlarge ≈ US$1,175/mes on-demand (est., verifica)
  pollingInterval: 10  # cada 10 s KEDA pregunta a SQS (GetQueueAttributes: casi en tiempo real)
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300  # la segunda L4 se queda 5 min: evita subir y bajar cada ráfaga
  triggers:
    - type: aws-sqs-queue
      authenticationRef:
        name: aws-pod-identity
      metadata:
        queueURL: https://sqs.us-east-1.amazonaws.com/123456789012/c02-candidate-events
        awsRegion: us-east-1
        # Mensajes por réplica (AverageValue): réplicas = ceil(mensajes / 4). Sale del presupuesto:
        # ≈ 1 s de espera en cola dentro del SLO de 5 s ÷ ≈ 0.25 s por evento (est.: mídelo) ≈ 4.
        # Nota honesta: la segunda réplica llega en minutos (nodo GPU nuevo). Sirve para carga SOSTENIDA
        # (p. ej. una tormenta que dispara falsos candidatos en varios sitios), no para salvar una ráfaga
        # de 30 s; para eso está el lote de hasta 10 mensajes por llamada del worker.
        queueLength: "4"
        # Cuenta visibles + en proceso (default): el lote que un pod ya tomó sigue contando como carga.
        # Sin eso, en cuanto los pods reciben los mensajes la cola "se vacía" y KEDA bajaría la segunda
        # réplica a mitad del trabajo.
        scaleOnInFlight: "true"
        # El trigger de SQS escala por PROFUNDIDAD: no tiene modo "edad del mensaje más viejo". La edad es
        # lo que promete el SLO, así que vive en la alerta EventBacklogHigh (cloud/monitoring/alerts.yml).
