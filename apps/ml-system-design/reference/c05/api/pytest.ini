# Configuración de pytest de docs-api: sin AWS (fakes y moto), sin red
[pytest]
# api/ y pipeline/ entran al sys.path: main.py importa quality y cfdi igual que en la imagen
pythonpath = . ../pipeline
# Solo buscamos tests en tests/
testpaths = tests
# Salida compacta: en CI importa la lista de fallos
addopts = -q
