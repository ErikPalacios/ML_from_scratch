<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 478" role="img" aria-labelledby="f-e11-request-tres-miradas-t" class="f-svg" style="max-width:420px">
<title id="f-e11-request-tres-miradas-t">Tres maneras de mirar el mismo tráfico. Arriba, métricas: una curva de la tasa de errores en el tiempo que sube a las 14:05, sin nombres de requests. En medio, logs: tres filas, una por request, con su id, su código, sus milisegundos y su categoría; la de 504 resaltada. Abajo, una traza: barras de tiempo de una sola request de 20 ms, con el preproceso de 6 ms y la llamada a Triton de 10 ms, que adentro tiene la fila de 2 ms y el cálculo en la T4 de 4 ms.</title>
<rect class="f-card" x="10" y="10" width="340" height="142" rx="10"/>
<text class="f-l" x="24" y="32">MÉTRICAS · ¿CUÁNTO Y DESDE CUÁNDO?</text>
<line class="f-linea" x1="34" y1="128" x2="334" y2="128"/>
<line class="f-linea" x1="34" y1="44" x2="34" y2="128"/>
<polyline points="34,112 64,110 94,113 124,109 154,111 184,108 214,78 244,62 274,66 304,64 334,65" fill="none" style="stroke:var(--o);stroke-width:2.5"/>
<text class="f-s" x="214" y="56" text-anchor="end" style="font-size:12px">14:05: sube</text>
<text class="f-s" x="40" y="146" style="font-size:12px">tasa de 5xx en el tiempo: una suma, sin nombres</text>
<rect class="f-card" x="10" y="164" width="340" height="142" rx="10"/>
<text class="f-l" x="24" y="186">LOGS · ¿QUÉ PASÓ CON ESTA?</text>
<rect class="f-chip" x="22" y="204" width="316" height="22" rx="4"/>
