# Configuración de pytest para TODO el caso c09: `cd reference/c09 && pytest` corre las 3 carpetas.
# Sin Redis, sin Kafka, sin Flink: los servicios externos están detrás de interfaces con fakes.
[pytest]
# Cada carpeta entra al sys.path: los tests importan `definitions`, `online_counters`, `service`,
# `policy`, `choose_thresholds`… como módulos sueltos (scoring/ importa features/ igual que en la imagen)
pythonpath = features scoring eval
testpaths = features/tests scoring/tests eval/tests
# Salida compacta: en CI importa la lista de fallos
addopts = -q
