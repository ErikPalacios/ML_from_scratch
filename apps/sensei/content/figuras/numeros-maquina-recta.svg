<text class="f-s" x="332.0" y="258.0" text-anchor="end" style="font-size:12px">cada 2</text>
<rect class="f-chip" x="24.0" y="280.0" width="312.0" height="76.0" rx="10"/>
<text class="f-t" x="38.0" y="303.0" style="font-size:13px">La separación se duplica en cada tramo,</text>
<text class="f-s" x="38.0" y="322.0" style="font-size:12px">pero ningún número queda a más de 12.5 % del real.</text>
<text class="f-s" x="38.0" y="340.0" style="font-size:12px">FP16 tiene 1,024 por tramo; FP32, 8,388,608.</text>
