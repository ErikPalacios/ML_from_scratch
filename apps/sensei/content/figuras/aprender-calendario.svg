<title id="f-aprender-calendario-t">Un calendario de learning rate de ejemplo, en 10,000 pasos. Durante los primeros 500 pasos, el warmup sube el learning rate en línea recta de 0 a 0.0003. Después, un coseno lo baja suave: en el paso 5,250, a medio camino del coseno, vale 0.00015, y en el paso 10,000 llega a 0. Una línea punteada muestra, para comparar, un learning rate fijo de 0.0003 todo el tiempo.</title>
