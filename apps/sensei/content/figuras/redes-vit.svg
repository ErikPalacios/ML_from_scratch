<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 460" role="img" aria-labelledby="f-redes-vit-t" class="f-svg" style="max-width:420px">
<title id="f-redes-vit-t">Cómo lee una foto un ViT-B/16. La foto de 224 por 224 píxeles se parte en una cuadrícula de 14 por 14, 196 parches. Un parche marcado en amarillo se amplía: 16 por 16 píxeles por 3 colores, 768 números, que una capa densa de 768 a 768 convierte en un token. Abajo, la fila de tokens: CLS, 1, 2, 3 y así hasta 196, en total 197 tokens de 768 números, entra a un transformer de 12 bloques donde cada parche mira a todos. La respuesta sale del token CLS.</title>
<rect class="f-card" x="10" y="10" width="340" height="440" rx="16"/>
<text class="f-l" x="28" y="36">UN VIT-B/16 LEE LA FOTO EN PARCHES</text>
<rect class="f-chip" x="28" y="52" width="154" height="154" rx="4"/>
<ellipse class="f-o" cx="108" cy="150" rx="58" ry="30" style="opacity:.55"/>
<ellipse class="f-o" cx="80" cy="132" rx="26" ry="22" style="opacity:.55"/>
