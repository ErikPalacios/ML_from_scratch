<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 404" role="img" aria-labelledby="f-modelo-sigmoide-t" class="f-svg" style="max-width:420px">
<title id="f-modelo-sigmoide-t">La sigmoide, p = 1 entre 1 más e a la menos z, dibujada para logits z de menos 6 a 6. Es una curva en forma de S que va de casi 0 a casi 100 por ciento. Con z = −2 da 11.9 %, con z = 0 da 50 % y con z = 2 da 88.1 %. Un umbral de 0.5 corta la curva en z = 0: a la izquierda la decisión es «no» y a la derecha «sí». Un umbral de 0.9 la corta en z = 2.2.</title>
<rect class="f-card" x="10" y="10" width="340" height="384" rx="16"/>
<text class="f-l" x="28" y="38">LA SIGMOIDE</text>
<text class="f-t" x="332" y="39" text-anchor="end" style="font-size:13px">p = 1 ÷ (1 + e^(−z))</text>
<line x1="52" y1="270.0" x2="332" y2="270.0" style="stroke:var(--muted);stroke-width:1.5"/>
<text class="f-s" x="46" y="274.0" text-anchor="end" style="font-size:12px">0 %</text>
<line x1="52" y1="170.0" x2="332" y2="170.0" style="stroke:var(--rule);stroke-width:1"/>
<text class="f-s" x="46" y="174.0" text-anchor="end" style="font-size:12px">50 %</text>
<line x1="52" y1="70.0" x2="332" y2="70.0" style="stroke:var(--rule);stroke-width:1"/>
<text class="f-s" x="46" y="74.0" text-anchor="end" style="font-size:12px">100 %</text>
<line x1="52.0" y1="270" x2="52.0" y2="275" style="stroke:var(--muted);stroke-width:1.5"/>
<text class="f-s" x="52.0" y="290" text-anchor="middle" style="font-size:12px">−6</text>
<line x1="98.7" y1="270" x2="98.7" y2="275" style="stroke:var(--muted);stroke-width:1.5"/>
<text class="f-s" x="98.7" y="290" text-anchor="middle" style="font-size:12px">−4</text>
<line x1="145.3" y1="270" x2="145.3" y2="275" style="stroke:var(--muted);stroke-width:1.5"/>
<text class="f-s" x="145.3" y="290" text-anchor="middle" style="font-size:12px">−2</text>
<line x1="192.0" y1="270" x2="192.0" y2="275" style="stroke:var(--muted);stroke-width:1.5"/>
<text class="f-s" x="192.0" y="290" text-anchor="middle" style="font-size:12px">0</text>
<line x1="238.7" y1="270" x2="238.7" y2="275" style="stroke:var(--muted);stroke-width:1.5"/>
<text class="f-s" x="238.7" y="290" text-anchor="middle" style="font-size:12px">2</text>
<line x1="285.3" y1="270" x2="285.3" y2="275" style="stroke:var(--muted);stroke-width:1.5"/>
<text class="f-s" x="285.3" y="290" text-anchor="middle" style="font-size:12px">4</text>
<line x1="332.0" y1="270" x2="332.0" y2="275" style="stroke:var(--muted);stroke-width:1.5"/>
<text class="f-s" x="332.0" y="290" text-anchor="middle" style="font-size:12px">6</text>
<line x1="52" y1="90.0" x2="243.3" y2="90.0" style="stroke:var(--p);stroke-width:2;stroke-dasharray:5 4"/>
<line x1="243.3" y1="90.0" x2="243.3" y2="270" style="stroke:var(--p);stroke-width:1.5;stroke-dasharray:2 4"/>
<text class="f-s" x="58" y="83.0" style="font-size:12px;fill:var(--p);font-weight:700">umbral 0.9 → z ≥ 2.2</text>
<line x1="52" y1="170.0" x2="332" y2="170.0" style="stroke:var(--o);stroke-width:2;stroke-dasharray:6 4"/>
<text class="f-s" x="332" y="163.0" text-anchor="end" style="font-size:12px;fill:var(--o);font-weight:700">umbral 0.5</text>
