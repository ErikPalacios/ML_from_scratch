<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 350" role="img" aria-labelledby="f-cotizar-nueves-t" class="f-svg" style="max-width:420px">
<title id="f-cotizar-nueves-t">Minutos de caída permitidos al mes con cada disponibilidad. En el horario del despacho (10 horas por 22 días, 13,200 minutos): 99 % permite 132 minutos, 99.5 % 66, 99.9 % 13.2 y 99.95 % 6.6. En 24 por 7 (43,200 minutos): 432, 216, 43.2 y 21.6. Una línea punteada marca 240 minutos, una mañana de 4 horas sin servidor, que es más que cualquier presupuesto en horario.</title>
<rect class="f-card" x="10" y="10" width="340" height="330" rx="16"/>
<text class="f-l" x="26" y="36">MINUTOS DE CAÍDA PERMITIDOS AL MES</text>
<rect class="f-b" x="26" y="48" width="14" height="12" rx="3"/><text class="f-s" x="46" y="59">horario 10 h × 22 días</text>
<rect class="f-b2" x="200" y="48" width="14" height="12" rx="3"/><text class="f-s" x="220" y="59">24 × 7</text>
<line class="f-linea" x1="164.9" y1="70" x2="164.9" y2="292" style="stroke-dasharray:4 4;stroke-width:2"/>
<text class="f-s" x="26" y="86" style="font-weight:700">99 %</text>
<rect class="f-b" x="26" y="92" width="76.4" height="12" rx="3"/>
<text class="f-s" x="108.4" y="103">132 min</text>
<rect class="f-b2" x="26" y="108" width="250.0" height="12" rx="3"/>
<text class="f-s" x="282.0" y="119">432 min</text>
<text class="f-s" x="26" y="140" style="font-weight:700">99.5 %</text>
<rect class="f-b" x="26" y="146" width="38.2" height="12" rx="3"/>
<text class="f-s" x="70.2" y="157">66 min</text>
<rect class="f-b2" x="26" y="162" width="125.0" height="12" rx="3"/>
<text class="f-s" x="170.9" y="173">216 min</text>
<text class="f-s" x="26" y="194" style="font-weight:700">99.9 %</text>
<rect class="f-b" x="26" y="200" width="7.6" height="12" rx="3"/>
<text class="f-s" x="39.6" y="211">13.2 min</text>
<rect class="f-b2" x="26" y="216" width="25.0" height="12" rx="3"/>
<text class="f-s" x="57.0" y="227">43.2 min</text>
<text class="f-s" x="26" y="248" style="font-weight:700">99.95 %</text>
<rect class="f-b" x="26" y="254" width="3.8" height="12" rx="3"/>
<text class="f-s" x="35.8" y="265">6.6 min</text>
<rect class="f-b2" x="26" y="270" width="12.5" height="12" rx="3"/>
<text class="f-s" x="44.5" y="281">21.6 min</text>
<text class="f-s" x="164.9" y="312" text-anchor="middle" style="font-weight:700">una mañana sin servidor: 240 min</text>
<text class="f-s" x="26" y="332" style="font-size:12px">Cada nueve de más divide los minutos entre diez.</text>
</svg>
