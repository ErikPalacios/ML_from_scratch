<text class="f-s" x="238" y="220" style="font-size:12px;font-family:var(--mono)">Tenis 0.94</text>
<rect class="f-o" x="22" y="230" width="316" height="22" rx="4"/>
<text class="f-s" x="30" y="246" style="font-size:12px;font-family:var(--mono)">9f2c41d0</text>
