<text class="f-s" x="140" y="68">Cuatro píxeles en gris:</text>
<text class="f-s" x="140" y="87">0 es negro y 240, casi</text>
<text class="f-s" x="140" y="106">blanco. Para llegar a</text>
<text class="f-s" x="140" y="125">4 × 4 hay que inventar 12.</text>
