<title id="f-stack-serving-offload-t">Llama 3.3 70B en Q4_K_M, unos 43.1 GB en 80 capas, repartido con llama.cpp: 40 capas, 21.6 GB, en la VRAM de una RTX 4090, y 40 capas, 21.6 GB, en la RAM de la computadora. Abajo, el tiempo de un token: el pedazo de la GPU tarda unos 31 milisegundos y el de la RAM unos 344, en total unos 374 milisegundos, 2.7 tokens por segundo. Si todo cupiera en una GPU con ese ancho de banda serían unos 61 milisegundos, 16 tokens por segundo. La mitad de los pesos en la RAM se lleva el 92 por ciento del tiempo.</title>
