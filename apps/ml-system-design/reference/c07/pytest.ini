# Configuración de pytest para TODO el caso c07: `cd reference/c07 && pytest` corre las 3 carpetas.
# Sin GPU, sin Kafka, sin OpenSearch: los servicios externos están detrás de interfaces con fakes.
[pytest]
# Cada carpeta entra al sys.path: los tests importan `embed_worker`, `build_index`, `api`, `fusion` y
# `offline_eval` igual que en la imagen (donde cada archivo queda junto a los demás de su servicio)
pythonpath = indexing search eval
testpaths = indexing/tests search/tests eval/tests
# Salida compacta: en CI importa la lista de fallos
addopts = -q
