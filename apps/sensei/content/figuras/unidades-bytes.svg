<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 560" role="img" aria-labelledby="f-unidades-bytes-t" class="f-svg" style="max-width:420px">
<title id="f-unidades-bytes-t">Una regla de tamaños en potencias de diez, de 1 byte arriba a 1 petabyte abajo; cada marca vale 10 veces la anterior y cada prefijo nuevo, kilo, mega, giga, tera y peta, vale mil veces el anterior. Junto a la regla: 1 byte es un canal de un píxel en uint8; 4 bytes, un número en float32; unos 300 bytes, el log de una predicción; unos 3 KB, un embedding de 768 números; unos 200 KB, la foto JPEG de Ana, y 602 KB la misma foto como tensor; unos 98 MB, la ResNet-50 de Alba; 3 GB, los logs de un día de Alba; 16 GB, la memoria de una GPU T4; unos 205 GB, el índice de búsqueda de Alba; 1.1 TB, un año de logs de Alba; unos 180 TB, un mes de tensores viajando por la red de Alba; y unos 1.7 PB, un mes de audio de un servicio de subtítulos en vivo.</title>
<rect class="f-card" x="10" y="10" width="340" height="540" rx="16"/>
<text class="f-l" x="28" y="36">DE 1 BYTE A 1 PETABYTE</text>
<text class="f-s" x="28" y="56" style="font-size:12px">cada marca, × 10 · cada prefijo nuevo, × 1,000</text>
<line class="f-linea" x1="92" y1="78" x2="92" y2="505.1"/>
<line class="f-linea" x1="84" y1="86" x2="100" y2="86"/>
<text class="f-l" x="78" y="90" text-anchor="end" style="fill:var(--ink)">1 B</text>
<line class="f-linea" x1="87" y1="113" x2="97" y2="113"/>
<text class="f-l" x="78" y="117" text-anchor="end">10 B</text>
<line class="f-linea" x1="87" y1="140" x2="97" y2="140"/>
<text class="f-l" x="78" y="144" text-anchor="end">100 B</text>
<line class="f-linea" x1="84" y1="167" x2="100" y2="167"/>
<text class="f-l" x="78" y="171" text-anchor="end" style="fill:var(--ink)">1 KB</text>
<line class="f-linea" x1="87" y1="194" x2="97" y2="194"/>
<text class="f-l" x="78" y="198" text-anchor="end">10 KB</text>
<line class="f-linea" x1="87" y1="221" x2="97" y2="221"/>
<text class="f-l" x="78" y="225" text-anchor="end">100 KB</text>
<line class="f-linea" x1="84" y1="248" x2="100" y2="248"/>
<text class="f-l" x="78" y="252" text-anchor="end" style="fill:var(--ink)">1 MB</text>
<line class="f-linea" x1="87" y1="275" x2="97" y2="275"/>
<text class="f-l" x="78" y="279" text-anchor="end">10 MB</text>
<line class="f-linea" x1="87" y1="302" x2="97" y2="302"/>
<text class="f-l" x="78" y="306" text-anchor="end">100 MB</text>
<line class="f-linea" x1="84" y1="329" x2="100" y2="329"/>
<text class="f-l" x="78" y="333" text-anchor="end" style="fill:var(--ink)">1 GB</text>
<line class="f-linea" x1="87" y1="356" x2="97" y2="356"/>
<text class="f-l" x="78" y="360" text-anchor="end">10 GB</text>
<line class="f-linea" x1="87" y1="383" x2="97" y2="383"/>
<text class="f-l" x="78" y="387" text-anchor="end">100 GB</text>
<line class="f-linea" x1="84" y1="410" x2="100" y2="410"/>
<text class="f-l" x="78" y="414" text-anchor="end" style="fill:var(--ink)">1 TB</text>
<line class="f-linea" x1="87" y1="437" x2="97" y2="437"/>
<text class="f-l" x="78" y="441" text-anchor="end">10 TB</text>
<line class="f-linea" x1="87" y1="464" x2="97" y2="464"/>
<text class="f-l" x="78" y="468" text-anchor="end">100 TB</text>
<line class="f-linea" x1="84" y1="491" x2="100" y2="491"/>
<text class="f-l" x="78" y="495" text-anchor="end" style="fill:var(--ink)">1 PB</text>
<circle class="f-g" cx="92" cy="86" r="5"/>
<text class="f-s" x="108" y="90.5">1 B: un canal de un píxel (uint8)</text>
<circle class="f-g" cx="92" cy="102.3" r="5"/>
<text class="f-s" x="108" y="110.8">4 B: un número en float32</text>
<circle class="f-y" cx="92" cy="152.9" r="5"/>
<text class="f-s" x="108" y="157.4">≈ 300 B: el log de una predicción</text>
<circle class="f-p" cx="92" cy="180.2" r="5"/>
<text class="f-s" x="108" y="184.7">≈ 3 KB: un embedding de 768 números</text>
<circle class="f-b" cx="92" cy="229.1" r="5"/>
<text class="f-s" x="108" y="230.6">≈ 200 KB: la foto JPEG de Ana</text>
<circle class="f-b" cx="92" cy="242.1" r="5"/>
<text class="f-s" x="108" y="249.6">602 KB: la misma foto como tensor</text>
<circle class="f-o" cx="92" cy="301.8" r="5"/>
<text class="f-s" x="108" y="306.3">≈ 98 MB: la ResNet-50 de Alba</text>
<circle class="f-y" cx="92" cy="341.9" r="5"/>
<text class="f-s" x="108" y="344.4">3 GB: los logs de un día de Alba</text>
<circle class="f-o" cx="92" cy="361.5" r="5"/>
<text class="f-s" x="108" y="368">16 GB: la VRAM de una T4</text>
<circle class="f-p" cx="92" cy="391.4" r="5"/>
<text class="f-s" x="108" y="395.9">≈ 205 GB: el índice de búsqueda</text>
<circle class="f-y" cx="92" cy="411.1" r="5"/>
<text class="f-s" x="108" y="415.6">1.1 TB: un año de logs de Alba</text>
<circle class="f-b" cx="92" cy="470.9" r="5"/>
<text class="f-s" x="108" y="475.4">≈ 180 TB: un mes de tensores de Alba</text>
<circle class="f-p" cx="92" cy="497.2" r="5"/>
<text class="f-s" x="108" y="501.7">≈ 1.7 PB: un mes de audio en vivo</text>
</svg>
