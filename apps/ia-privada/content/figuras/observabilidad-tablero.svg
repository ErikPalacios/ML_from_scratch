<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 372" role="img" aria-labelledby="f-observabilidad-tablero-t" class="f-svg" style="max-width:420px">
<title id="f-observabilidad-tablero-t">El tablero propuesto para el despacho, con 8 paneles en dos columnas y en el orden en que se leen. Lo que siente el abogado: 1, preguntas por minuto y errores, con un pico de unas 12.5 por minuto; 2, el TTFT p95 con una línea en el objetivo; 3, la latencia entre tokens p95 con una línea en 50 milisegundos. El motor: 4, conversaciones en curso por réplica con líneas en 2 y en 8, y la fila; 5, el KV cache con una línea en 90 por ciento y las preemptions. Lo que lo explica: 6, la GPU por tarjeta, con potencia, temperatura y reloj; 7, la búsqueda, con una línea en 150 milisegundos; 8, réplicas vivas y disco libre, con una caída momentánea a 2 réplicas. Las curvas son ilustrativas.</title>
<text class="f-l" x="12" y="18">EL TABLERO DEL DESPACHO · 8 PANELES</text>
<rect class="f-b" x="12" y="28" width="10" height="10" rx="2"/><text class="f-s" x="27" y="37" style="font-size:12px">lo que siente el abogado</text>
<rect class="f-y" x="182" y="28" width="10" height="10" rx="2"/><text class="f-s" x="197" y="37" style="font-size:12px">el motor</text>
<rect class="f-g" x="262" y="28" width="10" height="10" rx="2"/><text class="f-s" x="277" y="37" style="font-size:12px">la causa</text>
