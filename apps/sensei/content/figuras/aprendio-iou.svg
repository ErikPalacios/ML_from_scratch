<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 456" role="img" aria-labelledby="f-aprendio-iou-t" class="f-svg" style="max-width:420px">
<title id="f-aprendio-iou-t">IoU de dos cajas sobre una foto. La caja real, que dibujó una persona, va de x 40 a 140 y de y 20 a 220 píxeles: 100 por 200. La caja del modelo es del mismo tamaño pero está corrida 20 píxeles a la derecha y 20 hacia abajo. Comparten un rectángulo de 80 por 180, que son 14,400 píxeles cuadrados. Juntas cubren 20,000 más 20,000 menos 14,400: 25,600. La IoU es 14,400 entre 25,600, unos 0.56, y pasa la regla clásica de 0.5.</title>
<rect class="f-card" x="10" y="10" width="340" height="436" rx="16"/>
<text class="f-l" x="28" y="36">UNA FOTO · CAJAS EN PÍXELES</text>
<rect class="f-chip" x="44.0" y="66.0" width="160" height="208" rx="6"/>
<text class="f-s" x="44" y="58" text-anchor="middle" style="font-size:12px">0</text>
<text class="f-s" x="38" y="70" text-anchor="end" style="font-size:12px">0</text>
<text class="f-s" x="124" y="58" text-anchor="middle" style="font-size:12px">100</text>
<text class="f-s" x="38" y="150" text-anchor="end" style="font-size:12px">100</text>
<text class="f-s" x="204" y="58" text-anchor="middle" style="font-size:12px">200</text>
<text class="f-s" x="38" y="230" text-anchor="end" style="font-size:12px">200</text>
<rect x="92" y="98" width="64" height="144" style="fill:var(--y);opacity:.5"/>
<rect x="76" y="82" width="80" height="160" style="fill:none;stroke:var(--g);stroke-width:3"/>
<rect x="92" y="98" width="80" height="160" style="fill:none;stroke:var(--b);stroke-width:3;stroke-dasharray:7 4"/>
<line x1="222" y1="96" x2="242" y2="96" style="stroke:var(--g);stroke-width:3"/>
<text class="f-t" x="250" y="101" style="font-size:13px">Caja real</text>
<text class="f-s" x="250" y="118" style="font-size:12px">100 × 200</text>
<line x1="222" y1="150" x2="242" y2="150" style="stroke:var(--b);stroke-width:3;stroke-dasharray:7 4"/>
<text class="f-t" x="250" y="155" style="font-size:13px">Del modelo</text>
<text class="f-s" x="250" y="172" style="font-size:12px">100 × 200</text>
<rect x="222" y="196" width="20" height="14" rx="3" style="fill:var(--y);opacity:.5"/>
<text class="f-t" x="250" y="208" style="font-size:13px">Comparten</text>
<text class="f-s" x="250" y="225" style="font-size:12px">80 × 180</text>
<text class="f-s" x="222" y="248" style="font-size:12px">corrida 20 px</text>
<text class="f-s" x="222" y="264" style="font-size:12px">a la derecha y</text>
<text class="f-s" x="222" y="280" style="font-size:12px">20 hacia abajo</text>
<line x1="28" y1="296" x2="332" y2="296" style="stroke:var(--tm-line);stroke-width:1.5"/>
<text class="f-t" x="28" y="324" style="font-size:13px">Comparten</text><text class="f-s" x="112" y="324">80 × 180</text><text class="f-t" x="332" y="324" text-anchor="end" style="font-size:13px">14,400</text>
<text class="f-t" x="28" y="350" style="font-size:13px">Unión</text><text class="f-s" x="112" y="350">20,000 + 20,000 − 14,400</text><text class="f-t" x="332" y="350" text-anchor="end" style="font-size:13px">25,600</text>
<text class="f-t" x="28" y="376" style="font-size:13px">IoU</text><text class="f-s" x="112" y="376">14,400 / 25,600</text><text class="f-t" x="332" y="376" text-anchor="end" style="font-size:13px">≈ 0.56</text>
<rect class="f-chip" x="28" y="392" width="304" height="40" rx="10"/>
<text class="f-s" x="40" y="417" style="font-size:12px">Pasa la regla clásica de IoU ≥ 0.5 por poco.</text>
</svg>
