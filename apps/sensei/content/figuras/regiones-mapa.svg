<rect class="f-b" x="82" y="94" width="30" height="26" rx="5"/><text class="f-pill-t" x="97" y="112" text-anchor="middle" style="font-size:12px">CD</text>
<text class="f-s" x="78" y="140" text-anchor="middle" style="font-size:12px">luz y red</text>
<text class="f-s" x="78" y="155" text-anchor="middle" style="font-size:12px">propias</text>
<line class="f-flecha" x1="78" y1="166" x2="78" y2="184"/>
<rect class="f-card" x="136" y="62" width="88" height="104" rx="10"/>
<text class="f-t" x="180" y="83" text-anchor="middle" style="font-size:13px">us-east-1b</text>
<rect class="f-b" x="146" y="94" width="30" height="26" rx="5"/><text class="f-pill-t" x="161" y="112" text-anchor="middle" style="font-size:12px">CD</text>
<rect class="f-b" x="184" y="94" width="30" height="26" rx="5"/><text class="f-pill-t" x="199" y="112" text-anchor="middle" style="font-size:12px">CD</text>
<text class="f-s" x="180" y="140" text-anchor="middle" style="font-size:12px">luz y red</text>
<text class="f-s" x="180" y="155" text-anchor="middle" style="font-size:12px">propias</text>
<line class="f-flecha" x1="180" y1="166" x2="180" y2="184"/>
