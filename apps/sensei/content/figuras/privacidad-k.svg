<rect class="f-p" x="20" y="380" width="6" height="56" rx="3"/>
<text class="f-t" x="36" y="402" style="font-size:14px">067** · 30 a 39</text>
<text class="f-s" x="36" y="424">gripa · asma · gripa</text>
<text class="f-l" x="240" y="402" text-anchor="end">3</text>
<rect class="f-chip" x="20" y="444" width="230" height="56" rx="10"/>
<rect class="f-g" x="20" y="444" width="6" height="56" rx="3"/>
