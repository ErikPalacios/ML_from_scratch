<rect class="f-b" x="248" y="94" width="30" height="26" rx="5"/><text class="f-pill-t" x="263" y="112" text-anchor="middle" style="font-size:12px">CD</text>
<rect class="f-b" x="286" y="94" width="30" height="26" rx="5"/><text class="f-pill-t" x="301" y="112" text-anchor="middle" style="font-size:12px">CD</text>
<text class="f-s" x="282" y="140" text-anchor="middle" style="font-size:12px">luz y red</text>
<text class="f-s" x="282" y="155" text-anchor="middle" style="font-size:12px">propias</text>
<line class="f-flecha" x1="282" y1="166" x2="282" y2="184"/>
