<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 412" role="img" aria-labelledby="f-tiempo-hash-anillo-t" class="f-svg" style="max-width:420px">
<title id="f-tiempo-hash-anillo-t">El hashing consistente como un anillo. Cuatro máquinas, A, B, C y D, están en puntos del círculo, y diez llaves son puntos chicos sobre el mismo círculo. Cada llave va a la primera máquina que encuentra caminando en el sentido del reloj. Se agrega una máquina nueva, E, entre A y B. Solo las dos llaves del arco naranja, entre A y E, cambian de dueño: antes iban a B y ahora van a E. Todas las demás se quedan con su máquina. De 4 a 5 máquinas, mod N movería el 80 por ciento de las llaves; el anillo mueve cerca del 20 por ciento.</title>
<rect class="f-card" x="10" y="10" width="340" height="392" rx="16"/>
<text class="f-l" x="26" y="34">EL ANILLO DE HASHES</text>
<path d="M125,64.7 A110 110 0 0 1 170.4,50.4" class="f-flecha"/>
<path class="f-punta" d="M179,49.6 L169.6,45 L170.8,55.4 Z"/>
<circle class="f-linea" cx="180" cy="160" r="90"/>
<path d="M203.3,73.1 A90 90 0 0 1 264.6,129.2" style="fill:none;stroke:var(--o);stroke-width:8;stroke-linecap:round;opacity:.35"/>
<circle class="f-b" cx="180" cy="70" r="4.5"/>
<circle class="f-b" cx="149.2" cy="75.4" r="4.5"/>
<circle class="f-b" cx="122.1" cy="91.1" r="4.5"/>
<circle class="f-b" cx="91.4" cy="175.6" r="4.5"/>
<circle class="f-b" cx="111.1" cy="217.9" r="4.5"/>
<circle class="f-b" cx="187.8" cy="249.7" r="4.5"/>
<circle class="f-b" cx="225" cy="237.9" r="4.5"/>
<circle class="f-b" cx="269.9" cy="163.1" r="4.5"/>
<circle class="f-o" cx="231.6" cy="86.3" r="6" style="stroke:var(--surface);stroke-width:2"/>
<circle class="f-o" cx="250.9" cy="104.6" r="6" style="stroke:var(--surface);stroke-width:2"/>
<circle class="f-dark" cx="203.3" cy="73.1" r="14"/>
<text class="f-dark-t" x="203.3" y="78" text-anchor="middle" style="font-size:14px;font-weight:800">A</text>
<circle class="f-dark" cx="261.6" cy="198.1" r="14"/>
<text class="f-dark-t" x="261.6" y="203" text-anchor="middle" style="font-size:14px;font-weight:800">B</text>
<circle class="f-dark" cx="149.2" cy="244.6" r="14"/>
<text class="f-dark-t" x="149.2" y="249.5" text-anchor="middle" style="font-size:14px;font-weight:800">C</text>
<circle class="f-dark" cx="95.4" cy="129.2" r="14"/>
<text class="f-dark-t" x="95.4" y="134.1" text-anchor="middle" style="font-size:14px;font-weight:800">D</text>
<circle class="f-o" cx="264.6" cy="129.2" r="14"/>
<text class="f-pill-t" x="264.6" y="134.1" text-anchor="middle" style="font-size:14px">E</text>
<text class="f-s" x="284" y="122" style="font-size:12px;font-weight:700;fill:var(--o)">nueva</text>
<text class="f-s" x="180" y="164" text-anchor="middle" style="font-size:12px">cada llave camina</text>
<text class="f-s" x="180" y="180" text-anchor="middle" style="font-size:12px">en el sentido del reloj</text>
<text class="f-s" x="26" y="288" style="font-size:12px">Cada llave va a la primera máquina que encuentra.</text>
<text class="f-s" x="26" y="306" style="font-size:12px"><tspan style="fill:var(--o);font-weight:700">Al agregar E,</tspan> solo cambian de dueño las dos</text>
<text class="f-s" x="26" y="322" style="font-size:12px">llaves del arco naranja: de B a E.</text>
<rect class="f-chip" x="24" y="338" width="312" height="50" rx="10"/>
<text class="f-t" x="38" y="359" style="font-size:13px">De 4 a 5 máquinas:</text>
<text class="f-s" x="38" y="377" style="font-size:12px">mod N mueve 80 %; el anillo, ≈ 20 %.</text>
</svg>
