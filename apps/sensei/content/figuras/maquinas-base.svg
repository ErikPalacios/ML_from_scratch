<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 400" role="img" aria-labelledby="f-maquinas-base-t" class="f-svg" style="max-width:420px">
<title id="f-maquinas-base-t">Un día de GPUs de un sistema en línea, un ejemplo. El eje horizontal son las 24 horas y el vertical, cuántas GPUs están encendidas, de 0 a 6. Abajo, una franja de 2 GPUs que nunca se apaga en todo el día: la base, que se compromete con un Savings Plan. Encima, de las 7 a las 18 horas hay 1 GPU más, y de las 18 a las 22 horas, 2 más: el pico, que va on-demand. De la 1 a las 5 de la madrugada hay 3 GPUs más para un backfill que puede repetirse: esas van en spot.</title>
<rect class="f-card" x="10" y="10" width="340" height="380" rx="16"/>
<text class="f-l" x="28" y="36" style="font-size:12px">UN DÍA DE GPUs (EJEMPLO)</text>
<text class="f-s" x="28" y="56" style="font-size:12px">GPUs encendidas, hora por hora</text>

<line class="f-linea" x1="50" y1="80" x2="330" y2="80" style="stroke-dasharray:2 4"/>
<line class="f-linea" x1="50" y1="140" x2="330" y2="140" style="stroke-dasharray:2 4"/>
<line class="f-linea" x1="50" y1="200" x2="330" y2="200" style="stroke-dasharray:2 4"/>

<rect class="f-g" x="50" y="200" width="280" height="60"/>
<rect class="f-p" x="61.7" y="110" width="46.6" height="90"/>
<rect class="f-o" x="131.7" y="170" width="128.3" height="30"/>
<rect class="f-o" x="260" y="140" width="46.7" height="60"/>

<line class="f-linea" x1="50" y1="80" x2="50" y2="260"/>
<line class="f-linea" x1="50" y1="260" x2="330" y2="260"/>
<text class="f-s" x="42" y="264" text-anchor="end" style="font-size:12px">0</text>
<text class="f-s" x="42" y="204" text-anchor="end" style="font-size:12px">2</text>
<text class="f-s" x="42" y="144" text-anchor="end" style="font-size:12px">4</text>
<text class="f-s" x="42" y="84" text-anchor="end" style="font-size:12px">6</text>
<text class="f-s" x="50" y="278" text-anchor="middle" style="font-size:12px">0 h</text>
<text class="f-s" x="120" y="278" text-anchor="middle" style="font-size:12px">6</text>
<text class="f-s" x="190" y="278" text-anchor="middle" style="font-size:12px">12</text>
<text class="f-s" x="260" y="278" text-anchor="middle" style="font-size:12px">18</text>
<text class="f-s" x="330" y="278" text-anchor="middle" style="font-size:12px">24</text>

<rect class="f-g" x="28" y="298" width="14" height="14" rx="3"/>
<text class="f-s" x="50" y="310"><tspan style="font-weight:700">Base</tspan> · nunca se apaga: compromiso</text>
<rect class="f-o" x="28" y="322" width="14" height="14" rx="3"/>
<text class="f-s" x="50" y="334"><tspan style="font-weight:700">Pico</tspan> · sube y baja: on-demand</text>
<rect class="f-p" x="28" y="346" width="14" height="14" rx="3"/>
<text class="f-s" x="50" y="358"><tspan style="font-weight:700">Backfill</tspan> · se puede repetir: spot</text>
<text class="f-s" x="28" y="380" style="font-size:12px">Comprometer el pico: pagar 4 GPUs las 24 horas.</text>
</svg>
