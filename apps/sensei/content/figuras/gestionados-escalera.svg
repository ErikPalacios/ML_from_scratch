<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 430" role="img" aria-labelledby="f-gestionados-escalera-t" class="f-svg" style="max-width:420px">
<title id="f-gestionados-escalera-t">Una tabla de cuatro columnas y siete capas que dice quién opera cada capa al servir un modelo. Con máquinas solas en EC2, el proveedor opera solo el hardware y tú todo lo demás. Con Kubernetes gestionado, EKS, el proveedor opera además el plano de control. Con un endpoint de una plataforma de ML, el proveedor opera también el sistema, los drivers, los nodos y el escalado; tú das el servidor del modelo y el modelo. Con un producto listo como Textract, el proveedor opera todo menos tus datos y tus permisos, que siempre son tuyos.</title>
