<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 396" role="img" aria-labelledby="f-concurrencia-linea-t" class="f-svg" style="max-width:420px">
<title id="f-concurrencia-linea-t">Una respuesta del despacho en el tiempo. Arriba, completa: 0.2 segundos de espera en la cola y 1.8 de prefill suman el TTFT de 2 segundos; después vienen 499 tokens, uno cada 50 milisegundos (el TPOT), hasta terminar cerca de los 27 segundos. Abajo, los primeros 3 segundos con lupa: la espera, el prefill, el primer token a los 2 segundos y los tokens siguientes. Total: 2 más 499 por 0.05, aproximadamente 27 segundos.</title>
<text class="f-l" x="14" y="24">UNA RESPUESTA DEL DESPACHO, EN EL TIEMPO</text>
<rect class="f-card" x="10" y="36" width="340" height="122" rx="16"/>
<text class="f-l" x="26" y="60">COMPLETA: 500 TOKENS</text>
<rect class="f-off" x="26" y="70" width="2.3" height="24"/>
<rect class="f-o" x="28.3" y="70" width="20.5" height="24"/>
<rect class="f-b2" x="48.8" y="70" width="284.6" height="24"/>
<text class="f-s" x="191.1" y="86.5" text-anchor="middle" style="font-size:12px">499 tokens, uno cada 50 ms</text>
<line class="f-linea" x1="26" y1="102" x2="334" y2="102"/>
<line class="f-linea" x1="26" y1="102" x2="26" y2="106"/>
<text class="f-s" x="26" y="120" text-anchor="middle" style="font-size:12px">0</text>
<line class="f-linea" x1="83" y1="102" x2="83" y2="106"/>
<text class="f-s" x="83" y="120" text-anchor="middle" style="font-size:12px">5</text>
<line class="f-linea" x1="140.1" y1="102" x2="140.1" y2="106"/>
<text class="f-s" x="140.1" y="120" text-anchor="middle" style="font-size:12px">10</text>
<line class="f-linea" x1="197.1" y1="102" x2="197.1" y2="106"/>
<text class="f-s" x="197.1" y="120" text-anchor="middle" style="font-size:12px">15</text>
<line class="f-linea" x1="254.1" y1="102" x2="254.1" y2="106"/>
<text class="f-s" x="254.1" y="120" text-anchor="middle" style="font-size:12px">20</text>
<line class="f-linea" x1="311.2" y1="102" x2="311.2" y2="106"/>
<text class="f-s" x="311.2" y="120" text-anchor="middle" style="font-size:12px">25 s</text>
<line x1="48.8" y1="64" x2="48.8" y2="98" style="stroke:var(--ink);stroke-width:1.5;stroke-dasharray:3 3"/>
<line x1="333.4" y1="64" x2="333.4" y2="98" style="stroke:var(--ink);stroke-width:1.5;stroke-dasharray:3 3"/>
<text class="f-t" x="44.8" y="144" style="font-size:13px">TTFT 2 s</text>
<text class="f-t" x="333.4" y="144" text-anchor="end" style="font-size:13px">fin ≈ 27 s</text>
<rect class="f-card" x="10" y="170" width="340" height="146" rx="16"/>
<text class="f-l" x="26" y="194">LOS PRIMEROS 3 SEGUNDOS, CON LUPA</text>
<rect class="f-off" x="26" y="222" width="20.5" height="24"/>
<rect class="f-o" x="46.5" y="222" width="184.8" height="24"/>
<text class="f-s" x="138.9" y="238.5" text-anchor="middle" style="font-size:12px">prefill: lee 6,000 tokens</text>
<rect class="f-b" x="231.9" y="222" width="3.9" height="24" rx="1.5"/>
<rect class="f-b" x="237.1" y="222" width="3.9" height="24" rx="1.5"/>
<rect class="f-b" x="242.2" y="222" width="3.9" height="24" rx="1.5"/>
<rect class="f-b" x="247.3" y="222" width="3.9" height="24" rx="1.5"/>
<rect class="f-b" x="252.5" y="222" width="3.9" height="24" rx="1.5"/>
<rect class="f-b" x="257.6" y="222" width="3.9" height="24" rx="1.5"/>
<rect class="f-b" x="262.7" y="222" width="3.9" height="24" rx="1.5"/>
<rect class="f-b" x="267.9" y="222" width="3.9" height="24" rx="1.5"/>
<rect class="f-b" x="273" y="222" width="3.9" height="24" rx="1.5"/>
<rect class="f-b" x="278.1" y="222" width="3.9" height="24" rx="1.5"/>
<rect class="f-b" x="283.3" y="222" width="3.9" height="24" rx="1.5"/>
<rect class="f-b" x="288.4" y="222" width="3.9" height="24" rx="1.5"/>
<rect class="f-b" x="293.5" y="222" width="3.9" height="24" rx="1.5"/>
<rect class="f-b" x="298.7" y="222" width="3.9" height="24" rx="1.5"/>
<rect class="f-b" x="303.8" y="222" width="3.9" height="24" rx="1.5"/>
<rect class="f-b" x="308.9" y="222" width="3.9" height="24" rx="1.5"/>
<rect class="f-b" x="314.1" y="222" width="3.9" height="24" rx="1.5"/>
<rect class="f-b" x="319.2" y="222" width="3.9" height="24" rx="1.5"/>
<rect class="f-b" x="324.3" y="222" width="3.9" height="24" rx="1.5"/>
<rect class="f-b" x="329.5" y="222" width="3.9" height="24" rx="1.5"/>
<text class="f-s" x="334" y="214" text-anchor="end" style="font-size:12px">cada barra azul: 1 token</text>
<line class="f-linea" x1="26" y1="254" x2="334" y2="254"/>
<line class="f-linea" x1="26" y1="254" x2="26" y2="258"/>
<text class="f-s" x="26" y="272" text-anchor="start" style="font-size:12px">0</text>
<line class="f-linea" x1="128.7" y1="254" x2="128.7" y2="258"/>
<text class="f-s" x="128.7" y="272" text-anchor="middle" style="font-size:12px">1</text>
<line class="f-linea" x1="231.3" y1="254" x2="231.3" y2="258"/>
<line class="f-linea" x1="334" y1="254" x2="334" y2="258"/>
<text class="f-s" x="334" y="272" text-anchor="end" style="font-size:12px">3 s</text>
<line x1="231.3" y1="216" x2="231.3" y2="260" style="stroke:var(--ink);stroke-width:1.5;stroke-dasharray:3 3"/>
<text class="f-t" x="231.3" y="273" text-anchor="middle" style="font-size:13px">1.er token</text>
<text class="f-s" x="26" y="296" style="font-size:12px">espera 0.2 s</text>
<text class="f-s" x="138.9" y="296" text-anchor="middle" style="font-size:12px">prefill 1.8 s</text>
<text class="f-s" x="334" y="296" text-anchor="end" style="font-size:12px">TPOT 50 ms</text>
<rect class="f-chip" x="10" y="328" width="340" height="60" rx="14"/>
<text class="f-s" x="26" y="352">E2E = TTFT + TPOT × (500 − 1)</text>
<text class="f-t" x="26" y="374" style="font-size:14px">= 2 + 0.05 × 499 = 26.95 ≈ 27 s</text>
</svg>
