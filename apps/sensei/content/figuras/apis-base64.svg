<text class="f-s" x="28" y="256" style="font-size:12px">Alfabeto: A–Z (0–25), a–z (26–51), 0–9 (52–61), + y /</text>
<text class="f-t" x="28" y="276" style="font-size:13px">Todo JPEG en base64 empieza con «/9j/».</text>
<text class="f-s" x="28" y="295" style="font-size:12px">4 letras por cada 3 bytes: 33 % más.</text>
