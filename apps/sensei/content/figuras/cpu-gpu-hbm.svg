<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 486" role="img" aria-labelledby="f-cpu-gpu-hbm-t" class="f-svg" style="max-width:420px">
<title id="f-cpu-gpu-hbm-t">Dos maneras de hacer la memoria de una GPU. Arriba, la T4 con GDDR6: 8 chips de memoria de 2 GB soldados en la tarjeta, 4 a cada lado de la GPU, cada uno conectado con 32 cables; son 256 cables a 10 Gb/s, y 256 por 10 entre 8 da 320 GB/s. Abajo, la H100 SXM con HBM3: 5 pilas de memoria pegadas al chip, cada una conectada con una banda de 1,024 cables; son 5,120 cables a cerca de 5.23 Gb/s, unos 3,350 GB/s. Veinte veces más cables, a la mitad de velocidad cada uno, dan unas diez veces el ancho de banda.</title>
<rect class="f-card" x="10" y="10" width="340" height="466" rx="16"/>

<text class="f-l" x="28" y="36" style="font-size:12px">LA T4 · GDDR6 EN LA TARJETA</text>
<rect class="f-chip" x="28" y="48" width="304" height="128" rx="10"/>
<line class="f-linea" x1="88" y1="68" x2="140" y2="92"/>
<line class="f-linea" x1="88" y1="94" x2="140" y2="106"/>
<line class="f-linea" x1="88" y1="120" x2="140" y2="120"/>
<line class="f-linea" x1="88" y1="146" x2="140" y2="134"/>
