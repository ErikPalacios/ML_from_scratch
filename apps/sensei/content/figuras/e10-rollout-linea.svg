<text class="f-pill-t" x="310.5" y="142" text-anchor="middle" style="font-size:11px">T4</text>
<text class="f-s" x="310.5" y="270" text-anchor="middle" style="font-size:12px">—</text>
<text class="f-s" x="310.5" y="326" text-anchor="middle" style="font-size:12px">100 %</text>
<text class="f-s" x="310.5" y="382" text-anchor="middle" style="font-size:12px">5–20 min</text>
<text class="f-l" x="18" y="248">DURA</text>
<line class="f-linea" x1="18" y1="232" x2="342" y2="232"/>
<text class="f-l" x="18" y="304">TRÁFICO A LA 15</text>
<line class="f-linea" x1="18" y1="288" x2="342" y2="288"/>
<text class="f-l" x="18" y="360">VOLVER TARDA</text>
<line class="f-linea" x1="18" y1="344" x2="342" y2="344"/>
<text class="f-s" x="18" y="424" style="font-size:12px">Una T4 de más en tres fases: ≈ US$29–55 por release.</text>
