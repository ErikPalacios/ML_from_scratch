<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 380" role="img" aria-labelledby="f-aprendio-curvas-t" class="f-svg" style="max-width:420px">
<title id="f-aprendio-curvas-t">Curva de aprendizaje de 20 épocas. La loss de entrenamiento baja siempre, de 2.10 a 0.10. La loss de validación baja de 2.15 hasta 0.80 en la época 8 y luego sube hasta 1.15 en la época 20. A la izquierda las dos están altas: underfitting. A partir de la época 8 se separan: overfitting. El mejor checkpoint es el de la época 8.</title>
<rect class="f-card" x="10" y="10" width="340" height="360" rx="16"/>
<text class="f-l" x="28" y="36">LOSS POR ÉPOCA</text>
<line x1="28" y1="56" x2="52" y2="56" style="stroke:var(--b);stroke-width:3;stroke-linecap:round"/><text class="f-s" x="58" y="61">entrenamiento</text>
<line x1="170" y1="56" x2="194" y2="56" style="stroke:var(--o);stroke-width:3;stroke-linecap:round"/><text class="f-s" x="200" y="61">validación</text>
<rect class="f-chip" x="56" y="82" width="43.9" height="170" rx="6"/>
<rect class="f-chip" x="187.7" y="82" width="146.3" height="170" rx="6"/>
<text class="f-l" x="61" y="230">UNDER</text><text class="f-l" x="61" y="244">FITTING</text>
<text class="f-l" x="328" y="98" text-anchor="end">OVERFITTING</text>
<line class="f-flecha" x1="56" y1="252" x2="340" y2="252"/>
<line class="f-flecha" x1="56" y1="252" x2="56" y2="78"/>
<text class="f-s" x="48" y="256.0" text-anchor="end" style="font-size:12px">0</text>
<text class="f-s" x="48" y="183.3" text-anchor="end" style="font-size:12px">1</text>
<text class="f-s" x="48" y="110.5" text-anchor="end" style="font-size:12px">2</text>
<text class="f-s" x="56.0" y="270" text-anchor="middle" style="font-size:12px">1</text>
<text class="f-s" x="158.4" y="270" text-anchor="middle" style="font-size:12px">8</text>
<text class="f-s" x="246.2" y="270" text-anchor="middle" style="font-size:12px">14</text>
<text class="f-s" x="334.0" y="270" text-anchor="middle" style="font-size:12px">20</text>
<text class="f-s" x="195" y="288" text-anchor="middle" style="font-size:12px">época</text>
<line x1="158.4" y1="82" x2="158.4" y2="252" style="stroke:var(--tm-ink3);stroke-width:1.5;stroke-dasharray:4 4"/>
<polyline points="56.0,99.3 70.6,135.6 85.3,161.1 99.9,182.9 114.5,193.8 129.2,201.1 143.8,206.9 158.4,212.0 173.1,216.4 187.7,220.0 202.3,223.6 216.9,227.3 231.6,230.9 246.2,233.8 260.8,236.0 275.5,238.2 290.1,240.4 304.7,241.8 319.4,243.3 334.0,244.7" style="fill:none;stroke:var(--b);stroke-width:3;stroke-linejoin:round;stroke-linecap:round"/>
<polyline points="56.0,95.6 70.6,129.8 85.3,155.3 99.9,175.6 114.5,184.4 129.2,189.5 143.8,192.4 158.4,193.8 173.1,193.1 187.7,191.6 202.3,189.5 216.9,187.3 231.6,185.1 246.2,182.9 260.8,180.0 275.5,177.8 290.1,174.9 304.7,172.7 319.4,170.5 334.0,168.4" style="fill:none;stroke:var(--o);stroke-width:3;stroke-linejoin:round;stroke-linecap:round"/>
