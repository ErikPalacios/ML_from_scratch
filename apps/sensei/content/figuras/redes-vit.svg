<line x1="28" y1="107" x2="182" y2="107" style="stroke:var(--muted);stroke-width:.7"/>
<line x1="94" y1="52" x2="94" y2="206" style="stroke:var(--muted);stroke-width:.7"/>
<line x1="28" y1="118" x2="182" y2="118" style="stroke:var(--muted);stroke-width:.7"/>
<line x1="105" y1="52" x2="105" y2="206" style="stroke:var(--muted);stroke-width:.7"/>
<line x1="28" y1="129" x2="182" y2="129" style="stroke:var(--muted);stroke-width:.7"/>
<line x1="116" y1="52" x2="116" y2="206" style="stroke:var(--muted);stroke-width:.7"/>
