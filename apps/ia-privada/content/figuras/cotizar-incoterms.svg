<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 380" role="img" aria-labelledby="f-cotizar-incoterms-t" class="f-svg" style="max-width:420px">
<title id="f-cotizar-incoterms-t">Quién paga cada tramo con tres Incoterms 2020, en cinco tramos: 1 trámite de exportación en Estados Unidos, 2 flete internacional, 3 aduana mexicana e impuestos, 4 flete hasta el despacho, 5 descargar. Con EXW el comprador paga los cinco. Con DAP el vendedor paga 1, 2 y 4, y el comprador la aduana y la descarga. Con DDP el vendedor paga del 1 al 4 y el comprador solo descarga.</title>
