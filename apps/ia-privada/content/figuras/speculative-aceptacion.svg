<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 330" role="img" aria-labelledby="f-speculative-aceptacion-t" class="f-svg" style="max-width:420px">
<title id="f-speculative-aceptacion-t">Gráfica de barras: tokens que salen por cada verificación de Qwen3 32B con el borrador EAGLE-3 de Red Hat, medidos por ellos en resumen de noticias (CNN/DailyMail), según cuántos tokens propone el borrador, de 1 a 7. Medido: 1.62, 1.95, 2.15, 2.23, 2.27, 2.32 y 2.33. Los puntos son la fórmula de Leviathan con una tasa de aceptación de 0.59: 1.59, 1.94, 2.14, 2.26, 2.34, 2.38 y 2.40. Hasta 3 propuestas casi coinciden; después la medición queda un poco abajo, porque las propuestas lejanas se aceptan menos de lo que supone una tasa fija. Las dos se aplanan: pasar de 3 a 7 propuestas apenas suma 0.18 tokens por paso.</title>
