<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 410" role="img" aria-labelledby="f-e04-gate-erosion-t" class="f-svg" style="max-width:420px">
<title id="f-e04-gate-erosion-t">Una escalera que baja 0.2 puntos cada mes durante 12 meses, de 0 a −2.4 puntos de top-1. Cada escalón, comparado solo contra el champion del mes anterior, mide 0.2 puntos y cabe en la franja del margen de 0.3: pasa. Al mes 3, la comparación contra el modelo de hace 3 meses junta tres escalones, −0.6 puntos, que no caben en el margen (desde el mes 2, dos escalones, −0.4, tampoco caben). Sin esa comparación, la escalera llega a −2.4 puntos en un año.</title>
<rect class="f-card" x="10" y="10" width="340" height="390" rx="16"/>
<text class="f-l" x="26" y="36">TOP-1 PERDIDO, EN PUNTOS · 0.2 POR MES</text>
<rect class="f-chip" x="50" y="60" width="280" height="25" rx="3"/>
<text class="f-s" x="326" y="78" text-anchor="end" style="font-size:12px">margen: 0.3</text>
<line class="f-linea" x1="50" y1="60" x2="50" y2="268"/>
<line class="f-linea" x1="50" y1="268" x2="330" y2="268"/>
<text class="f-l" x="44" y="64" text-anchor="end">0</text>
<text class="f-l" x="44" y="164" text-anchor="end">−1.2</text>
<text class="f-l" x="44" y="264" text-anchor="end">−2.4</text>
<polyline points="50.0,60.0 73.3,60.0 73.3,76.7 96.7,76.7 96.7,93.3 120.0,93.3 120.0,110.0 143.3,110.0 143.3,126.7 166.7,126.7 166.7,143.3 190.0,143.3 190.0,160.0 213.3,160.0 213.3,176.7 236.7,176.7 236.7,193.3 260.0,193.3 260.0,210.0 283.3,210.0 283.3,226.7 306.7,226.7 306.7,243.3 330.0,243.3 330.0,260.0" style="fill:none;stroke:var(--b);stroke-width:3"/>
<circle class="f-g" cx="73.3" cy="76.7" r="4"/>
<circle class="f-g" cx="96.7" cy="93.3" r="4"/>
<circle class="f-o" cx="120" cy="110" r="7"/>
<circle class="f-g" cx="143.3" cy="126.7" r="4"/>
<circle class="f-g" cx="166.7" cy="143.3" r="4"/>
<circle class="f-g" cx="190" cy="160" r="4"/>
<circle class="f-g" cx="213.3" cy="176.7" r="4"/>
