# Configuración de pytest para TODO el caso c08: `cd reference/c08 && pytest` corre las 4 carpetas.
# Sin GPU, sin Redis, sin Triton, sin Kafka: los servicios externos están detrás de interfaces con fakes.
[pytest]
# Cada carpeta entra al sys.path: los tests importan `home_api`, `rerank`, `covisitation`,
# `build_training_set`, `ab_sample_size` y `offline_metrics` como módulos sueltos
pythonpath = serving retrieval training eval
testpaths = serving/tests retrieval/tests training/tests eval/tests
# Salida compacta: en CI importa la lista de fallos
addopts = -q
