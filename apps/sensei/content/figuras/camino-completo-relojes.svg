<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 496" role="img" aria-labelledby="f-camino-completo-relojes-t" class="f-svg" style="max-width:420px">
<title id="f-camino-completo-relojes-t">Los dos relojes de C01 en una sola regla logarítmica, de 1 milisegundo a 1 mes, donde cada marca de 1 ms, 10 ms, 100 ms, 1 s y 10 s vale 10 veces la anterior. Arriba, en azul, el camino online: el modelo calcula en unos 5 ms, una respuesta típica tarda de 30 a 50 ms, la promesa es de 200 ms para 99 de cada 100 fotos y a los 300 ms el marketplace deja de esperar. Abajo, en ámbar, el camino offline: entrenar tarda unas horas, desplegar poco a poco tarda días y cada mes sale una versión nueva. Entre 200 ms y un mes hay un factor de unos 13 millones.</title>
<rect class="f-card" x="10" y="10" width="340" height="476" rx="16"/>
<text class="f-l" x="28" y="36">DOS RELOJES EN UNA SOLA REGLA</text>
<rect x="100" y="50" width="242" height="148" rx="10" style="fill:var(--b);opacity:.1"/>
<text class="f-l" x="112" y="68" style="fill:var(--accent-ink)">CAMINO ONLINE</text>
<rect x="100" y="318" width="242" height="152" rx="10" style="fill:var(--y);opacity:.16"/>
<text class="f-l" x="112" y="338" style="fill:var(--tm-dojo)">CAMINO OFFLINE</text>
<line class="f-linea" x1="92" y1="60" x2="92" y2="460"/>
<line class="f-linea" x1="87" y1="72" x2="97" y2="72"/><text class="f-l" x="82" y="76" text-anchor="end">1 ms</text>
<line class="f-linea" x1="87" y1="112" x2="97" y2="112"/><text class="f-l" x="82" y="116" text-anchor="end">10 ms</text>
<line class="f-linea" x1="87" y1="152" x2="97" y2="152"/><text class="f-l" x="82" y="156" text-anchor="end">100 ms</text>
<line class="f-linea" x1="87" y1="192" x2="97" y2="192"/><text class="f-l" x="82" y="196" text-anchor="end">1 s</text>
<line class="f-linea" x1="87" y1="232" x2="97" y2="232"/><text class="f-l" x="82" y="236" text-anchor="end">10 s</text>
<line class="f-linea" x1="87" y1="263.1" x2="97" y2="263.1"/><text class="f-l" x="82" y="267.1" text-anchor="end">1 min</text>
<line class="f-linea" x1="87" y1="334.3" x2="97" y2="334.3"/><text class="f-l" x="82" y="338.3" text-anchor="end">1 h</text>
<line class="f-linea" x1="87" y1="389.5" x2="97" y2="389.5"/><text class="f-l" x="82" y="393.5" text-anchor="end">1 día</text>
<line class="f-linea" x1="87" y1="423.3" x2="97" y2="423.3"/><text class="f-l" x="82" y="427.3" text-anchor="end">1 semana</text>
<line class="f-linea" x1="87" y1="448.5" x2="97" y2="448.5"/><text class="f-l" x="82" y="452.5" text-anchor="end">1 mes</text>
<circle class="f-b" cx="92" cy="100" r="5"/><text class="f-s" x="112" y="104">≈ 5 ms: el modelo calcula</text>
<rect class="f-b" x="88" y="131.1" width="8" height="8.9" rx="3"/><text class="f-s" x="112" y="139.5">30–50 ms: una respuesta típica</text>
<rect class="f-b" x="86" y="162.5" width="12" height="3" rx="1.5"/><line class="f-linea" x1="98" y1="164" x2="108" y2="159"/><text class="f-s" x="112" y="163">200 ms: la promesa, 99 de 100</text>
<rect class="f-b" x="86" y="169.6" width="12" height="3" rx="1.5"/><line class="f-linea" x1="98" y1="171.1" x2="108" y2="180.1"/><text class="f-s" x="112" y="184.1">300 ms: se deja de esperar</text>
<circle class="f-y" cx="92" cy="358.3" r="5"/><text class="f-s" x="112" y="362.3">unas horas: entrenar</text>
<circle class="f-y" cx="92" cy="396.5" r="5"/><text class="f-s" x="112" y="400.5">días: desplegar poco a poco</text>
<circle class="f-y" cx="92" cy="448.5" r="5"/><text class="f-s" x="112" y="452.5">1 mes: una versión nueva</text>
<line class="f-linea" x1="328" y1="164" x2="340" y2="164"/><line class="f-linea" x1="328" y1="448.5" x2="340" y2="448.5"/>
<line class="f-flecha" x1="334" y1="166" x2="334" y2="439.5"/><path class="f-punta" d="M328,437.5 L340,437.5 L334,447.5 Z"/>
<text class="f-t" x="326" y="292" text-anchor="end" style="font-size:14px">× 13 millones</text>
<text class="f-s" x="326" y="310" text-anchor="end" style="font-size:12px">de 200 ms a un mes</text>
</svg>
