<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 400" role="img" aria-labelledby="f-el-cuarto-escalera-t" class="f-svg" style="max-width:420px">
<title id="f-el-cuarto-escalera-t">Escalera de potencia por equipo o por rack, en kW, en escala logarítmica. El servidor del despacho, 2.5 kW. El rack promedio de 2026 según Uptime, 7.8 kW. Un DGX H100, 10.2 kW. Un DGX B200, 14.3 kW. Cuatro DGX H100 en un rack, unos 41 kW. Un rack GB200 NVL72, unos 120 kW, enfriado con líquido. Una franja sombreada entre unos 20 y 40 kW marca dónde se acaba el aire según distintas fuentes de la industria.</title>
<text class="f-l" x="14" y="24">KW POR EQUIPO O POR RACK (ESCALA LOG)</text>
<rect class="f-chip" x="195.6" y="40" width="39.2" height="270" rx="4"/>
<text class="f-s" x="215.2" y="56" text-anchor="middle" style="font-size:12px">el aire se acaba</text>
<text class="f-s" x="26" y="82">Servidor del despacho</text>
<rect class="f-g" x="26" y="88" width="51.9" height="14" rx="3"/>
<text class="f-t" x="83.9" y="100" style="font-size:13px">2.5 kW</text>
<text class="f-s" x="26" y="122">Rack promedio, Uptime 2026</text>
<rect class="f-b2" x="26" y="128" width="116.3" height="14" rx="3"/>
<text class="f-t" x="148.3" y="140" style="font-size:13px">7.8 kW</text>
<text class="f-s" x="26" y="162">DGX H100</text>
<rect class="f-b" x="26" y="168" width="131.5" height="14" rx="3"/>
<text class="f-t" x="163.5" y="180" style="font-size:13px">10.2 kW</text>
<text class="f-s" x="26" y="202">DGX B200</text>
<rect class="f-b" x="26" y="208" width="150.6" height="14" rx="3"/>
<text class="f-t" x="182.6" y="220" style="font-size:13px">14.3 kW</text>
<text class="f-s" x="26" y="242">4 DGX H100 en un rack</text>
<rect class="f-p" x="26" y="248" width="210.0" height="14" rx="3"/>
<text class="f-t" x="242.0" y="260" style="font-size:13px">≈ 41 kW</text>
<text class="f-s" x="26" y="282">GB200 NVL72, con líquido</text>
<rect class="f-o" x="26" y="288" width="271.1" height="14" rx="3"/>
<text class="f-t" x="291.1" y="300" text-anchor="end" style="font-size:13px">≈ 120 kW</text>
<line class="f-linea" x1="26" y1="316" x2="326" y2="316"/>
<line class="f-linea" x1="26.0" y1="316" x2="26.0" y2="320"/>
<text class="f-s" x="26.0" y="334" text-anchor="middle" style="font-size:12px">1 kW</text>
<line class="f-linea" x1="156.4" y1="316" x2="156.4" y2="320"/>
<text class="f-s" x="156.4" y="334" text-anchor="middle" style="font-size:12px">10 kW</text>
<line class="f-linea" x1="286.8" y1="316" x2="286.8" y2="320"/>
<text class="f-s" x="286.8" y="334" text-anchor="middle" style="font-size:12px">100 kW</text>
<text class="f-s" x="215.2" y="334" text-anchor="middle" style="font-size:12px">20–40</text>
<rect class="f-chip" x="10" y="346" width="340" height="44" rx="14"/>
<text class="f-s" x="26" y="373">El despacho queda abajo de todo.</text>
</svg>
