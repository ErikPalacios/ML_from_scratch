<line class="f-flecha" x1="80" y1="122" x2="80" y2="114"/><path class="f-punta" d="M75,116 L85,116 L80,110 Z"/>
<line class="f-flecha" x1="80" y1="170" x2="80" y2="162"/><path class="f-punta" d="M75,164 L85,164 L80,158 Z"/>
<text class="f-l" x="38" y="70">CON VENTILADOR</text>
<text class="f-t" x="162" y="78">Cada tarjeta</text>
<text class="f-t" x="162" y="96">mueve su aire</text>
<text class="f-s" x="162" y="122">Jala aire del gabinete,</text>
<text class="f-s" x="162" y="140">lo pasa por sus aletas</text>
<text class="f-s" x="162" y="158">y lo saca. Funciona en</text>
<text class="f-s" x="162" y="176">cualquier torre ventilada.</text>
<rect class="f-card" x="10" y="212" width="340" height="224" rx="16"/>
<text class="f-l" x="26" y="236">SERVIDOR DE RACK · TARJETAS PASIVAS</text>
<rect class="f-chip" x="26" y="250" width="308" height="104" rx="8"/>
<circle class="f-b2" cx="48" cy="270" r="10"/>
