<text class="f-l" x="26" y="316">LO QUE HAY: LLAVES EN ORDEN</text>
<rect class="f-chip" x="22" y="326" width="316" height="22" rx="6"/>
<rect x="26" y="329" width="125" height="16" rx="4" style="fill:var(--b);opacity:.3"/>
<text class="f-s" x="28" y="342" style="font:12px var(--mono)">fotos/2026/11/06/ana-tenis.jpg</text>
