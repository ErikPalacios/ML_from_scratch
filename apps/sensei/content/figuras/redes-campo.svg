<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 520" role="img" aria-labelledby="f-redes-campo-t" class="f-svg" style="max-width:420px">
<title id="f-redes-campo-t">El campo receptivo. Arriba, visto de lado: una neurona de la capa 3 se conecta con 3 neuronas de la capa 2, que juntas se conectan con 5 de la capa 1, que juntas ven 7 píxeles de la foto. Abajo, visto de frente sobre una cuadrícula de 7 por 7: el cuadro de 3 por 3 que ve una neurona de la capa 1, el de 5 por 5 de la capa 2 y el de 7 por 7 de la capa 3, todos centrados en el mismo píxel. Con stride 2 crece más rápido: 3, 7 y 15. En la ResNet-50 llega a 427 por 427 píxeles.</title>
