[pytest]
# Las pruebas del gateway: python -m pytest (desde la carpeta del kit). Corren sin Triton: usan un Triton falso.
pythonpath = gateway
testpaths = gateway/tests
# Starlette 1.x avisa que su cliente de pruebas pasará a httpx2; con httpx 0.28 funciona igual.
filterwarnings =
    ignore:Using .httpx. with .starlette.testclient. is deprecated
    ignore::PIL.Image.DecompressionBombWarning
