<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 468" role="img" aria-labelledby="f-ruido-potencia-t" class="f-svg" style="max-width:420px">
<title id="f-ruido-potencia-t">Dos campanas sobre la diferencia entre los brazos de un A/B, en puntos porcentuales. La de la izquierda, centrada en 0, es lo que sale si no hay efecto; la de la derecha, centrada en +1, es lo que sale si el modelo nuevo de verdad sube la aceptación 1 punto. La raya está en +0.70, que son 1.96 errores estándar de 0.36 puntos: si la diferencia la cruza, se declara significativa. Las colitas naranjas de la campana de la izquierda, más allá de más o menos 0.70, suman el 5 % de falsas alarmas. De la campana de la derecha, el 80 % queda a la derecha de la raya: es la potencia. El 20 % que queda a la izquierda es el efecto que se escapa. Números de C01: 70 % de aceptación y 32,647 publicaciones por brazo.</title>
