<path class="f-o" d="M39.0,110.0 L39.0,94.0 Q41.0,82.0 53.0,80.0 L73.0,77.0 Q79.0,66.0 89.0,68.0 L99.0,72.0 Q103.0,86.0 115.0,90.0 Q127.0,93.0 127.0,102.0 L127.0,110.0 Z"/><rect class="f-ink" x="37.0" y="108.0" width="92.0" height="8.0" rx="4.0"/><line class="f-cord" x1="77.0" y1="74.0" x2="83.0" y2="80.0"/><line class="f-cord" x1="83.0" y1="77.0" x2="89.0" y2="83.0"/><line class="f-cord" x1="89.0" y1="80.0" x2="95.0" y2="86.0"/>
