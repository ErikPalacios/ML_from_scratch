<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 336" role="img" aria-labelledby="f-apis-stream-t" class="f-svg" style="max-width:420px">
<title id="f-apis-stream-t">La misma respuesta de C10 en una línea de tiempo de 0 a 11 segundos, dos veces. Sin streaming, la pantalla queda en blanco hasta los 10.6 segundos y entonces llega todo junto. Con streaming, después de 0.6 segundos de espera llega el primer token, y luego 25 tokens por segundo: a los 2 segundos ya hay 36 tokens en la pantalla, a los 5 segundos 111 y a los 9 segundos 211. El total es igual, unos 10.6 segundos; lo que cambia es cuándo empieza a leer la persona.</title>
<rect class="f-card" x="10" y="10" width="340" height="316" rx="16"/>
<text class="f-l" x="28" y="36">LA MISMA RESPUESTA DE C10, DOS VECES</text>
<text class="f-t" x="40" y="66" style="font-size:14px">Sin streaming</text>
<text class="f-s" x="320" y="66" text-anchor="end" style="font-size:12px">todo llega a los 10.6 s</text>
<rect class="f-off" x="40" y="76" width="279.4" height="26" rx="4"/>
<text class="f-s" x="52" y="94" style="font-size:12px">pantalla en blanco</text>
<rect class="f-o" x="319.4" y="76" width="12" height="26" rx="3"/>
<text class="f-t" x="40" y="134" style="font-size:14px">Con streaming</text>
<text class="f-s" x="320" y="134" text-anchor="end" style="font-size:12px">primer token a los 0.6 s</text>
<rect class="f-off" x="40" y="144" width="15.8" height="26" rx="4"/>
<rect class="f-b" x="55.8" y="144" width="263.6" height="26" rx="4"/>
<text x="110" y="162" class="f-pill-t" style="font:700 12px var(--sans)">25 tokens por segundo</text>
<path class="f-linea" d="M92.7 172 L92.7 182 M171.8 172 L171.8 182 M277.2 172 L277.2 182"/>
<text class="f-t" x="92.7" y="198" text-anchor="middle" style="font-size:13px">36</text>
<text class="f-t" x="171.8" y="198" text-anchor="middle" style="font-size:13px">111</text>
<text class="f-t" x="277.2" y="198" text-anchor="middle" style="font-size:13px">211</text>
<text class="f-s" x="40" y="218" style="font-size:12px">tokens que ya puede leer a los 2, 5 y 9 s</text>
<path class="f-linea" d="M40 240 L319.4 240"/>
<path class="f-linea" d="M40 236 L40 244 M92.7 236 L92.7 244 M145.4 236 L145.4 244 M198.2 236 L198.2 244 M250.9 236 L250.9 244 M303.6 236 L303.6 244"/>
<text class="f-s" x="40" y="260" text-anchor="middle" style="font-size:12px">0 s</text>
<text class="f-s" x="92.7" y="260" text-anchor="middle" style="font-size:12px">2</text>
<text class="f-s" x="145.4" y="260" text-anchor="middle" style="font-size:12px">4</text>
<text class="f-s" x="198.2" y="260" text-anchor="middle" style="font-size:12px">6</text>
<text class="f-s" x="250.9" y="260" text-anchor="middle" style="font-size:12px">8</text>
<text class="f-s" x="303.6" y="260" text-anchor="middle" style="font-size:12px">10 s</text>
<rect class="f-chip" x="24" y="274" width="312" height="40" rx="10"/>
<text class="f-t" x="36" y="299" style="font-size:13px">El total es igual: ≈ 10.6 s. Cambia cuándo lees.</text>
</svg>
