<text class="f-t" x="171" y="222" text-anchor="middle" style="font:700 12px var(--mono)">6F</text>

<path class="f-flecha" d="M35 236v10M69 236v10M103 236v10M137 236v10M171 236v10"/>

<text class="f-t" x="35" y="268" text-anchor="middle" style="font-size:16px">N</text>
<text class="f-t" x="69" y="268" text-anchor="middle" style="font-size:16px">i</text>
<text class="f-t" x="103" y="268" text-anchor="middle" style="font-size:16px;fill:var(--o)">Ã</text>
<text class="f-t" x="137" y="268" text-anchor="middle" style="font-size:16px;fill:var(--o)">±</text>
<text class="f-t" x="171" y="268" text-anchor="middle" style="font-size:16px">o</text>

<text class="f-s" x="206" y="224" style="font-size:12px">Latin-1 no sabe</text>
<text class="f-s" x="206" y="240" style="font-size:12px">que C3 y B1 van</text>
<text class="f-s" x="206" y="256" style="font-size:12px">juntos.</text>

<rect class="f-chip" x="21" y="288" width="318" height="70" rx="10"/>
<text class="f-t" x="35" y="313" style="font-size:14px">Niño  →  NiÃ±o</text>
<text class="f-s" x="35" y="333" style="font-size:12px">Es UTF-8 leído con la tabla equivocada.</text>
<text class="f-s" x="35" y="349" style="font-size:12px">Los bytes están bien; la lectura, no.</text>
