# Configuración de pytest del worker: los tests corren sin AWS, sin GPU y sin un WSI real
[pytest]
# La raíz del worker entra al sys.path: los tests importan `tiling` y `worker` igual que el contenedor
pythonpath = .
# Solo buscamos tests en tests/
testpaths = tests
# Salida compacta: en CI importa la lista de fallos
addopts = -q
