# Configuración de pytest para TODO el caso c14: `cd reference/c14 && pytest` corre las 4 carpetas.
# Sin warehouse, sin Spark, sin Airflow, sin Pushgateway: lo externo está detrás de interfaces con fakes.
[pytest]
# Cada carpeta entra al sys.path: los módulos se importan sueltos (`calendar_mx`, `build_features`,
# `train_quantile`, `backtest`, `run_forecast`, `nightly_rules`…), igual que dentro de la imagen del job
pythonpath = features train batch orchestration
testpaths = features/tests train/tests batch/tests orchestration/tests
# Salida compacta: en CI importa la lista de fallos
addopts = -q
