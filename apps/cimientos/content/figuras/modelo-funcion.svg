<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 546" role="img" aria-labelledby="f-mf-t" class="f-svg" style="max-width:420px">
<title id="f-mf-t">Un modelo como función: entra la foto de unos tenis (unos 150 mil números), el modelo con sus perillas calcula, y sale la probabilidad de cada categoría: Calzado › Tenis 94 %, Calzado › Botas 4 %, Ropa deportiva 1 % y las otras 497 casi en 0 %</title>
<rect class="f-card" x="10" y="10" width="340" height="140" rx="16"/>
