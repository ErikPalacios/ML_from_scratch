<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 420" role="img" aria-labelledby="f-numeros-maquina-vuelta-t" class="f-svg" style="max-width:420px">
<title id="f-numeros-maquina-vuelta-t">Los 256 valores de un byte puestos en un círculo, como un reloj. Por fuera, como uint8: el 0 arriba, 64 a la derecha, 128 abajo y 192 a la izquierda; justo antes del 0 está el 255. Una flecha arriba muestra 250 más 10: pasa por encima del 255 y cae en el 4, porque 260 no cabe en 8 bits. Por dentro, los mismos bits leídos como int8: 0 arriba, 64 a la derecha, menos 64 a la izquierda, y abajo el salto de 127 a menos 128. El uint8 da la vuelta arriba; el int8, abajo.</title>
<rect class="f-card" x="10" y="10" width="340" height="400" rx="16"/>
<text class="f-l" x="28.0" y="36.0">UN BYTE DA LA VUELTA</text>
<circle cx="180" cy="222" r="96" style="fill:none;stroke:var(--b);stroke-opacity:.28;stroke-width:20"/>
<line class="f-linea" x1="180.0" y1="136.0" x2="180.0" y2="116.0"/>
<line class="f-linea" x1="240.8" y1="161.2" x2="255.0" y2="147.0"/>
<line class="f-linea" x1="266.0" y1="222.0" x2="286.0" y2="222.0"/>
<line class="f-linea" x1="240.8" y1="282.8" x2="255.0" y2="297.0"/>
<line class="f-linea" x1="180.0" y1="308.0" x2="180.0" y2="328.0"/>
<line class="f-linea" x1="119.2" y1="282.8" x2="105.0" y2="297.0"/>
<line class="f-linea" x1="94.0" y1="222.0" x2="74.0" y2="222.0"/>
<line class="f-linea" x1="119.2" y1="161.2" x2="105.0" y2="147.0"/>
<line x1="180.0" y1="140.0" x2="180.0" y2="112.0" style="stroke:var(--o);stroke-width:4;stroke-linecap:round"/>
<line x1="180.0" y1="304.0" x2="180.0" y2="332.0" style="stroke:var(--p);stroke-width:4;stroke-linecap:round"/>
<text class="f-t" x="160.9" y="106.5" text-anchor="end" style="font-size:14px">255</text>
<text class="f-t" x="199.1" y="106.5" text-anchor="start" style="font-size:14px">0</text>
<text class="f-t" x="300.0" y="227.0" text-anchor="start" style="font-size:14px">64</text>
<text class="f-t" x="180.0" y="356.0" text-anchor="middle" style="font-size:14px">128</text>
<text class="f-t" x="60.0" y="227.0" text-anchor="end" style="font-size:14px">192</text>
<text x="180.0" y="164.0" text-anchor="middle" style="fill:var(--p);font:700 13px var(--sans)">0</text>
<text x="242.0" y="227.0" text-anchor="end" style="fill:var(--p);font:700 13px var(--sans)">64</text>
<text x="118.0" y="227.0" text-anchor="start" style="fill:var(--p);font:700 13px var(--sans)">−64</text>
<text x="199.1" y="287.8" text-anchor="start" style="fill:var(--p);font:700 13px var(--sans)">127</text>
<text x="160.9" y="287.8" text-anchor="end" style="fill:var(--p);font:700 13px var(--sans)">−128</text>
<text class="f-s" x="180.0" y="192.0" text-anchor="middle" style="font-size:12px">por fuera: uint8</text>
<text x="180.0" y="209.0" text-anchor="middle" style="fill:var(--p);font:600 12px var(--sans)">por dentro: int8</text>
<path class="f-flecha" d="M 158.3 75.6 A 148 148 0 0 1 194.5 74.7" style="stroke:var(--o);stroke-width:2.5"/>
<polygon points="197.5,75.0 188.0,69.1 187.1,79.0" style="fill:var(--o)"/>
<circle cx="165.9" cy="127.0" r="5" style="fill:var(--o)"/>
<circle cx="189.4" cy="126.5" r="5" style="fill:var(--o)"/>
<text x="152.3" y="79.6" text-anchor="end" style="fill:var(--o);font:800 13px var(--sans)">250</text>
<text x="202.5" y="78.7" text-anchor="start" style="fill:var(--o);font:800 13px var(--sans)">4</text>
<text x="180.0" y="66.0" text-anchor="middle" style="fill:var(--o);font:800 13px var(--sans)">+10</text>
<text class="f-t" x="28.0" y="372.0" style="font-size:13px">250 + 10 = 260 no cabe en 8 bits: queda 4.</text>
<text class="f-s" x="28.0" y="392.0" style="font-size:12px">En int8, el salto está abajo: 127 + 1 = −128.</text>
</svg>
