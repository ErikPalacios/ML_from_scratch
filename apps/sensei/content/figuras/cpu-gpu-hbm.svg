<line class="f-linea" x1="272" y1="146" x2="220" y2="134"/>
<rect class="f-card" x="46" y="58" width="42" height="20" rx="3"/>
<text class="f-s" x="67" y="72.5" text-anchor="middle" style="font-size:12px">2 GB</text>
<rect class="f-card" x="46" y="84" width="42" height="20" rx="3"/>
<text class="f-s" x="67" y="98.5" text-anchor="middle" style="font-size:12px">2 GB</text>
<rect class="f-card" x="46" y="110" width="42" height="20" rx="3"/>
<text class="f-s" x="67" y="124.5" text-anchor="middle" style="font-size:12px">2 GB</text>
<rect class="f-card" x="46" y="136" width="42" height="20" rx="3"/>
<text class="f-s" x="67" y="150.5" text-anchor="middle" style="font-size:12px">2 GB</text>
<rect class="f-card" x="272" y="58" width="42" height="20" rx="3"/>
<text class="f-s" x="293" y="72.5" text-anchor="middle" style="font-size:12px">2 GB</text>
<rect class="f-card" x="272" y="84" width="42" height="20" rx="3"/>
<text class="f-s" x="293" y="98.5" text-anchor="middle" style="font-size:12px">2 GB</text>
<rect class="f-card" x="272" y="110" width="42" height="20" rx="3"/>
<text class="f-s" x="293" y="124.5" text-anchor="middle" style="font-size:12px">2 GB</text>
<rect class="f-card" x="272" y="136" width="42" height="20" rx="3"/>
<text class="f-s" x="293" y="150.5" text-anchor="middle" style="font-size:12px">2 GB</text>
<rect class="f-dark" x="140" y="82" width="80" height="62" rx="8"/>
<text class="f-dark-t" x="180" y="118" text-anchor="middle" style="font-size:14px;font-weight:700">GPU</text>
<text class="f-s" x="28" y="198" style="font-size:12px">8 chips × 32 cables = 256 cables a 10 Gb/s</text>
<text class="f-t" x="28" y="218" style="font-size:13px">256 × 10 ÷ 8 = 320 GB/s</text>

<text class="f-l" x="28" y="252" style="font-size:12px">LA H100 SXM · HBM3 PEGADA AL CHIP</text>
<rect class="f-chip" x="28" y="264" width="304" height="120" rx="10"/>
