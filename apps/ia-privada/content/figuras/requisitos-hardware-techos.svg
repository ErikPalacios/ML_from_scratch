<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 382" role="img" aria-labelledby="f-requisitos-hardware-techos-t" class="f-svg" style="max-width:420px">
<title id="f-requisitos-hardware-techos-t">Los tres techos de dos GPUs con el despacho, en conversaciones. L40S: por memoria caben 10, por ancho de banda se escriben 6 a 20 tokens por segundo, y la capacidad real, cuando el prefill y el decode comparten el tiempo, es 2. RTX PRO 6000 Server Edition: 30, 22 y 6. Una línea punteada marca las 5.7 conversaciones de la hora pico: una L40S queda muy por debajo; una Server Edition, apenas arriba.</title>
<text class="f-l" x="14" y="24">LOS TRES TECHOS, EN CONVERSACIONES</text>
<text class="f-t" x="14" y="54" style="font-size:14px">L40S · 48 GB · 864 GB/s</text>
<text class="f-s" x="14" y="78" style="font-size:12px">Memoria</text>
<rect class="f-b" x="118" y="64" width="70.0" height="18" rx="4"/>
<text class="f-t" x="194.0" y="78" style="font-size:13px">10</text>
<text class="f-s" x="14" y="106" style="font-size:12px">Ancho de banda</text>
<rect class="f-g" x="118" y="92" width="42.0" height="18" rx="4"/>
<text class="f-t" x="166.0" y="106" style="font-size:13px">6</text>
<text class="f-s" x="14" y="134" style="font-size:12px">Capacidad real</text>
<rect class="f-o" x="118" y="120" width="14.0" height="18" rx="4"/>
<text class="f-t" x="138.0" y="134" style="font-size:13px">2</text>
<line x1="157.9" y1="58" x2="157.9" y2="142" style="stroke:var(--ink);stroke-width:1.5;stroke-dasharray:3 3"/>
<text class="f-t" x="14" y="180" style="font-size:14px">PRO 6000 Server · 96 GB</text>
<text class="f-s" x="14" y="204" style="font-size:12px">Memoria</text>
<rect class="f-b" x="118" y="190" width="210.0" height="18" rx="4"/>
<text class="f-t" x="334.0" y="204" style="font-size:13px">30</text>
<text class="f-s" x="14" y="232" style="font-size:12px">Ancho de banda</text>
<rect class="f-g" x="118" y="218" width="154.0" height="18" rx="4"/>
<text class="f-t" x="278.0" y="232" style="font-size:13px">22</text>
<text class="f-s" x="14" y="260" style="font-size:12px">Capacidad real</text>
<rect class="f-o" x="118" y="246" width="42.0" height="18" rx="4"/>
<text class="f-t" x="166.0" y="260" style="font-size:13px">6</text>
<line x1="157.9" y1="184" x2="157.9" y2="268" style="stroke:var(--ink);stroke-width:1.5;stroke-dasharray:3 3"/>
<line class="f-linea" x1="118" y1="292" x2="342.0" y2="292"/>
<line class="f-linea" x1="118.0" y1="292" x2="118.0" y2="296"/>
<text class="f-s" x="118.0" y="310" text-anchor="middle" style="font-size:12px">0</text>
<line class="f-linea" x1="188.0" y1="292" x2="188.0" y2="296"/>
<text class="f-s" x="188.0" y="310" text-anchor="middle" style="font-size:12px">10</text>
<line class="f-linea" x1="258.0" y1="292" x2="258.0" y2="296"/>
<text class="f-s" x="258.0" y="310" text-anchor="middle" style="font-size:12px">20</text>
<line class="f-linea" x1="328.0" y1="292" x2="328.0" y2="296"/>
<text class="f-s" x="328.0" y="310" text-anchor="middle" style="font-size:12px">30</text>
<text class="f-s" x="157.9" y="328" text-anchor="middle" style="font-size:12px">↑ 5.7 en el pico</text>
<text class="f-s" x="14" y="352" style="font-size:12px">Capacidad real: el ancho de banda y el prefill</text>
<text class="f-s" x="14" y="368" style="font-size:12px">comparten el tiempo de la GPU (el paso 5).</text>
</svg>
