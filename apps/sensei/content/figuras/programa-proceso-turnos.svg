<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 428" role="img" aria-labelledby="f-programa-proceso-turnos-t" class="f-svg" style="max-width:420px">
<title id="f-programa-proceso-turnos-t">Cuatro fotos, A, B, C y D, que piden 40 milisegundos de CPU cada una, hechas de tres maneras sobre la misma escala de 0 a 160 milisegundos. Arriba, un núcleo las hace una tras otra: salen a los 40, 80, 120 y 160 milisegundos, con un promedio de 100, y hay 3 cambios de contexto. En medio, un núcleo las turna en pedazos de 10 milisegundos, A, B, C, D, A, B, C, D y así: salen a los 130, 140, 150 y 160 milisegundos, con un promedio de 145, y hay 15 cambios de contexto. Abajo, cuatro núcleos hacen una foto cada uno al mismo tiempo: las cuatro salen a los 40 milisegundos.</title>
