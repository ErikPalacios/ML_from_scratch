<title id="f-embeddings-grafo-t">Una búsqueda en un índice HNSW con dos niveles y 24 puntos. Arriba, el nivel 1 tiene solo 6 puntos, unidos por saltos largos. La búsqueda entra por el punto de la izquierda y da 3 saltos largos, cada uno al vecino más cercano a la consulta, una estrella abajo a la derecha. Luego baja al nivel 0, donde están los 24 puntos unidos por caminos cortos, y da 2 pasos cortos más hasta el vecino más cercano de verdad. En total comparó la consulta contra 12 de los 24 puntos.</title>
