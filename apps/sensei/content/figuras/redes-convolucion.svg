<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" role="img" aria-labelledby="f-redes-convolucion-t" class="f-svg" style="max-width:420px">
<title id="f-redes-convolucion-t">Una convolución. Arriba, una cuadrícula de 5 por 5 píxeles: las tres columnas de la izquierda claras (8 y 9) y las dos de la derecha oscuras (0 y 1). Un filtro de 3 por 3 con columnas de pesos 1, 0 y menos 1 está sobre las filas 1 a 3 y columnas 2 a 4. Multiplica cada píxel por su peso y suma: 8 más 8 más 8 da 24, que se escribe en la salida. La salida completa es de 3 por 3: 0, 24, 25 en cada fila, aproximadamente. Los números grandes marcan el borde entre lo claro y lo oscuro.</title>
