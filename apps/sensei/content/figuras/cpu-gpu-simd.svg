<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 450" role="img" aria-labelledby="f-cpu-gpu-simd-t" class="f-svg" style="max-width:420px">
<title id="f-cpu-gpu-simd-t">Una instrucción y cuántos números procesa. Arriba, una suma normal: 2.5 más 1.5 da 4.0, una instrucción y una suma. En medio, una suma con AVX-512: el registro a tiene 16 números en fila, el registro b otros 16, y una sola instrucción produce las 16 sumas a la vez, en los carriles 0 a 15. Abajo, los mismos 512 bits según el formato: caben 16 números FP32 de 32 bits, 32 números FP16 o BF16 de 16 bits, o 64 números INT8 de 8 bits.</title>
