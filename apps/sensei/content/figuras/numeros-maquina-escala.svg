<line x1="177.6" y1="388" x2="177.6" y2="412" style="stroke:var(--b);stroke-width:3;stroke-linecap:round"/>
<text x="177.6" y="428.0" text-anchor="middle" style="fill:var(--b);font:800 12px var(--sans)">1 = 0.197</text>
<line x1="327.2" y1="388" x2="327.2" y2="412" style="stroke:var(--muted);stroke-width:1.5;stroke-linecap:round"/>
<text class="f-s" x="327.2" y="428.0" text-anchor="end" style="font-size:11px">2</text>
<circle cx="104.0" cy="400" r="5.5" style="fill:var(--o)"/>
<text x="104.0" y="428.0" text-anchor="middle" style="fill:var(--o);font:800 12px var(--sans)">0.1</text>
<path class="f-flecha" d="M 104.0 391 Q 140.8 360 173.6 386" style="stroke:var(--o);stroke-width:2.5"/>
<polygon points="176.6,390 166.6,386 172.6,378" style="fill:var(--o)"/>
<text x="140.8" y="364.0" text-anchor="middle" style="fill:var(--o);font:800 12px var(--sans)">salta</text>
<rect class="f-chip" x="24.0" y="440.0" width="312.0" height="36.0" rx="10"/>
<text class="f-t" x="38.0" y="463.0" style="font-size:13px">El 0.1 vuelve como 0.197: un error de 97 %.</text>
</svg>
