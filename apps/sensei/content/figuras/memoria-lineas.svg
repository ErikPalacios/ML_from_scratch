<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 512" role="img" aria-labelledby="f-memoria-lineas-t" class="f-svg" style="max-width:420px">
<title id="f-memoria-lineas-t">Una matriz de 4 filas por 8 columnas guardada fila tras fila. Arriba, cómo queda en la memoria: la fila 0, luego la 1, la 2 y la 3, una detrás de otra, en bloques de 4 números; cada bloque es una línea de caché (en una CPU real, una línea trae 16 números float32). En medio, la matriz recorrida por filas, con el orden de lectura del 1 al 32: solo la primera lectura de cada línea es un fallo que va a la RAM; las otras tres ya llegaron con ella. Son 8 fallos en 32 lecturas. Abajo, la misma matriz recorrida por columnas: cada lectura cae en una línea distinta, y si la matriz no cabe en la caché, cuando el recorrido vuelve por la siguiente columna esa línea ya se fue. Las 32 lecturas son fallos.</title>
<rect class="f-card" x="10" y="10" width="340" height="492" rx="16"/>
