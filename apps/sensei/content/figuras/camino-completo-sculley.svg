<rect class="f-chip" x="132" y="50" width="96" height="54" rx="10"/>
<text class="f-s" x="180" y="73" text-anchor="middle">Recolección</text><text class="f-s" x="180" y="89" text-anchor="middle">de datos</text>
<rect class="f-chip" x="240" y="50" width="96" height="54" rx="10"/>
<text class="f-s" x="288" y="73" text-anchor="middle">Extracción</text><text class="f-s" x="288" y="89" text-anchor="middle">de features</text>
<rect class="f-chip" x="24" y="112" width="96" height="54" rx="10"/>
<text class="f-s" x="72" y="135" text-anchor="middle">Verificación</text><text class="f-s" x="72" y="151" text-anchor="middle">de datos</text>
<rect class="f-chip" x="240" y="112" width="96" height="54" rx="10"/>
<text class="f-s" x="288" y="135" text-anchor="middle">Recursos</text><text class="f-s" x="288" y="151" text-anchor="middle">de máquina</text>
<rect class="f-chip" x="24" y="174" width="96" height="54" rx="10"/>
<text class="f-s" x="72" y="197" text-anchor="middle">Herramientas</text><text class="f-s" x="72" y="213" text-anchor="middle">de análisis</text>
<rect class="f-chip" x="240" y="174" width="96" height="54" rx="10"/>
<text class="f-s" x="288" y="197" text-anchor="middle">Gestión</text><text class="f-s" x="288" y="213" text-anchor="middle">de procesos</text>
