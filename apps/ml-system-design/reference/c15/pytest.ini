# Configuración de pytest para TODO el caso c15: `cd reference/c15 && pytest` corre las 3 carpetas.
# Sin Redis, sin Kafka, sin online store: los servicios externos están detrás de interfaces con fakes.
[pytest]
# Cada carpeta entra al sys.path: los tests importan `features`, `model`, `auction`, `tokens`, `ad_api`,
# `build_training_set`, `train_logreg`, `calibration`, `offline_metrics`… como módulos sueltos
# (training/ importa serving/features.py y serving/model.py, igual que la imagen del job de entrenamiento)
pythonpath = serving training eval
testpaths = serving/tests training/tests eval/tests
# Salida compacta: en CI importa la lista de fallos
addopts = -q
