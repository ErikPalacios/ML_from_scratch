<text class="f-s" x="186.0" y="84.0" text-anchor="middle" style="font-size:12px;font-weight:700">promedio ≈ 128</text>
<line x1="186.0" y1="90" x2="186.0" y2="212" style="stroke:var(--ink);stroke-width:2;stroke-dasharray:5 4"/>
