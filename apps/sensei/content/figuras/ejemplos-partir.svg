<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 440" role="img" aria-labelledby="f-ejemplos-partir-t" class="f-svg" style="max-width:420px">
<title id="f-ejemplos-partir-t">Tres formas de repartir las mismas 12 fotos de tres vendedores, A, B y C, ordenadas de enero a marzo. Al azar: tres fotos van a test, una de cada vendedor, y los tres vendedores quedan en train y en test. Por tiempo: las tres fotos más recientes, después de un corte, van a test. Por grupo: las cuatro fotos del vendedor C van a test y las de A y B, a train.</title>
<rect class="f-card" x="10" y="10" width="340" height="420" rx="16"/>
