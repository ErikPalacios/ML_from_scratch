<line class="f-flecha" x1="168" y1="253" x2="188" y2="253"/><path class="f-punta" d="M187,248 L187,258 L195,253 Z"/><path class="f-punta" d="M173,248 L173,258 L165,253 Z"/>
<text class="f-s" x="28" y="308" style="font-size:12px">2 all-reduce por capa: 128 por token.</text>
<line x1="28" y1="320" x2="332" y2="320" style="stroke:var(--tm-line);stroke-width:1"/>
