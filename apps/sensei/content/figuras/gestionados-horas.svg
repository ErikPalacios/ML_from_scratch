<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 390" role="img" aria-labelledby="f-gestionados-horas-t" class="f-svg" style="max-width:420px">
<title id="f-gestionados-horas-t">Una gráfica del costo al mes contra las horas de GPU activa al día, de 0 a 24. Una L4 dedicada cuesta lo mismo con cualquier número de horas: una línea plana en unos 588 dólares. Una L4 en Cloud Run cuesta 1.05 dólares por hora activa: una línea que sale de cero y sube hasta unos 766 dólares a las 24 horas. Se cruzan cerca de las 18.4 horas. La herramienta de moderación, con 2 horas al día, cuesta unos 64 dólares en Cloud Run. C01, que trabaja las 24 horas, queda del lado donde gana la dedicada.</title>
<rect class="f-card" x="10" y="10" width="340" height="370" rx="16"/>
<text class="f-l" x="24" y="36">US$ AL MES CONTRA HORAS ACTIVAS AL DÍA</text>
<line class="f-linea" x1="56" y1="300.0" x2="330" y2="300.0" style="opacity:.35"/>
<text class="f-s" x="50" y="304.0" text-anchor="end" style="font-size:12px">0</text>
<line class="f-linea" x1="56" y1="242.5" x2="330" y2="242.5" style="opacity:.35"/>
<text class="f-s" x="50" y="246.5" text-anchor="end" style="font-size:12px">200</text>
<line class="f-linea" x1="56" y1="185.0" x2="330" y2="185.0" style="opacity:.35"/>
<text class="f-s" x="50" y="189.0" text-anchor="end" style="font-size:12px">400</text>
<line class="f-linea" x1="56" y1="127.5" x2="330" y2="127.5" style="opacity:.35"/>
<text class="f-s" x="50" y="131.5" text-anchor="end" style="font-size:12px">600</text>
<line class="f-linea" x1="56" y1="70.0" x2="330" y2="70.0" style="opacity:.35"/>
<text class="f-s" x="50" y="74.0" text-anchor="end" style="font-size:12px">800</text>
<text class="f-s" x="56.0" y="318" text-anchor="middle" style="font-size:12px">0</text>
<text class="f-s" x="124.5" y="318" text-anchor="middle" style="font-size:12px">6</text>
<text class="f-s" x="193.0" y="318" text-anchor="middle" style="font-size:12px">12</text>
<text class="f-s" x="261.5" y="318" text-anchor="middle" style="font-size:12px">18</text>
<text class="f-s" x="330.0" y="318" text-anchor="middle" style="font-size:12px">24</text>
<text class="f-s" x="193" y="336" text-anchor="middle" style="font-size:12px">horas de GPU activa al día</text>
<line class="f-flecha" x1="56" y1="300" x2="330" y2="300"/>
<rect class="f-g" x="56" y="70" width="210.1" height="230" style="opacity:.12"/>
<line x1="56" y1="130.9" x2="330" y2="130.9" style="stroke:var(--b);stroke-width:3"/>
<text class="f-t" x="62" y="122.9" style="font-size:12px;fill:var(--b)">L4 dedicada ≈ 588</text>
<line x1="56.0" y1="300.0" x2="330.0" y2="79.8" style="stroke:var(--o);stroke-width:3"/>
<text class="f-t" x="182" y="232" style="font-size:12px;fill:var(--o)">Cloud Run</text>
<text class="f-t" x="182" y="248" style="font-size:12px;fill:var(--o)">US$1.05/h</text>
<line class="f-linea" x1="266.1" y1="130.9" x2="266.1" y2="300" stroke-dasharray="3 3"/>
<circle class="f-ink" cx="266.1" cy="130.9" r="5"/>
<text class="f-t" x="260" y="272" text-anchor="end" style="font-size:12px">cruce ≈ 18.4 h</text>
<circle class="f-o" cx="78.8" cy="281.6" r="5"/>
<text class="f-s" x="92" y="293" style="font-size:12px">moderación: 2 h, ≈ 64</text>
<circle class="f-o" cx="330.0" cy="79.8" r="5"/>
<text class="f-s" x="322" y="64" text-anchor="end" style="font-size:12px">C01: 24 h, ≈ 766</text>
<text class="f-t" x="120" y="180" text-anchor="middle" style="font-size:12px;fill:var(--g)">gana serverless</text>
</svg>
