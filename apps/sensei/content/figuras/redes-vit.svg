<line x1="138" y1="52" x2="138" y2="206" style="stroke:var(--muted);stroke-width:.7"/>
<line x1="28" y1="162" x2="182" y2="162" style="stroke:var(--muted);stroke-width:.7"/>
<line x1="149" y1="52" x2="149" y2="206" style="stroke:var(--muted);stroke-width:.7"/>
<line x1="28" y1="173" x2="182" y2="173" style="stroke:var(--muted);stroke-width:.7"/>
