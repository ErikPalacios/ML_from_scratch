# Configuración de la etapa `route` (pipeline/routing.py). La lee el worker al arrancar; un cambio de
# umbrales es un cambio de configuración versionado (PR + revisión), no un hotfix en el código.
#
# thresholds: confianza CALIBRADA mínima por campo para aceptar sin revisión. Los valores de aquí son
#   ILUSTRATIVOS: en producción los escribe calibrate_thresholds.py (Wilson ≥ 0.995, o ≥ 0.999 para
#   los campos críticos) a partir del gold set + la auditoría aleatoria. null = este campo nunca se
#   auto-acepta (siempre lo ve una persona), por ejemplo porque no hay datos para certificarlo.
# required: sin estos campos el documento no sirve; si falta uno o no pasa su umbral, va a revisión.
#   Un campo opcional bajo su umbral NO bloquea el STP: se guarda como "no verificado".
# Los campos con source "xml" llegan con confianza 1.0 y pasan cualquier umbral, pero NO se saltan las
# validaciones (RFC, totales, estatus en el SAT).
version: "2026-09-28-illustrative"

critical_fields: [curp, curp_representante, rfc, emisor_rfc, receptor_rfc, clabe, subtotal, total, saldo_final,
                  monto_solicitado]

# Fuentes que nunca se auto-aceptan. Textract solo reconoce escritura a mano en inglés: un campo
# manuscrito en español con "confianza alta" no merece esa confianza.
never_auto_sources: [ocr_handwriting]

doc_types:
  factura:
    required: [uuid, emisor_rfc, receptor_rfc, fecha, subtotal, total]
    thresholds: {uuid: 0.99, emisor_rfc: 0.99, receptor_rfc: 0.99, fecha: 0.97, subtotal: 0.99, total: 0.99,
                 descuento: 0.97, iva: 0.98, retenciones: 0.98, emisor_nombre: 0.95, receptor_nombre: 0.95}
  ine:
    required: [nombre_completo, curp, fecha_nacimiento, vigencia]
    # domicilio: null → nunca se auto-acepta (ejemplo: aún no hay etiquetas para certificarlo). Como no
    # es requerido, no bloquea el STP: se guarda como "no verificado" y el core no lo usa como dato firme.
    thresholds: {nombre_completo: 0.97, curp: 0.995, fecha_nacimiento: 0.98, vigencia: 0.98, clave_elector: 0.97,
                 domicilio: null}
  comprobante_domicilio:
    required: [nombre_titular, domicilio, codigo_postal, fecha_emision]
    thresholds: {nombre_titular: 0.96, domicilio: 0.95, codigo_postal: 0.98, fecha_emision: 0.97}
  estado_cuenta:
    required: [titular, clabe, periodo_fin, saldo_final]
    thresholds: {titular: 0.96, clabe: 0.995, banco: 0.95, periodo_inicio: 0.97, periodo_fin: 0.97,
                 saldo_final: 0.99}
  solicitud:
    required: [razon_social, rfc, curp_representante, monto_solicitado, plazo_meses]
    thresholds: {razon_social: 0.96, rfc: 0.99, curp_representante: 0.995, monto_solicitado: 0.995,
                 plazo_meses: 0.97}

# SLA de revisión: p90 ≤ 4 horas HÁBILES. El horario y los días inhábiles son del equipo de revisión
# (supuesto: lunes a viernes, 09:00–19:00, hora del centro de México); los días festivos los carga
# operaciones cada año (no se adivinan en código).
review_sla:
  business_hours: 4
  timezone: America/Mexico_City
  workdays: [0, 1, 2, 3, 4]   # lunes = 0
  start: "09:00"
  end: "19:00"
  holidays: []                # ej. ["2026-11-16", "2026-12-25"], los define operaciones

# Bono de prioridad por etapa del crédito, en minutos: un documento que bloquea un desembolso "se
# adelanta" 2 h en la fila, pero no puede dejar sin atender a los demás indefinidamente, porque el
# resto envejece hacia su propio vencimiento.
stage_bonus_minutes: {desembolso: 120, evaluacion: 60, onboarding: 0}

# Auditoría de QA: 2 % de los documentos STP, elegidos al azar (hash del document_id), revisados
# completos. Es la única medición sin sesgo de la exactitud de lo que nadie más mira.
audit_rate: 0.02
