<text class="f-s" x="30" y="272" style="font-size:12px;font-family:var(--mono)">c07d11ab</text>
<text class="f-s" x="122" y="272" style="font-size:12px;font-family:var(--mono)">200</text>
<text class="f-s" x="170" y="272" style="font-size:12px;font-family:var(--mono)">31 ms</text>
<text class="f-s" x="238" y="272" style="font-size:12px;font-family:var(--mono)">Bicis 0.88</text>
<text class="f-s" x="24" y="298" style="font-size:12px">una fila por request, con todos sus campos</text>
