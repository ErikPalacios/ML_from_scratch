<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 372" role="img" aria-labelledby="f-numeros-maquina-recta-t" class="f-svg" style="max-width:420px">
<title id="f-numeros-maquina-recta-t">Todos los números positivos del formato FP8 E5M2 entre 0 y 16, sobre una recta. Entre 0 y 1 hay 59, tan juntos que forman un bloque. De 1 a 2 hay cuatro: 1, 1.25, 1.5 y 1.75, separados por 0.25. De 2 a 4 hay cuatro: 2, 2.5, 3 y 3.5, separados por 0.5. De 4 a 8: 4, 5, 6 y 7, separados por 1. De 8 a 16: 8, 10, 12 y 14, separados por 2. Cada tramo tiene la misma cantidad de números; la separación se duplica de tramo en tramo, pero el error relativo es el mismo. FP16 tiene 1,024 números por tramo y FP32, 8,388,608.</title>
<rect class="f-card" x="10" y="10" width="340" height="352" rx="16"/>
