<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 400" role="img" aria-labelledby="f-costo-total-libros-t" class="f-svg" style="max-width:420px">
<title id="f-costo-total-libros-t">Tres maneras de repartir en el tiempo el servidor del despacho de US$67,191 (Exxact con 3 L40S). A lo ancho, los meses de 0 a 40; a lo alto, lo que vale el servidor en los libros, de 0 a 70,000 dólares. La depreciación lineal baja en línea recta hasta US$13,438 al mes 36, el 20 % de reventa supuesto. La acelerada de saldo doble baja a US$22,397 al terminar el año 1 y a US$13,438 al terminar el año 2, y ahí se queda. La deducción fiscal de la LISR, 30 % al año, baja un poco más rápido que la lineal porque no resta reventa: queda en US$6,719 al mes 36 y llega a cero en el año 4. Un punto aparte marca el mercado de hoy: una L40S de 2023 se vende usada en ≈ 84 % del precio de una nueva en bulk (fuente secundaria), mucho arriba de lo que dicen las tres líneas.</title>
