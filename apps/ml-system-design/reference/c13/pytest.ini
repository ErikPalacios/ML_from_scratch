# Configuración de pytest para TODO el caso c13: `cd reference/c13 && pytest` corre las 4 carpetas.
# Sin GPU, sin modelo de ASR, sin SFU: el modelo está detrás de una interfaz con un fake.
[pytest]
# Cada carpeta entra al sys.path: los tests importan `chunker`, `stabilizer`, `asr_server`,
# `session_router` y `wer` como módulos sueltos (asr_server importa chunker y stabilizer igual)
pythonpath = streaming server gateway eval
testpaths = streaming/tests server/tests gateway/tests eval/tests
# Salida compacta: en CI importa la lista de fallos
addopts = -q
