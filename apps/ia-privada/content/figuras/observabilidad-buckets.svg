<rect class="f-chip" x="100" y="242" width="60" height="26" rx="4"/>
<rect class="f-chip" x="220" y="242" width="60" height="26" rx="4"/>
<line class="f-linea" x1="40" y1="268" x2="340" y2="268"/>
<line class="f-linea" x1="40" y1="263" x2="40" y2="273"/>
<line class="f-linea" x1="100" y1="260" x2="100" y2="273"/>
<line class="f-linea" x1="160" y1="260" x2="160" y2="273"/>
<line class="f-linea" x1="220" y1="258" x2="220" y2="274" style="stroke:var(--o);stroke-width:2"/>
<line class="f-linea" x1="280" y1="260" x2="280" y2="273"/>
<line class="f-linea" x1="340" y1="263" x2="340" y2="273"/>
<circle class="f-o" cx="112" cy="255" r="6" style="stroke:var(--blk);stroke-width:2"/>
<circle class="f-y" cx="208" cy="255" r="6" style="stroke:var(--blk);stroke-width:2"/>
