<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 420" role="img" aria-labelledby="f-varias-gpus-burbuja-t" class="f-svg" style="max-width:420px">
<title id="f-varias-gpus-burbuja-t">La burbuja de un pipeline de 3 GPUs. Arriba, con un solo micro-batch: en el turno 1 trabaja la GPU 0, en el 2 la GPU 1 y en el 3 la GPU 2; en cada turno dos de las tres esperan, 2 de cada 3 lugares vacíos, 67 % de ocio. Abajo, con 4 micro-batches que entran uno tras otro: en 6 turnos, cada GPU trabaja 4 y espera 2; después del arranque las tres trabajan a la vez, y el ocio baja a 2 de 6, 33 %.</title>
<rect class="f-card" x="10" y="10" width="340" height="400" rx="16"/>
<text class="f-l" x="28" y="36">1 CONVERSACIÓN: m = 1</text>
<text class="f-s" x="78" y="69" text-anchor="end" style="font-size:12px">GPU 0</text>
<rect class="f-g" x="86" y="50" width="74" height="28" rx="4"/>
<text class="f-s" x="123.0" y="69" text-anchor="middle" style="font-size:12px;font-weight:700">1</text>
<rect x="164" y="50" width="74" height="28" rx="4" style="fill:none;stroke:var(--tm-ink3);stroke-width:1.2;stroke-dasharray:4 3"/>
<rect x="242" y="50" width="74" height="28" rx="4" style="fill:none;stroke:var(--tm-ink3);stroke-width:1.2;stroke-dasharray:4 3"/>
<text class="f-s" x="78" y="103" text-anchor="end" style="font-size:12px">GPU 1</text>
<rect x="86" y="84" width="74" height="28" rx="4" style="fill:none;stroke:var(--tm-ink3);stroke-width:1.2;stroke-dasharray:4 3"/>
<rect class="f-g" x="164" y="84" width="74" height="28" rx="4"/>
<text class="f-s" x="201.0" y="103" text-anchor="middle" style="font-size:12px;font-weight:700">1</text>
<rect x="242" y="84" width="74" height="28" rx="4" style="fill:none;stroke:var(--tm-ink3);stroke-width:1.2;stroke-dasharray:4 3"/>
<text class="f-s" x="78" y="137" text-anchor="end" style="font-size:12px">GPU 2</text>
<rect x="86" y="118" width="74" height="28" rx="4" style="fill:none;stroke:var(--tm-ink3);stroke-width:1.2;stroke-dasharray:4 3"/>
<rect x="164" y="118" width="74" height="28" rx="4" style="fill:none;stroke:var(--tm-ink3);stroke-width:1.2;stroke-dasharray:4 3"/>
<rect class="f-g" x="242" y="118" width="74" height="28" rx="4"/>
<text class="f-s" x="279.0" y="137" text-anchor="middle" style="font-size:12px;font-weight:700">1</text>
<text class="f-s" x="123.0" y="164" text-anchor="middle" style="font-size:12px">1</text>
<text class="f-s" x="201.0" y="164" text-anchor="middle" style="font-size:12px">2</text>
<text class="f-s" x="279.0" y="164" text-anchor="middle" style="font-size:12px">3</text>
<text class="f-s" x="28" y="184" style="font-size:12px">Ocio: (3 − 1) ÷ (1 + 3 − 1) = 2 ÷ 3 ≈ 67 %.</text>
<line x1="28" y1="200" x2="332" y2="200" style="stroke:var(--tm-line);stroke-width:1"/>
<text class="f-l" x="28" y="226">4 MICRO-BATCHES: m = 4</text>
<text class="f-s" x="78" y="259" text-anchor="end" style="font-size:12px">GPU 0</text>
<rect class="f-g" x="86" y="240" width="37" height="28" rx="4"/>
<text class="f-s" x="104.5" y="259" text-anchor="middle" style="font-size:12px;font-weight:700">1</text>
<rect class="f-g" x="127" y="240" width="37" height="28" rx="4"/>
<text class="f-s" x="145.5" y="259" text-anchor="middle" style="font-size:12px;font-weight:700">2</text>
<rect class="f-g" x="168" y="240" width="37" height="28" rx="4"/>
<text class="f-s" x="186.5" y="259" text-anchor="middle" style="font-size:12px;font-weight:700">3</text>
<rect class="f-g" x="209" y="240" width="37" height="28" rx="4"/>
<text class="f-s" x="227.5" y="259" text-anchor="middle" style="font-size:12px;font-weight:700">4</text>
<rect x="250" y="240" width="37" height="28" rx="4" style="fill:none;stroke:var(--tm-ink3);stroke-width:1.2;stroke-dasharray:4 3"/>
<rect x="291" y="240" width="37" height="28" rx="4" style="fill:none;stroke:var(--tm-ink3);stroke-width:1.2;stroke-dasharray:4 3"/>
<text class="f-s" x="78" y="293" text-anchor="end" style="font-size:12px">GPU 1</text>
<rect x="86" y="274" width="37" height="28" rx="4" style="fill:none;stroke:var(--tm-ink3);stroke-width:1.2;stroke-dasharray:4 3"/>
<rect class="f-g" x="127" y="274" width="37" height="28" rx="4"/>
<text class="f-s" x="145.5" y="293" text-anchor="middle" style="font-size:12px;font-weight:700">1</text>
<rect class="f-g" x="168" y="274" width="37" height="28" rx="4"/>
<text class="f-s" x="186.5" y="293" text-anchor="middle" style="font-size:12px;font-weight:700">2</text>
<rect class="f-g" x="209" y="274" width="37" height="28" rx="4"/>
<text class="f-s" x="227.5" y="293" text-anchor="middle" style="font-size:12px;font-weight:700">3</text>
<rect class="f-g" x="250" y="274" width="37" height="28" rx="4"/>
<text class="f-s" x="268.5" y="293" text-anchor="middle" style="font-size:12px;font-weight:700">4</text>
<rect x="291" y="274" width="37" height="28" rx="4" style="fill:none;stroke:var(--tm-ink3);stroke-width:1.2;stroke-dasharray:4 3"/>
<text class="f-s" x="78" y="327" text-anchor="end" style="font-size:12px">GPU 2</text>
<rect x="86" y="308" width="37" height="28" rx="4" style="fill:none;stroke:var(--tm-ink3);stroke-width:1.2;stroke-dasharray:4 3"/>
<rect x="127" y="308" width="37" height="28" rx="4" style="fill:none;stroke:var(--tm-ink3);stroke-width:1.2;stroke-dasharray:4 3"/>
<rect class="f-g" x="168" y="308" width="37" height="28" rx="4"/>
<text class="f-s" x="186.5" y="327" text-anchor="middle" style="font-size:12px;font-weight:700">1</text>
<rect class="f-g" x="209" y="308" width="37" height="28" rx="4"/>
<text class="f-s" x="227.5" y="327" text-anchor="middle" style="font-size:12px;font-weight:700">2</text>
<rect class="f-g" x="250" y="308" width="37" height="28" rx="4"/>
<text class="f-s" x="268.5" y="327" text-anchor="middle" style="font-size:12px;font-weight:700">3</text>
<rect class="f-g" x="291" y="308" width="37" height="28" rx="4"/>
<text class="f-s" x="309.5" y="327" text-anchor="middle" style="font-size:12px;font-weight:700">4</text>
<text class="f-s" x="104.5" y="354" text-anchor="middle" style="font-size:12px">1</text>
<text class="f-s" x="145.5" y="354" text-anchor="middle" style="font-size:12px">2</text>
<text class="f-s" x="186.5" y="354" text-anchor="middle" style="font-size:12px">3</text>
<text class="f-s" x="227.5" y="354" text-anchor="middle" style="font-size:12px">4</text>
<text class="f-s" x="268.5" y="354" text-anchor="middle" style="font-size:12px">5</text>
<text class="f-s" x="309.5" y="354" text-anchor="middle" style="font-size:12px">6</text>
<text class="f-s" x="28" y="374" style="font-size:12px">Ocio: (3 − 1) ÷ (4 + 3 − 1) = 2 ÷ 6 ≈ 33 %.</text>
<text class="f-s" x="28" y="400" style="font-size:12px">Dentro: el micro-batch. Abajo: el turno.</text>
</svg>
