<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 372" role="img" aria-labelledby="f-caso-clinica-dia-t" class="f-svg" style="max-width:420px">
<title id="f-caso-clinica-dia-t">Un día de consulta en la clínica, en resúmenes que se escriben a la vez, de la medianoche a la medianoche (perfil supuesto). De noche casi cero. A las 7:00, 14:00 y 21:00, el pase de turno: 36 resúmenes en 20 minutos, ≈ 0.94 a la vez. A las 8:00, cuando abre la torre de consultorios, ≈ 200 resúmenes en 20 minutos: ≈ 5.2 a la vez. El resto del día, ≈ 0.66. Una línea en 7 marca lo que aguanta una sola RTX PRO 6000 Server Edition a 20 tokens por segundo; otra en 2, una L40S en INT4. Una sola Server Edition cubre el pico de las 8:00; la segunda tarjeta no es para el pico, es para la noche en que falle la primera.</title>
<text class="f-l" x="14" y="24">UN DÍA DE CONSULTA · RESÚMENES A LA VEZ</text>
<text class="f-s" x="14" y="44" style="font-size:12px">perfil supuesto; el pico sale de la herramienta de sizing</text>
