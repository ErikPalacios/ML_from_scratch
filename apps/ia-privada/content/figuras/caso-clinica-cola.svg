<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 494" role="img" aria-labelledby="f-caso-clinica-cola-t" class="f-svg" style="max-width:420px">
<title id="f-caso-clinica-cola-t">El tiempo al primer token de un resumen en el pico de las 8:00, en segundos, con Qwen3.8 27B. Dos RTX PRO 6000 Server Edition en FP8: 1.39 s con un expediente típico de 12,000 tokens sin fila, 3.69 s con uno largo de 30,000 y 3.7 s en el p95 con la fila. Con una sola Server Edition, porque la otra falló: 1.39, 3.69 y 4.3. Tres L40S en INT4 de AWQ: 3.84, 10.19 y 10.3. Cuatro L40S: 3.84, 10.19 y 10.2. Una línea punteada marca el objetivo de 8 segundos en el p95: las L40S se pasan con cualquier número de tarjetas porque el expediente largo tarda 10 segundos en leerse aunque no haya fila. Herramienta de velocidad y simulación del caso.</title>
<text class="f-l" x="14" y="24">TTFT DE UN RESUMEN A LAS 8:00, EN SEGUNDOS</text>
<text class="f-t" x="14" y="54" style="font-size:14px">2 × Server Edition, FP8</text>
<text class="f-s" x="14" y="74" style="font-size:12px">12,000 sin fila</text>
<rect class="f-off" x="124" y="62" width="22.2" height="15" rx="3"/>
<text class="f-s" x="151.2" y="74" style="font-size:12px">1.39</text>
<text class="f-s" x="14" y="94" style="font-size:12px">30,000 sin fila</text>
