<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 400" role="img" aria-labelledby="f-la-t" class="f-svg" style="max-width:420px">
<title id="f-la-t">A quién mira la palabra banco en la frase «Me senté en el banco», con los números del ejemplo: 77.8 % a senté, 10.5 % a sí misma y 3.9 % a cada una de Me, en y el. El nuevo vector de banco es la mezcla de los valores V con esos porcentajes, así que queda teñido de sentarse: es el banco del parque.</title>
<rect class="f-card" x="10" y="10" width="340" height="296" rx="16"/>
<text class="f-l" x="28" y="36">LA ATENCIÓN DE «BANCO»</text>
<path d="M252,170 C202,170 180,70 142,70" style="fill:none;stroke:var(--b);stroke-width:1.5;stroke-linecap:round;opacity:0.38"/>
<path d="M252,170 C202,170 180,120 142,120" style="fill:none;stroke:var(--b);stroke-width:10.9;stroke-linecap:round;opacity:0.86"/>
<path d="M252,170 C202,170 180,170 142,170" style="fill:none;stroke:var(--b);stroke-width:1.5;stroke-linecap:round;opacity:0.38"/>
<path d="M252,170 C202,170 180,220 142,220" style="fill:none;stroke:var(--b);stroke-width:1.5;stroke-linecap:round;opacity:0.38"/>
<path d="M252,170 C202,170 180,270 142,270" style="fill:none;stroke:var(--b);stroke-width:1.5;stroke-linecap:round;opacity:0.42"/>
<rect class="f-chip" x="24" y="53" width="118" height="34" rx="9"/>
<text class="f-t" x="36" y="75" style="font-size:14px">Me</text>
<text class="f-s" x="132" y="75" text-anchor="end" style="font-size:12px">3.9 %</text>
<rect class="f-b2" x="24" y="103" width="118" height="34" rx="9"/>
<text class="f-t" x="36" y="125" style="font-size:14px">senté</text>
<text class="f-t" x="132" y="125" text-anchor="end" style="font-size:12px">77.8 %</text>
<rect class="f-chip" x="24" y="153" width="118" height="34" rx="9"/>
<text class="f-t" x="36" y="175" style="font-size:14px">en</text>
<text class="f-s" x="132" y="175" text-anchor="end" style="font-size:12px">3.9 %</text>
<rect class="f-chip" x="24" y="203" width="118" height="34" rx="9"/>
<text class="f-t" x="36" y="225" style="font-size:14px">el</text>
<text class="f-s" x="132" y="225" text-anchor="end" style="font-size:12px">3.9 %</text>
<rect class="f-chip" x="24" y="253" width="118" height="34" rx="9"/>
<text class="f-t" x="36" y="275" style="font-size:14px">banco</text>
<text class="f-s" x="132" y="275" text-anchor="end" style="font-size:12px">10.5 %</text>
<rect class="f-dark" x="252" y="144" width="86" height="52" rx="12"/>
<text class="f-dark-l" x="295" y="164" text-anchor="middle">Q DE</text>
<text class="f-dark-t" x="295" y="184" text-anchor="middle" style="font-size:14px;font-weight:700">banco</text>
<rect class="f-chip" x="10" y="318" width="340" height="72" rx="14"/>
<text class="f-s" x="24" y="342">Nuevo «banco» = 77.8 % de la V de «senté»</text>
<text class="f-s" x="24" y="362">+ 10.5 % de su propia V + 3.9 % de cada una</text>
<text class="f-s" x="24" y="382">de las otras tres: el banco del parque.</text>
</svg>
