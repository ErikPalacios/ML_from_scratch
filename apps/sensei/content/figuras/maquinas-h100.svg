<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 348" role="img" aria-labelledby="f-maquinas-h100-t" class="f-svg" style="max-width:420px">
<title id="f-maquinas-h100-t">Precio on-demand de una hora de la misma GPU H100 SXM según el proveedor, en dólares por GPU-hora, noviembre de 2026. Azure, East US: 12.29. Google Cloud, us-central1: 11.06. AWS, us-east-1: 6.88. Lambda, vigente desde el 16 de noviembre: 4.59. RunPod: 4.39. Las tres primeras son nubes de hiperescala y las dos últimas, neoclouds. Una H100 todo el mes cuesta cerca de 8,972 dólares en Azure y cerca de 3,205 en RunPod.</title>
