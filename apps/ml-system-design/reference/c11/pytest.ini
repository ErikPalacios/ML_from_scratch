# Configuración de pytest para TODO el caso c11: `cd reference/c11 && pytest` corre las cinco carpetas.
# Sin OpenSearch, sin GPU, sin llm-gateway: índice en memoria, embedder/reranker/LLM falsos.
[pytest]
# Cada carpeta entra al sys.path: los módulos se importan sueltos (`import acl`, `import hybrid`, …), igual que
# dentro de la imagen, donde los archivos de ingest/, retrieval/, answer/ y service/ van juntos en /app
pythonpath = ingest retrieval answer service eval
testpaths = ingest/tests retrieval/tests answer/tests service/tests eval/tests
# Salida compacta; y cualquier warning es un error (una API deprecada hoy es un upgrade roto mañana)
addopts = -q -W error
