<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 326" role="img" aria-labelledby="f-observabilidad-buckets-t" class="f-svg" style="max-width:420px">
<title id="f-observabilidad-buckets-t">Tres horas pico de 125 preguntas, todas con el mismo TTFT: 1.1 segundos, 1.9 segundos y 2.4 segundos. Arriba, con los bordes de fábrica de vLLM 0.34.0, las tres caen en el mismo bucket, de 1.0 a 2.5 segundos, y histogram_quantile da el mismo p95 de 2.425 segundos para las tres, arriba de la promesa de 2 segundos. Abajo, con bordes cada medio segundo, dan 1.475, 1.975 y 2.475 segundos: las dos primeras cumplen y la tercera no.</title>
<text class="f-l" x="14" y="20">LAS 125 PREGUNTAS DE TRES HORAS PICO</text>
<circle class="f-o" cx="20" cy="35" r="5"/><text class="f-s" x="30" y="39" style="font-size:12px">todas en 1.1 s</text>
<circle class="f-y" cx="130" cy="35" r="5"/><text class="f-s" x="140" y="39" style="font-size:12px">todas en 1.9 s</text>
<circle class="f-g" cx="240" cy="35" r="5"/><text class="f-s" x="250" y="39" style="font-size:12px">todas en 2.4 s</text>
<rect class="f-card" x="10" y="50" width="340" height="128" rx="14"/>
<text class="f-l" x="24" y="72">BORDES DE FÁBRICA · vLLM 0.34.0</text>
<rect class="f-chip" x="100" y="94" width="180" height="26" rx="4"/>
<text class="f-s" x="190" y="89" text-anchor="middle" style="font-size:12px">un solo bucket: (1.0, 2.5]</text>
<line class="f-linea" x1="40" y1="120" x2="340" y2="120"/>
<line class="f-linea" x1="40" y1="115" x2="40" y2="125"/>
<line class="f-linea" x1="70" y1="115" x2="70" y2="125"/>
<line class="f-linea" x1="100" y1="112" x2="100" y2="125"/>
<line class="f-linea" x1="280" y1="112" x2="280" y2="125"/>
<line class="f-linea" x1="340" y1="115" x2="340" y2="125"/>
<line class="f-linea" x1="220" y1="96" x2="220" y2="126" style="stroke:var(--o);stroke-dasharray:4 3"/>
<circle class="f-o" cx="112" cy="107" r="6" style="stroke:var(--blk);stroke-width:2"/>
<circle class="f-y" cx="208" cy="107" r="6" style="stroke:var(--blk);stroke-width:2"/>
<circle class="f-g" cx="268" cy="107" r="6" style="stroke:var(--blk);stroke-width:2"/>
<line class="f-linea" x1="271" y1="94" x2="271" y2="126" style="stroke:var(--ink);stroke-width:2.5"/>
<text class="f-s" x="40" y="140" text-anchor="middle" style="font-size:12px">0.5</text>
<text class="f-s" x="70" y="140" text-anchor="middle" style="font-size:12px">0.75</text>
<text class="f-s" x="100" y="140" text-anchor="middle" style="font-size:12px">1.0</text>
<text class="f-s" x="220" y="140" text-anchor="middle" style="font-size:12px;font-weight:700;fill:var(--o)">2 s promesa</text>
<text class="f-s" x="280" y="140" text-anchor="start" style="font-size:12px">2.5</text>
<text class="f-s" x="340" y="140" text-anchor="end" style="font-size:12px">3.0</text>
<text class="f-t" x="24" y="164" style="font-size:14px">Las tres dan p95 = 2.425 s</text>
