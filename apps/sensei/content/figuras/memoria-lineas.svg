<text class="f-s" x="28" y="136" style="font-size:12px;fill:var(--muted)">en el dibujo, 16 float32 en una CPU real</text>
<text class="f-s" x="28" y="162" style="font-weight:700">Por filas: 1 fallo cada 4 lecturas</text>
