<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 462" role="img" aria-labelledby="f-ee-t" class="f-svg" style="max-width:420px">
<title id="f-ee-t">Un índice vectorial por grupos, como estantes. El plano está dividido en cuatro estantes, A, B, C y D, cada uno con sus puntos. La búsqueda, una estrella, cae en el estante B, cerca de la orilla con el A, y solo se revisa el estante B: un cuarto del trabajo. Encuentra dos de sus tres vecinos más cercanos; el que falta, que de hecho es el más cercano de todos, quedó del otro lado de la orilla, en el estante A, y se pierde. El recall en 3 es 2 de 3, unos 0.67.</title>
<rect class="f-card" x="10" y="10" width="340" height="300" rx="16"/>
<text class="f-l" x="28" y="36">UN ÍNDICE POR ESTANTES</text>
<rect x="180" y="48" width="160" height="122" rx="10" style="fill:var(--b);opacity:.14"/>
<line class="f-flecha" x1="180" y1="48" x2="180" y2="296" style="stroke-dasharray:5 5;stroke-width:1.5"/>
<line class="f-flecha" x1="20" y1="170" x2="340" y2="170" style="stroke-dasharray:5 5;stroke-width:1.5"/>
<text class="f-l" x="28" y="64" text-anchor="start">ESTANTE A</text>
<text class="f-l" x="332" y="64" text-anchor="end">ESTANTE B</text>
<text class="f-l" x="28" y="290" text-anchor="start">ESTANTE C</text>
<text class="f-l" x="332" y="290" text-anchor="end">ESTANTE D</text>
