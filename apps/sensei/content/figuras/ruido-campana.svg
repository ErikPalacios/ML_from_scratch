<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 562" role="img" aria-labelledby="f-ruido-campana-t" class="f-svg" style="max-width:420px">
<title id="f-ruido-campana-t">Arriba, una campana: cómo se reparten los resultados de muchos exámenes de 1,000 fotos con un modelo que acierta 85 %. El 68 % de los resultados cae entre 83.9 y 86.1 (una desviación estándar, 1.1 puntos, a cada lado); el 95 %, entre 82.7 y 87.3 (dos desviaciones), y el 99.7 %, entre 81.6 y 88.4 (tres). Abajo, el ancho de lo que puede salir por azar con 95 % para cuatro tamaños de examen: 100 fotos, más o menos 7 puntos; 1,000 fotos, 2.2; 4,000 fotos, 1.1; 50,000 fotos, 0.3. Cuatro veces más fotos dan la mitad de ancho.</title>
