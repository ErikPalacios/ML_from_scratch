<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 464" role="img" aria-labelledby="f-concurrencia-llegadas-t" class="f-svg" style="max-width:420px">
<title id="f-concurrencia-llegadas-t">Tres minutos de la hora pico del despacho, simulados con llegadas al azar a 0.21 preguntas por segundo. Arriba, cada pregunta es una barra de 27 segundos: las que empezaron antes siguen vivas al arrancar; llegan 34 nuevas en 3 minutos, a veces separadas y a veces juntas. Abajo, cuántas conversaciones hay a la vez en cada segundo: sube y baja, y llega a 11 en el peor momento, alrededor de un promedio de 5.6 que da la ley de Little; la línea de 8 es el diseño del despacho.</title>
<text class="f-l" x="14" y="24">3 MINUTOS DE LA HORA PICO, AL AZAR</text>
