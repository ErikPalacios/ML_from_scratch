<text class="f-l" x="28" y="346">LA CUENTA</text>
<text class="f-t" x="28" y="372">(n + 2p − k) ÷ s + 1</text>
<text class="f-s" x="28" y="396">n = 5, k = 3, p = 1, s = 2:</text>
<text class="f-s" x="28" y="416">(5 + 2 − 3) ÷ 2 + 1 = 3</text>
<text class="f-s" x="28" y="432" style="font-size:12px;fill:var(--muted)">si la división no es exacta, redondea hacia abajo</text>
