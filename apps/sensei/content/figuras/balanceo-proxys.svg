<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 430" role="img" aria-labelledby="f-balanceo-proxys-t" class="f-svg" style="max-width:420px">
<title id="f-balanceo-proxys-t">Dos intermediarios. Arriba, un proxy a nombre de los clientes: tres empleados de una empresa salen a internet por el mismo proxy, que está dentro de la red de la empresa, y el sitio de afuera solo ve la dirección del proxy. Abajo, un proxy inverso a nombre de los servidores: un cliente habla con una sola dirección, la del proxy inverso, que está del lado de los servidores y pasa cada request a uno de tres servidores; el cliente no sabe cuántos hay detrás.</title>
<defs><marker id="fpx-a" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="f-punta"/></marker></defs>
<rect class="f-card" x="10" y="10" width="340" height="200" rx="16"/>
<text class="f-l" x="26" y="36">PROXY: A NOMBRE DE LOS CLIENTES</text>
<rect x="18" y="50" width="214" height="124" rx="12" style="fill:none;stroke:var(--o);stroke-width:1.5;stroke-dasharray:5 4"/>
<text class="f-s" x="26" y="168" style="font-size:12px;fill:var(--o);font-weight:700">la red de la empresa</text>
<rect class="f-chip" x="26" y="60" width="74" height="26" rx="8"/>
<text class="f-s" x="63" y="78" text-anchor="middle" style="font-size:12px">empleado 1</text>
<rect class="f-chip" x="26" y="94" width="74" height="26" rx="8"/>
<text class="f-s" x="63" y="112" text-anchor="middle" style="font-size:12px">empleado 2</text>
<rect class="f-chip" x="26" y="128" width="74" height="26" rx="8"/>
<text class="f-s" x="63" y="146" text-anchor="middle" style="font-size:12px">empleado 3</text>
<line class="f-flecha" x1="100" y1="73" x2="140" y2="100" marker-end="url(#fpx-a)"/>
<line class="f-flecha" x1="100" y1="107" x2="140" y2="107" marker-end="url(#fpx-a)"/>
<line class="f-flecha" x1="100" y1="141" x2="140" y2="114" marker-end="url(#fpx-a)"/>
<rect class="f-dark" x="146" y="84" width="76" height="46" rx="10"/>
<text class="f-dark-t" x="184" y="112" text-anchor="middle" style="font-weight:700">proxy</text>
<line class="f-flecha" x1="222" y1="107" x2="256" y2="107" marker-end="url(#fpx-a)"/>
<rect class="f-chip" x="262" y="90" width="76" height="34" rx="8"/>
<text class="f-s" x="300" y="105" text-anchor="middle" style="font-size:12px">sitio de</text>
<text class="f-s" x="300" y="119" text-anchor="middle" style="font-size:12px">afuera</text>
<text class="f-t" x="26" y="196" style="font-size:13px">El sitio ve una sola IP: la del proxy.</text>
<rect class="f-card" x="10" y="222" width="340" height="200" rx="16"/>
<text class="f-l" x="26" y="248">PROXY INVERSO: A NOMBRE DE LOS SERVIDORES</text>
<rect x="128" y="262" width="214" height="124" rx="12" style="fill:none;stroke:var(--b);stroke-width:1.5;stroke-dasharray:5 4"/>
<text class="f-s" x="334" y="380" text-anchor="end" style="font-size:12px;fill:var(--b);font-weight:700">tus servidores</text>
<rect class="f-chip" x="22" y="302" width="76" height="34" rx="8"/>
<text class="f-s" x="60" y="317" text-anchor="middle" style="font-size:12px">un</text>
<text class="f-s" x="60" y="331" text-anchor="middle" style="font-size:12px">cliente</text>
<line class="f-flecha" x1="98" y1="319" x2="132" y2="319" marker-end="url(#fpx-a)"/>
<rect class="f-dark" x="138" y="296" width="76" height="46" rx="10"/>
<text class="f-dark-t" x="176" y="316" text-anchor="middle" style="font-weight:700">proxy</text>
<text class="f-dark-t" x="176" y="332" text-anchor="middle" style="font-weight:700">inverso</text>
<line class="f-flecha" x1="214" y1="312" x2="254" y2="285" marker-end="url(#fpx-a)"/>
<line class="f-flecha" x1="214" y1="319" x2="254" y2="319" marker-end="url(#fpx-a)"/>
<line class="f-flecha" x1="214" y1="326" x2="254" y2="353" marker-end="url(#fpx-a)"/>
<rect class="f-chip" x="260" y="272" width="74" height="26" rx="8"/>
<text class="f-s" x="297" y="290" text-anchor="middle" style="font-size:12px">servidor 1</text>
<rect class="f-chip" x="260" y="306" width="74" height="26" rx="8"/>
<text class="f-s" x="297" y="324" text-anchor="middle" style="font-size:12px">servidor 2</text>
<rect class="f-chip" x="260" y="340" width="74" height="26" rx="8"/>
<text class="f-s" x="297" y="358" text-anchor="middle" style="font-size:12px">servidor 3</text>
<text class="f-t" x="26" y="408" style="font-size:13px">El cliente ve una sola dirección: la del proxy.</text>
</svg>
