<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 420" role="img" aria-labelledby="f-percentiles-histograma-t" class="f-svg" style="max-width:420px">
<title id="f-percentiles-histograma-t">Histograma de 1,000 requests de juguete en un minuto malo. Barras de 10 en 10 milisegundos de 0 a 150: casi todas las requests caen entre 20 y 60 ms, con el pico entre 30 y 40 ms (360 requests). A la derecha, la cola, en tres barras más anchas: 6 requests entre 150 y 300 ms, 13 entre 300 y 500 y 10 entre 500 y 700. Líneas verticales: la mediana en 38 ms, el promedio en 51 ms, el p95 en 70 ms y el p99 en 488 ms, dentro de la cola. 811 de las 1,000 requests tardaron menos que el promedio.</title>
