<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 330" role="img" aria-labelledby="f-apis-base64-t" class="f-svg" style="max-width:420px">
<title id="f-apis-base64-t">Cómo base64 convierte 3 bytes en 4 letras. Arriba, los tres primeros bytes de cualquier JPEG: FF, D8 y FF. En medio, sus 24 bits seguidos: 11111111, 11011000, 11111111. Abajo, los mismos 24 bits cortados en cuatro grupos de 6: 111111, 111101, 100011 y 111111, que valen 63, 61, 35 y 63, y que en el alfabeto de base64 son las letras diagonal, 9, j y diagonal. Por eso todo JPEG escrito en base64 empieza con diagonal 9 j diagonal. Cuatro letras por cada tres bytes: un 33 por ciento más.</title>
