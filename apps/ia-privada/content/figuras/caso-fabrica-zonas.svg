<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" role="img" aria-labelledby="f-caso-fabrica-zonas-t" class="f-svg" style="max-width:420px">
<title id="f-caso-fabrica-zonas-t">Los niveles de la planta según el modelo de Purdue, de arriba abajo: niveles 4 y 5, la empresa (ERP y correo, en el site de TI); nivel 3.5, la DMZ industrial (la carpeta de importación de manuales y el espejo de actualizaciones); nivel 3, operaciones del sitio (MES e historiador, en el gabinete de la nave); nivel 2, las pantallas de supervisión de cada línea; niveles 0 y 1, los PLCs, los robots y las prensas. A la derecha, la zona del asistente (gateway, vLLM con el modelo y Qdrant), pegada a la DMZ. Tres conductos llegan a ella: desde la carpeta de la DMZ entran los manuales; desde la WiFi de planta, donde están las tablets, solo HTTPS al puerto 443; y la gestión desde OT. No hay ninguna flecha de la zona del asistente hacia los niveles 0 a 2 ni hacia internet.</title>
<text class="f-l" x="14" y="22">LA PLANTA POR NIVELES · Y DÓNDE VA EL ASISTENTE</text>
<rect class="f-chip" x="10" y="36" width="196" height="54" rx="10"/>
<text class="f-l" x="20" y="54">NIVELES 4–5 · IT</text>
<text class="f-s" x="20" y="74" style="font-size:12px">ERP, correo, laptops</text>
<rect class="f-y" x="10" y="100" width="196" height="64" rx="10"/>
<text class="f-l" style="fill:#14183A" x="20" y="118">NIVEL 3.5 · DMZ INDUSTRIAL</text>
<text class="f-s" x="20" y="138" style="fill:#14183A;font-size:12px">carpeta de manuales</text>
<text class="f-s" x="20" y="154" style="fill:#14183A;font-size:12px">espejo de actualizaciones</text>
<rect class="f-b2" x="10" y="174" width="196" height="54" rx="10"/>
<text class="f-l" x="20" y="192">NIVEL 3 · OPERACIONES</text>
<text class="f-s" x="20" y="212" style="font-size:12px">MES, historiador</text>
<rect class="f-card" x="10" y="238" width="196" height="54" rx="10"/>
<text class="f-l" x="20" y="256">NIVEL 2 · SUPERVISIÓN</text>
<text class="f-s" x="20" y="276" style="font-size:12px">pantallas de cada línea</text>
<rect class="f-card" x="10" y="302" width="196" height="54" rx="10"/>
<text class="f-l" x="20" y="320">NIVELES 0–1 · CONTROL</text>
<text class="f-s" x="20" y="340" style="font-size:12px">PLCs, robots, prensas</text>
<rect class="f-g" x="226" y="100" width="124" height="128" rx="12"/>
<text class="f-l" style="fill:#14183A" x="238" y="118">ZONA DEL</text>
<text class="f-l" style="fill:#14183A" x="238" y="132">ASISTENTE</text>
<rect class="f-dark" x="238" y="142" width="100" height="74" rx="8"/>
<text class="f-dark-t" x="288" y="164" text-anchor="middle" style="font-size:13px">gateway</text>
<text class="f-dark-t" x="288" y="184" text-anchor="middle" style="font-size:13px">vLLM · modelo</text>
<text class="f-dark-t" x="288" y="204" text-anchor="middle" style="font-size:13px">Qdrant</text>
<line class="f-flecha" x1="206" y1="132" x2="218" y2="132"/><path class="f-punta" d="M216,126 L216,138 L224,132 Z"/>
<text class="f-s" x="214" y="94" style="font-size:12px">1 · entran manuales</text>
<rect class="f-b" x="226" y="302" width="124" height="54" rx="10"/>
<text class="f-l" style="fill:#fff" x="238" y="320">WIFI DE PLANTA</text>
<text class="f-s" x="238" y="340" style="fill:#fff;font-size:11px">tablets, 30 técnicos</text>
<line class="f-flecha" x1="288" y1="302" x2="288" y2="236"/><path class="f-punta" d="M282,238 L294,238 L288,230 Z"/>
<text class="f-s" x="282" y="270" text-anchor="end" style="font-size:12px">2 · solo</text>
<text class="f-s" x="282" y="286" text-anchor="end" style="font-size:12px">HTTPS :443</text>
<line class="f-flecha" x1="206" y1="200" x2="218" y2="200" style="stroke-dasharray:3 3"/><path class="f-punta" d="M216,194 L216,206 L224,200 Z"/>
<text class="f-s" x="214" y="248" style="font-size:12px">3 · gestión</text>
<text class="f-s" x="14" y="384" style="font-weight:700">Ningún conducto va a los niveles 0–2</text>
<text class="f-s" x="14" y="402" style="font-size:12px">ni a internet: el asistente solo lee manuales.</text>
<text class="f-s" x="14" y="426" style="font-size:12px">La zona es de seguridad, no de edificio: el</text>
<text class="f-s" x="14" y="442" style="font-size:12px">servidor vive en el site de TI, con una fibra</text>
<text class="f-s" x="14" y="458" style="font-size:12px">propia a la DMZ y ningún cable a la oficina.</text>
</svg>
