<text class="f-s" x="28" y="228" style="font-size:12px">224 × 224 píxeles</text>
<text class="f-s" x="28" y="246" style="font-size:12px;font-weight:700">14 × 14 = 196 parches</text>
<line x1="83" y1="123.5" x2="228" y2="100.0" style="stroke:var(--yd);stroke-width:2;stroke-dasharray:4 4"/>
<rect class="f-y" x="228" y="58" width="84" height="84" rx="8"/>
<text class="f-s" x="270" y="94" text-anchor="middle" style="fill:var(--navy);font:700 15px var(--sans)">16 × 16</text>
<text class="f-s" x="270" y="114" text-anchor="middle" style="fill:var(--navy);font:600 12px var(--sans)">píxeles × 3</text>
<text class="f-s" x="270" y="164" text-anchor="middle" style="font-size:13px;font-weight:700">= 768 números</text>
<line class="f-flecha" x1="270" y1="172" x2="270" y2="187"/>
<path class="f-punta" d="M263,185 L277,185 L270,194 Z"/>
<rect class="f-dark" x="212" y="198" width="116" height="44" rx="10"/>
<text class="f-dark-t" x="270" y="217" text-anchor="middle">densa 768 → 768</text>
<text class="f-dark-l" x="270" y="233" text-anchor="middle">UN TOKEN</text>
<text class="f-l" x="28" y="278">197 TOKENS DE 768 NÚMEROS</text>
<rect class="f-p" x="28" y="290" width="46" height="30" rx="15"/>
<text class="f-pill-t" x="51" y="310" text-anchor="middle" style="font-size:12px">CLS</text>
<rect class="f-b" x="80" y="290" width="46" height="30" rx="15"/>
<text class="f-pill-t" x="103" y="310" text-anchor="middle" style="font-size:14px">1</text>
<rect class="f-b" x="132" y="290" width="46" height="30" rx="15"/>
<text class="f-pill-t" x="155" y="310" text-anchor="middle" style="font-size:14px">2</text>
<rect class="f-b" x="184" y="290" width="46" height="30" rx="15"/>
<text class="f-pill-t" x="207" y="310" text-anchor="middle" style="font-size:14px">3</text>
<rect class="f-off" x="236" y="290" width="46" height="30" rx="15"/>
<text class="f-s" x="259" y="310" text-anchor="middle" style="font-size:15px;font-weight:700">…</text>
<rect class="f-b" x="288" y="290" width="46" height="30" rx="15"/>
<text class="f-pill-t" x="311" y="310" text-anchor="middle" style="font-size:14px">196</text>
<line class="f-flecha" x1="180" y1="326" x2="180" y2="341"/>
<path class="f-punta" d="M173,339 L187,339 L180,348 Z"/>
<rect class="f-dark" x="28" y="352" width="304" height="52" rx="12"/>
<text class="f-dark-t" x="180" y="374" text-anchor="middle" style="font-size:14px;font-weight:700">Transformer · 12 bloques</text>
<text class="f-dark-l" x="180" y="392" text-anchor="middle">CADA PARCHE MIRA A TODOS</text>
<text class="f-s" x="180" y="430" text-anchor="middle">la respuesta sale del token [CLS]</text>
</svg>
