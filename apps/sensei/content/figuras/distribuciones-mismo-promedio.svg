<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 500" role="img" aria-labelledby="f-distribuciones-mismo-promedio-t" class="f-svg" style="max-width:420px">
<title id="f-distribuciones-mismo-promedio-t">Dos histogramas del brillo de las fotos de C01, en 5 bins de 0 a 255. Arriba, octubre, la referencia: 10, 20, 40, 20 y 10 por ciento, con la mayoría en el bin de en medio; desviación estándar de unos 56 niveles. Abajo, una semana rara: 30, 15, 10, 15 y 30 por ciento, con la mayoría en los extremos, muy oscuras y muy claras; desviación de unos 84. Las dos tienen el mismo promedio, unos 128, marcado con una línea punteada.</title>
