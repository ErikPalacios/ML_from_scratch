<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 560" role="img" aria-labelledby="f-agentes-plantilla-t" class="f-svg" style="max-width:420px">
<title id="f-agentes-plantilla-t">Lo que manda el programa a la API y lo que de verdad lee Qwen3 32B. Arriba, los cinco mensajes de la API: system, tools, user, assistant con tool_calls y tool con el resultado. La plantilla de chat de Qwen3 los convierte en una sola fila de texto: el mensaje de sistema con las definiciones de las tools pegadas en inglés dentro de etiquetas tools; el turno del usuario; el turno del asistente con la llamada como texto entre etiquetas tool_call; y el resultado de la tool, que vuelve dentro de un turno de user envuelto en etiquetas tool_response. Al final, un bloque think vacío porque el razonamiento está apagado.</title>
<text class="f-l" x="14" y="24">LO QUE MANDA EL PROGRAMA (LA API)</text>
<rect class="f-card" x="10" y="34" width="340" height="96" rx="16"/>
<rect class="f-b2" x="24" y="48" width="100" height="28" rx="14"/>
<text class="f-s" x="74.0" y="67" text-anchor="middle" style="font-size:12px;font-weight:700;fill:var(--ink)">system</text>
<rect class="f-b2" x="132" y="48" width="96" height="28" rx="14"/>
<text class="f-s" x="180.0" y="67" text-anchor="middle" style="font-size:12px;font-weight:700;fill:var(--ink)">tools</text>
<rect class="f-chip" x="236" y="48" width="100" height="28" rx="14"/>
<text class="f-s" x="286.0" y="67" text-anchor="middle" style="font-size:12px;font-weight:700;fill:var(--ink)">user</text>
<rect class="f-y" x="24" y="88" width="152" height="28" rx="14"/>
<text class="f-s" x="100.0" y="107" text-anchor="middle" style="font-size:12px;font-weight:700;fill:var(--ink)">assistant: tool_calls</text>
<rect class="f-o" x="184" y="88" width="152" height="28" rx="14"/>
<text class="f-s" x="260.0" y="107" text-anchor="middle" style="font-size:12px;font-weight:700;fill:var(--ink)">tool: resultado</text>
<line class="f-flecha" x1="180" y1="132" x2="180" y2="156"/><path class="f-punta" d="M174,154 L186,154 L180,162 Z"/>
<text class="f-s" x="192" y="150" style="font-size:12px">la plantilla de chat de Qwen3</text>
<text class="f-l" x="14" y="182">LO QUE LEE EL MODELO: UNA SOLA FILA DE TEXTO</text>
<rect class="f-card" x="10" y="192" width="340" height="300" rx="16"/>
<rect class="f-b2" x="20" y="234.0" width="320" height="51.5" rx="6" style="opacity:.55"/>
<rect class="f-y" x="20" y="349.5" width="320" height="51.5" rx="6" style="opacity:.55"/>
<rect class="f-o" x="20" y="399.0" width="320" height="68.0" rx="6" style="opacity:.55"/>
<text class="f-s" style="font-family:var(--mono);font-size:12px" x="28" y="214.0">&lt;|im_start|&gt;system</text>
<text class="f-s" style="font-family:var(--mono);font-size:12px" x="28" y="230.5">Eres el asistente del despacho.</text>
<text class="f-s" style="font-family:var(--mono);font-size:12px" x="28" y="247.0"># Tools … &lt;tools&gt;</text>
<text class="f-s" style="font-family:var(--mono);font-size:12px" x="28" y="263.5">{"name": "leer_pagina", …}</text>
<text class="f-s" style="font-family:var(--mono);font-size:12px" x="28" y="280.0">&lt;/tools&gt; … &lt;tool_call&gt;&lt;/tool_call&gt;</text>
<text class="f-s" style="font-family:var(--mono);font-size:12px" x="28" y="296.5">&lt;|im_end|&gt;</text>
<text class="f-s" style="font-family:var(--mono);font-size:12px" x="28" y="313.0">&lt;|im_start|&gt;user</text>
<text class="f-s" style="font-family:var(--mono);font-size:12px" x="28" y="329.5">Lee la página 4 del EXP-0412.</text>
<text class="f-s" style="font-family:var(--mono);font-size:12px" x="28" y="346.0">&lt;|im_start|&gt;assistant</text>
<text class="f-s" style="font-family:var(--mono);font-size:12px" x="28" y="362.5">&lt;tool_call&gt;</text>
<text class="f-s" style="font-family:var(--mono);font-size:12px" x="28" y="379.0">{"name": "leer_pagina", "arguments": …}</text>
<text class="f-s" style="font-family:var(--mono);font-size:12px" x="28" y="395.5">&lt;/tool_call&gt;&lt;|im_end|&gt;</text>
<text class="f-s" style="font-family:var(--mono);font-size:12px" x="28" y="412.0">&lt;|im_start|&gt;user</text>
<text class="f-s" style="font-family:var(--mono);font-size:12px" x="28" y="428.5">&lt;tool_response&gt;</text>
<text class="f-s" style="font-family:var(--mono);font-size:12px" x="28" y="445.0">CLÁUSULA OCTAVA. Penalización…</text>
<text class="f-s" style="font-family:var(--mono);font-size:12px" x="28" y="461.5">&lt;/tool_response&gt;&lt;|im_end|&gt;</text>
<text class="f-s" style="font-family:var(--mono);font-size:12px" x="28" y="478.0">&lt;|im_start|&gt;assistant &lt;think&gt;&lt;/think&gt;</text>
<rect class="f-b2" x="20" y="500" width="14" height="12" rx="3"/>
<text class="f-s" x="42" y="510" style="font-size:12px">las tools, pegadas al sistema, en inglés</text>
<rect class="f-y" x="20" y="517" width="14" height="12" rx="3"/>
<text class="f-s" x="42" y="527" style="font-size:12px">la llamada: texto que el parser convierte</text>
<rect class="f-o" x="20" y="534" width="14" height="12" rx="3"/>
<text class="f-s" x="42" y="544" style="font-size:12px">el resultado vuelve como turno de user</text>
</svg>
