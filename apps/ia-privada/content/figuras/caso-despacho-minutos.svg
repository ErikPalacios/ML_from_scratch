<title id="f-caso-despacho-minutos-t">Una caída vista minuto a minuto, de 10:57 a 11:12. Cada cuadro es una sonda: verde si pasó, naranja si falló. Fallan de 11:01 a 11:08, ocho minutos. Debajo, el promedio de las últimas 5 sondas: baja a 0.6 a las 11:02, cuando se cumple la condición de la alerta; con un minuto de espera la alerta 7 se prende a las 11:03 y se apaga a las 11:12, cuando el promedio vuelve a 0.8. Los 8 minutos naranjas cuentan contra los 132 del mes.</title>
