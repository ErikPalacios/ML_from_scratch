<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 500" role="img" aria-labelledby="f-caso-gobierno-compra-t" class="f-svg" style="max-width:420px">
<title id="f-caso-gobierno-compra-t">El calendario de la compra pública del servidor, en meses desde el requerimiento (estimación, no dato). Del mes 0 al 1.5, la necesidad, la investigación de mercado y el anexo técnico; del 1.5 al 3, la suficiencia presupuestal y el dictamen de TIC; del 3 al 3.7, de la convocatoria a la apertura de proposiciones, al menos 20 días naturales en una licitación internacional (plazo de la ley); del 3.7 al 4.5, la evaluación, el fallo y el contrato; del 4.5 al 7.5, la entrega del servidor, ≈ 3 meses porque la tarjeta escasea; del 7.5 al 8, la instalación y la aceptación, hasta 10 días hábiles (ley); del 8 al 8.8, el pago, hasta 17 días hábiles desde la factura verificada (ley). El servidor llega a los ≈ 7 u 8 meses y se paga a los ≈ 9; lo que no se compre ahora espera otra vuelta.</title>
<text class="f-l" x="14" y="22">LA COMPRA PÚBLICA · MES A MES</text>
<text class="f-s" x="14" y="40" style="font-size:12px">azul fuerte, verde y amarillo: plazos de la ley;</text>
<text class="f-s" x="14" y="55" style="font-size:12px">lo demás, supuesto</text>
<text class="f-s" x="14" y="76" style="font-size:12px">Necesidad, mercado y anexo técnico</text>
<rect class="f-b2" x="14.0" y="82" width="55.3" height="14" rx="4"/>
<text class="f-s" x="14" y="118" style="font-size:12px">Presupuesto y dictamen de TIC</text>
<rect class="f-b2" x="69.3" y="124" width="55.3" height="14" rx="4"/>
<text class="f-s" x="14" y="160" style="font-size:12px">Convocatoria a apertura · <tspan style="font-weight:700">≥ 20 días naturales</tspan></text>
<rect class="f-b" x="124.7" y="166" width="25.8" height="14" rx="4"/>
<text class="f-s" x="14" y="202" style="font-size:12px">Evaluación, fallo y contrato</text>
<rect class="f-b2" x="150.5" y="208" width="29.5" height="14" rx="4"/>
<text class="f-s" x="14" y="244" style="font-size:12px">Entrega del servidor · <tspan style="font-weight:700">≈ 3 meses, la tarjeta escasea</tspan></text>
<rect class="f-o" x="180.0" y="250" width="110.7" height="14" rx="4"/>
<text class="f-s" x="14" y="286" style="font-size:12px">Instalación y aceptación · <tspan style="font-weight:700">≤ 10 hábiles</tspan></text>
<rect class="f-g" x="290.7" y="292" width="18.4" height="14" rx="4"/>
<text class="f-s" x="14" y="328" style="font-size:12px">Pago · <tspan style="font-weight:700">≤ 17 hábiles</tspan></text>
<rect class="f-y" x="309.1" y="334" width="29.5" height="14" rx="4"/>
<line class="f-linea" x1="14.0" y1="358" x2="14.0" y2="363"/>
<text class="f-s" x="14.0" y="377" text-anchor="middle" style="font-size:12px">0</text>
<line class="f-linea" x1="50.9" y1="358" x2="50.9" y2="363"/>
<text class="f-s" x="50.9" y="377" text-anchor="middle" style="font-size:12px">1</text>
<line class="f-linea" x1="87.8" y1="358" x2="87.8" y2="363"/>
<text class="f-s" x="87.8" y="377" text-anchor="middle" style="font-size:12px">2</text>
<line class="f-linea" x1="124.7" y1="358" x2="124.7" y2="363"/>
<text class="f-s" x="124.7" y="377" text-anchor="middle" style="font-size:12px">3</text>
<line class="f-linea" x1="161.6" y1="358" x2="161.6" y2="363"/>
<text class="f-s" x="161.6" y="377" text-anchor="middle" style="font-size:12px">4</text>
<line class="f-linea" x1="198.4" y1="358" x2="198.4" y2="363"/>
<text class="f-s" x="198.4" y="377" text-anchor="middle" style="font-size:12px">5</text>
<line class="f-linea" x1="235.3" y1="358" x2="235.3" y2="363"/>
<text class="f-s" x="235.3" y="377" text-anchor="middle" style="font-size:12px">6</text>
<line class="f-linea" x1="272.2" y1="358" x2="272.2" y2="363"/>
<text class="f-s" x="272.2" y="377" text-anchor="middle" style="font-size:12px">7</text>
<line class="f-linea" x1="309.1" y1="358" x2="309.1" y2="363"/>
<text class="f-s" x="309.1" y="377" text-anchor="middle" style="font-size:12px">8</text>
<line class="f-linea" x1="346.0" y1="358" x2="346.0" y2="363"/>
<text class="f-s" x="346.0" y="377" text-anchor="middle" style="font-size:12px">9</text>
<text class="f-l" x="14" y="396">MESES DESDE EL REQUERIMIENTO</text>
<rect class="f-chip" x="14" y="410" width="332" height="76" rx="10"/>
<text class="f-s" x="26" y="434" style="font-size:12.5px">El servidor llega a los ≈ 7–8 meses y se paga</text>
<text class="f-s" x="26" y="454" style="font-size:12.5px">a los ≈ 9. Lo que no se compre ahora (un</text>
<text class="f-s" x="26" y="474" style="font-size:12.5px">segundo servidor, una tarjeta) espera otra vuelta.</text>
</svg>
