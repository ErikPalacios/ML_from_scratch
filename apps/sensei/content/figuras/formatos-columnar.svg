<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 418" role="img" aria-labelledby="f-formatos-columnar-t" class="f-svg" style="max-width:420px">
<title id="f-formatos-columnar-t">Una tabla de cuatro predicciones con cuatro columnas: request_id, top1, score y ms. Por filas, como en CSV o JSON Lines, los 16 valores quedan intercalados: los cuatro de la fila 1, luego los cuatro de la fila 2, y así; para sacar top1 y score hay que leer los 16. Por columnas, como en Parquet, quedan los cuatro request_id juntos, luego los cuatro top1, los cuatro score y los cuatro ms; para sacar top1 y score basta con leer dos tramos seguidos de cuatro valores, 8 de 16, y los otros dos tramos ni se tocan.</title>
<rect class="f-card" x="10" y="10" width="340" height="398" rx="16"/>
<text class="f-l" x="22" y="36">LA TABLA: 4 PREDICCIONES, 4 COLUMNAS</text>

<rect class="f-b" x="22" y="50" width="12" height="12" rx="3"/>
<text class="f-s" x="40" y="61" style="font:700 12px var(--mono)">request_id</text>
<rect class="f-o" x="128" y="50" width="12" height="12" rx="3"/>
<text class="f-s" x="146" y="61" style="font:700 12px var(--mono)">top1</text>
<rect class="f-g" x="208" y="50" width="12" height="12" rx="3"/>
<text class="f-s" x="226" y="61" style="font:700 12px var(--mono)">score</text>
<rect class="f-p" x="284" y="50" width="12" height="12" rx="3"/>
<text class="f-s" x="302" y="61" style="font:700 12px var(--mono)">ms</text>

<text class="f-s" x="22" y="82" style="font:12px var(--mono)">1 · r-001</text>
<text class="f-s" x="128" y="82" style="font-size:12px">Tenis</text>
<text class="f-s" x="208" y="82" style="font:12px var(--mono)">0.83</text>
<text class="f-s" x="284" y="82" style="font:12px var(--mono)">41</text>
<text class="f-s" x="22" y="99" style="font:12px var(--mono)">2 · r-002</text>
<text class="f-s" x="128" y="99" style="font-size:12px">Botas</text>
<text class="f-s" x="208" y="99" style="font:12px var(--mono)">0.61</text>
<text class="f-s" x="284" y="99" style="font:12px var(--mono)">38</text>
<text class="f-s" x="22" y="116" style="font:12px var(--mono)">3 · r-003</text>
<text class="f-s" x="128" y="116" style="font-size:12px">Tenis</text>
<text class="f-s" x="208" y="116" style="font:12px var(--mono)">0.90</text>
<text class="f-s" x="284" y="116" style="font:12px var(--mono)">44</text>
<text class="f-s" x="22" y="133" style="font:12px var(--mono)">4 · r-004</text>
