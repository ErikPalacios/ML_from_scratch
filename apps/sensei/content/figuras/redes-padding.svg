<title id="f-redes-padding-t">Padding y stride. Arriba a la izquierda, la foto de 5 por 5 del ejemplo de convolución, rodeada por un marco de ceros que la vuelve de 7 por 7. Una ventana de 3 por 3 marcada en amarillo está en la esquina de arriba a la izquierda, y otra punteada está dos columnas a la derecha: con stride 2 la ventana salta de dos en dos. A la derecha, la salida de 3 por 3: menos 17, 16 y 1; menos 26, 25 y 1; menos 17, 16 y 1. La columna izquierda sale negativa porque el filtro confunde el marco de ceros con un borde. Abajo, la cuenta: n más 2p menos k, entre s, más 1; con n = 5, k = 3, p = 1 y s = 2 da 3.</title>
