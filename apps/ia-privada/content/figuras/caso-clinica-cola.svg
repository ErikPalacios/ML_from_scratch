<text class="f-s" x="188.2" y="114" style="font-size:12px">3.7</text>
<text class="f-t" x="14" y="148" style="font-size:14px">1 Server Edition (falló la otra)</text>
<text class="f-s" x="14" y="168" style="font-size:12px">12,000 sin fila</text>
<rect class="f-off" x="124" y="156" width="22.2" height="15" rx="3"/>
