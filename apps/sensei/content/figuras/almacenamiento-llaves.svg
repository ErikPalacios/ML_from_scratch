<line class="f-linea" x1="58" y1="110" x2="68" y2="110"/>
<rect class="f-y" x="72" y="104" width="16" height="12" rx="2"/>
<text class="f-s" x="96" y="115">11/</text>
<line class="f-linea" x1="80" y1="120" x2="80" y2="214"/>
<line class="f-linea" x1="80" y1="136" x2="90" y2="136"/>
<rect class="f-y" x="94" y="130" width="16" height="12" rx="2"/>
<text class="f-s" x="118" y="141" style="font-weight:700">06/</text>
<line class="f-linea" x1="102" y1="146" x2="102" y2="188"/>
<line class="f-linea" x1="102" y1="162" x2="112" y2="162"/>
<rect class="f-b2" x="116" y="155" width="11" height="14" rx="2"/>
<text class="f-s" x="134" y="167">ana-tenis.jpg</text>
<line class="f-linea" x1="102" y1="188" x2="112" y2="188"/>
<rect class="f-b2" x="116" y="181" width="11" height="14" rx="2"/>
<text class="f-s" x="134" y="193">beto-bici.jpg</text>
<line class="f-linea" x1="80" y1="214" x2="90" y2="214"/>
<rect class="f-y" x="94" y="208" width="16" height="12" rx="2"/>
<text class="f-s" x="118" y="219">07/</text>
<line class="f-linea" x1="102" y1="224" x2="102" y2="240"/>
<line class="f-linea" x1="102" y1="240" x2="112" y2="240"/>
<rect class="f-b2" x="116" y="233" width="11" height="14" rx="2"/>
<text class="f-s" x="134" y="245">caro-lampara.jpg</text>
<text class="f-s" x="206" y="104" style="font-size:12px">Parecen carpetas,</text>
<text class="f-s" x="206" y="120" style="font-size:12px">pero nadie las creó:</text>
<text class="f-s" x="206" y="136" style="font-size:12px">la consola las dibuja</text>
<text class="f-s" x="206" y="152" style="font-size:12px">cortando en cada «/».</text>
<rect class="f-y" x="28" y="256" width="16" height="12" rx="2"/>
<text class="f-s" x="52" y="267">logs/</text>
<text class="f-s" x="96" y="267" style="font-size:12px">(otra «carpeta», cerrada)</text>
