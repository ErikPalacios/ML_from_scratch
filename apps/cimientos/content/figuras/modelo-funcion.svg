<circle cx="268" cy="262" r="14" class="f-knob"/><line x1="268" y1="262" x2="258.0" y2="262.9" class="f-knob-i"/>
<circle cx="312" cy="262" r="14" class="f-knob"/><line x1="312" y1="262" x2="318.4" y2="254.3" class="f-knob-i"/>
<text class="f-dark-t" x="28" y="306">≈ 25 millones de perillas: sus parámetros</text>
