<line class="f-flecha" x1="221" y1="389" x2="228" y2="389"/><path class="f-punta" d="M227,384 L227,394 L236,389 Z"/>
<text class="f-s" x="28" y="438" style="font-size:12px">En fila. Entre GPUs: 1 vector por token.</text>
<line x1="28" y1="450" x2="332" y2="450" style="stroke:var(--tm-line);stroke-width:1"/>
