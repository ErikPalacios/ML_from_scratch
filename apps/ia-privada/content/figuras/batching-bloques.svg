<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 460" role="img" aria-labelledby="f-batching-bloques-t" class="f-svg" style="max-width:420px">
<title id="f-batching-bloques-t">PagedAttention con bloques de 16 tokens. Arriba, dos conversaciones vistas como las ve el modelo: la A tiene 42 tokens en tres bloques lógicos (16, 16 y 10), la B tiene 21 tokens en dos (16 y 5). En medio, la tabla de bloques de cada una dice dónde está cada bloque lógico en la memoria: A va a los bloques físicos 7, 1 y 12; B, a los 3 y 9. Abajo, la memoria del KV cache de la GPU como 16 bloques físicos: los de A y B están salteados y el resto está libre. Solo el último bloque de cada conversación tiene lugares vacíos: 6 en A y 11 en B.</title>
