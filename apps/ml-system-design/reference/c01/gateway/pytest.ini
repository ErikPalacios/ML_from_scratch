# Configuración de pytest del gateway: los tests corren sin GPU ni Triton (usan un cliente falso)
[pytest]
# La raíz del gateway entra al sys.path: los tests importan `app.main` igual que uvicorn en el contenedor
pythonpath = .
# Solo buscamos tests en tests/: no recorre el resto del repo
testpaths = tests
# Salida compacta: en CI importa la lista de fallos, no el detalle de cada test que pasa
addopts = -q
