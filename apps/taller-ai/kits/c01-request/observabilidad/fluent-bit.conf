# El Fluent Bit de cada nodo. LO ESCRIBES TÚ (paso 7). La misma configuración en los dos nodos; ${NODO} lo pone cada
# contenedor (a o b). Después de cambiarlo: python mundo/recargar.py fluent-bit
[SERVICE]
    Flush        1
    Log_Level    info
    HTTP_Server  On
    HTTP_Listen  0.0.0.0
    HTTP_Port    2020

[INPUT]
    Name  dummy
    Dummy {"nota": "todavía no lee nada"}
    Rate  0.01

[OUTPUT]
    Name   null
    Match  *

# TODO paso 7: cambia el dummy por la lectura de los logs del gateway (/var/log/containers/…, formato CRI) y el null
# por la subida a S3 (bucket ml-datos en http://s3:9000, /logs/crudo/AAAA/MM/DD/HH/<nodo>-<uuid>.gz, gzip, cada minuto,
# con buffer en disco en /var/fluent-bit/s3).
