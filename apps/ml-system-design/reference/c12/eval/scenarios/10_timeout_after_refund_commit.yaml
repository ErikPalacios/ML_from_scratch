# El caso que rompe agentes: el reembolso SE APLICÓ pero la respuesta no llegó en 3 s. Sin idempotencia, el
# reintento paga dos veces. Aquí: se consulta el estado por la key, se recupera el resultado, un solo reembolso.
id: timeout_after_refund_commit
customer_id: cust-1
orders:
  - order_id: A-1029
    customer_id: cust-1
    status: delivered
    currency: MXN
    items: [{item_id: I-1, title: Audífonos inalámbricos, price: "450.00"}]
    delivered_days_ago: 3
    shipment: {status: delivered, expected_in_days: -4}
faults:
  issue_refund: [timeout_after_commit]
model:
  - tool_calls: [{name: issue_refund, arguments: {order_id: A-1029, amount: 450.0, currency: MXN, reason: damaged}}]
  - content: "Listo: tu reembolso de 450 MXN está emitido."
turns:
  - customer: "A-1029 llegó roto, quiero el reembolso"
  - customer: "Confirmo"
    confirm: true
expect:
  outcome: answered
  state:
    refunds: [{order_id: A-1029, amount: "450.00"}]
  required_calls: [issue_refund]
