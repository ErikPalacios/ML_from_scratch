<line class="f-linea" x1="217" y1="240" x2="217" y2="270" style="stroke:var(--ink);stroke-width:2.5"/>
<line class="f-linea" x1="277" y1="240" x2="277" y2="270" style="stroke:var(--ink);stroke-width:2.5"/>
<text class="f-s" x="157" y="234" text-anchor="middle" style="font-size:12px;font-weight:700">1.475</text>
<text class="f-s" x="217" y="234" text-anchor="middle" style="font-size:12px;font-weight:700">1.975</text>
<text class="f-s" x="277" y="234" text-anchor="middle" style="font-size:12px;font-weight:700">2.475</text>
<text class="f-s" x="40" y="288" text-anchor="middle" style="font-size:12px">0.5</text>
<text class="f-s" x="100" y="288" text-anchor="middle" style="font-size:12px">1.0</text>
<text class="f-s" x="160" y="288" text-anchor="middle" style="font-size:12px">1.5</text>
<text class="f-s" x="220" y="288" text-anchor="middle" style="font-size:12px;font-weight:700;fill:var(--o)">2.0</text>
<text class="f-s" x="280" y="288" text-anchor="middle" style="font-size:12px">2.5</text>
<text class="f-s" x="340" y="288" text-anchor="end" style="font-size:12px">3.0 s</text>
<text class="f-t" x="24" y="308" style="font-size:14px">Cumple, cumple, no cumple</text>
</svg>
