# Configuración de pytest para TODO el caso c12: `cd reference/c12 && pytest` corre las cuatro carpetas.
# Sin GPU, sin modelo, sin red: el LLM es un guion (ScriptedChatModel) y los sistemas internos, un backend en memoria.
[pytest]
# La raíz entra al sys.path: los tests importan `agent.loop`, `guardrails.untrusted`, `eval.run_scenarios`, `service.app`
pythonpath = .
testpaths = agent/tests guardrails/tests eval/tests service/tests
# importlib: varias carpetas tests/ sin __init__.py no chocan por nombre
# -W error: una API deprecada hoy es un upgrade roto mañana
addopts = -q -W error --import-mode=importlib
