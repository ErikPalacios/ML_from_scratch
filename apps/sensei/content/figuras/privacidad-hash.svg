<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 452" role="img" aria-labelledby="f-privacidad-hash-t" class="f-svg" style="max-width:420px">
<title id="f-privacidad-hash-t">Hash sin llave contra HMAC. Arriba, sin llave: el teléfono 5512348907 pasa por SHA-256 y da la huella que empieza con bf7aa9b0df, que es la que guarda el log. El atacante pasa por el mismo SHA-256 todos los teléfonos posibles, de 5512340000 a 5512349999, y en el intento 8,908 obtiene la misma huella: encontró el teléfono. Abajo, con HMAC: el teléfono y una llave secreta guardada en KMS pasan juntos por HMAC y dan la huella 762a31827fc4. El atacante, que no tiene la llave, solo puede calcular SHA-256 de cada teléfono, y sus huellas nunca coinciden: cero aciertos.</title>
<rect class="f-card" x="10" y="10" width="340" height="206" rx="16"/>
<text class="f-l" x="24" y="34">SIN LLAVE · SHA-256</text>
<text class="f-l" x="283" y="50" text-anchor="middle">EN EL LOG</text>
<rect class="f-chip" x="20" y="58" width="100" height="32" rx="8"/>
<text class="f-s" x="70" y="79" text-anchor="middle">5512348907</text>
<path class="f-flecha" d="M120 74 L134 74"/><path class="f-punta" d="M134 69 L142 74 L134 79 Z"/>
<rect class="f-dark" x="142" y="58" width="64" height="32" rx="8"/>
<text class="f-dark-t" x="174" y="79" text-anchor="middle">SHA-256</text>
<path class="f-flecha" d="M206 74 L216 74"/><path class="f-punta" d="M216 69 L224 74 L216 79 Z"/>
<rect class="f-chip" x="224" y="58" width="118" height="32" rx="8"/>
<rect class="f-o" x="224" y="58" width="6" height="32" rx="3"/>
<text class="f-s" x="286" y="79" text-anchor="middle" style="font-family:var(--mono);font-size:12px">bf7aa9b0df…</text>
<text class="f-l" x="24" y="114">EL ATACANTE PRUEBA TODOS</text>
<rect class="f-chip" x="20" y="124" width="100" height="78" rx="8"/>
<text class="f-s" x="70" y="143" text-anchor="middle">5512340000</text>
<text class="f-s" x="70" y="160" text-anchor="middle">5512340001</text>
<text class="f-s" x="70" y="176" text-anchor="middle">…</text>
<text class="f-s" x="70" y="194" text-anchor="middle">5512349999</text>
<path class="f-flecha" d="M120 163 L134 163"/><path class="f-punta" d="M134 158 L142 163 L134 168 Z"/>
<rect class="f-dark" x="142" y="147" width="64" height="32" rx="8"/>
<text class="f-dark-t" x="174" y="168" text-anchor="middle">SHA-256</text>
<path class="f-flecha" d="M206 163 L216 163"/><path class="f-punta" d="M216 158 L224 163 L216 168 Z"/>
<rect class="f-chip" x="224" y="147" width="118" height="32" rx="8"/>
<rect class="f-g" x="224" y="147" width="6" height="32" rx="3"/>
<text class="f-t" x="286" y="168" text-anchor="middle" style="font-size:14px">¡la misma!</text>
<text class="f-s" x="286" y="200" text-anchor="middle" style="font-size:12px">en el intento 8,908</text>
<path class="f-linea" d="M283 92 L283 145" style="stroke-dasharray:4 4"/>
<rect class="f-card" x="10" y="232" width="340" height="210" rx="16"/>
<text class="f-l" x="24" y="256">CON HMAC · LA LLAVE VIVE EN KMS</text>
<rect class="f-chip" x="20" y="270" width="100" height="32" rx="8"/>
<text class="f-s" x="70" y="291" text-anchor="middle">5512348907</text>
<rect class="f-chip" x="20" y="310" width="100" height="32" rx="8"/>
<rect class="f-y" x="20" y="310" width="6" height="32" rx="3"/>
<text class="f-s" x="73" y="331" text-anchor="middle">llave secreta</text>
<path class="f-flecha" d="M120 286 L134 286"/><path class="f-punta" d="M134 281 L142 286 L134 291 Z"/>
<path class="f-flecha" d="M120 326 L134 326"/><path class="f-punta" d="M134 321 L142 326 L134 331 Z"/>
<rect class="f-dark" x="142" y="270" width="64" height="72" rx="8"/>
<text class="f-dark-t" x="174" y="311" text-anchor="middle">HMAC</text>
<path class="f-flecha" d="M206 306 L216 306"/><path class="f-punta" d="M216 301 L224 306 L216 311 Z"/>
<rect class="f-chip" x="224" y="290" width="118" height="32" rx="8"/>
<rect class="f-b" x="224" y="290" width="6" height="32" rx="3"/>
<text class="f-s" x="286" y="311" text-anchor="middle" style="font-family:var(--mono);font-size:12px">762a31827f…</text>
<text class="f-l" x="24" y="366">SIN LA LLAVE, EL ATACANTE…</text>
<rect class="f-chip" x="20" y="376" width="100" height="32" rx="8"/>
<text class="f-s" x="70" y="397" text-anchor="middle">10,000 tels.</text>
<path class="f-flecha" d="M120 392 L134 392"/><path class="f-punta" d="M134 387 L142 392 L134 397 Z"/>
<rect class="f-dark" x="142" y="376" width="64" height="32" rx="8"/>
<text class="f-dark-t" x="174" y="397" text-anchor="middle">SHA-256</text>
<path class="f-flecha" d="M206 392 L216 392"/><path class="f-punta" d="M216 387 L224 392 L216 397 Z"/>
<rect class="f-chip" x="224" y="376" width="118" height="32" rx="8"/>
<rect class="f-off" x="224" y="376" width="6" height="32" rx="3"/>
<text class="f-t" x="286" y="397" text-anchor="middle" style="font-size:14px">0 aciertos</text>
<text class="f-s" x="180" y="430" text-anchor="middle" style="font-size:12px">Sin la llave, no hay qué probar: son 2²⁵⁶ llaves.</text>
</svg>
